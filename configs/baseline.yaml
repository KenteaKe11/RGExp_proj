# ═════════════════════════════════════════════════════════════════════════════
# §2.1 — SO SÁNH BASEMODEL
#
# Câu hỏi: ba VLM đa dụng/y tế CHƯA hề thấy ảnh X-quang của bộ này sinh báo cáo
# tốt tới đâu, và khác biệt giữa chúng có phải là thật hay chỉ là nhiễu lấy mẫu?
#
# Thiết kế: 3 candidate × CÙNG 3000 ảnh test × CÙNG một prompt × CÙNG tham số
# decode. Mọi khác biệt quan sát được vì thế quy về model, không về điều kiện.
# Vì cả ba chấm trên CÙNG tập ảnh nên các mẫu là GHÉP CẶP (paired) — dùng đúng
# hai kiểm định cho dữ liệu ghép cặp, rồi hiệu chỉnh p-value cho bội kiểm định.
#
# Ghi đè từ dòng lệnh:  --set generate.max_new_tokens=128
# ═════════════════════════════════════════════════════════════════════════════

seed: 42

# ── Dữ liệu ─────────────────────────────────────────────────────────────────
# TestSet 3k KHÔNG được lấy mới: split_ref/test_split.csv trong repo HF đã chốt
# 3000 key (seed 42) và mọi thí nghiệm sau của luận văn phải chấm trên đúng tập
# đó. Lấy mẫu lại ở đây là làm hỏng khả năng so sánh với §2.2 trở đi.
data:
  repo: RGExp123/MIMIC_CXR_cleaned
  repo_type: dataset
  split_csv: split_ref/test_split.csv     # 3000 img_rel, đã chốt
  meta_csv: csv_helper/clean_dataset.csv  # nguồn text_gt
  image_zip: img_dir.zip                  # 17.7 GB
  key_column: img_rel
  ref_column: text_gt
  n_test: 3000            # 0 = lấy trọn file split
  cache_dir: ./data
  image_max_side: 768     # ảnh cache lại ở cạnh dài này (đủ cho mọi processor)

  # img_dir.zip nặng 17.7 GB nhưng ta chỉ cần 3000/157917 ảnh (~2%).
  #   stream   — đọc central directory rồi RANGE-request từng entry cần lấy.
  #              Tốn ~200 MB mạng thay vì 17.7 GB. Cần server hỗ trợ Range
  #              (HF CDN có) và zip không solid (zip chuẩn thì không).
  #   download — tải trọn zip rồi giải nén. Chắc ăn, tốn băng thông và ~18 GB
  #              đĩa. Đáng chọn khi máy thuê có volume rộng và mạng nhanh.
  #   auto     — thử stream, hỏng thì tự rơi về download.
  zip_mode: auto
  # Sàn tốc độ cho chế độ stream (ảnh/giây). Sau 60 ảnh đầu, chậm hơn mức này
  # thì bỏ stream và tải trọn zip. Lý do phải có: một proxy "hỗ trợ" Range bằng
  # cách tải lại cả file mỗi request vẫn cho kết quả ĐÚNG, chỉ mất hàng chục
  # giờ — trên máy tính tiền theo giờ, đó là ca hỏng tệ hơn crash vì không có
  # gì báo động. 0 = tắt guard.
  zip_stream_min_rate: 1.0

# ── Prompt: MỘT bản duy nhất cho cả ba model ────────────────────────────────
# Không tinh chỉnh prompt riêng cho từng model. Nếu chỉnh riêng thì con số đo
# được là "model + công sức prompt engineering của tôi cho model đó", không còn
# là năng lực zero-shot của model nữa.
prompt:
  system: "You are an experienced radiologist reading a chest X-ray."
  user: |
    Write the radiology report for this chest X-ray.
    Answer in exactly this format, with no preamble and no extra sections:
    Findings: <the radiological findings>
    Impression: <the overall impression>

# ── Decode: THAM LAM, tất định ──────────────────────────────────────────────
# do_sample=false vì mỗi ảnh chỉ sinh MỘT lần: có sampling thì con số đo được
# lẫn cả phương sai của bộ sinh ngẫu nhiên vào phương sai giữa các model, và
# kiểm định ghép cặp bên dưới không tách được hai nguồn đó ra.
generate:
  max_new_tokens: 256
  do_sample: false
  num_beams: 1
  repetition_penalty: 1.0

# ── Ba candidate ────────────────────────────────────────────────────────────
models:
  - id: gemma3_4b_it
    name: "Gemma 3 4B-it"
    runner: gemma3
    hf_id: google/gemma-3-4b-it     # gated repo -> HF_TOKEN phải được cấp quyền
    dtype: bfloat16
    batch_size: 4
    enabled: true
    # transformers TỰ BẬT torch.compile cho đường sinh của Gemma 3 — không phải
    # ta yêu cầu. inductor sinh mã C++/CUDA rồi gọi trình biên dịch thật để
    # dịch, và trên ảnh container việc đó đã hỏng HAI lần vì HAI lý do khác
    # nhau: (1) không có gcc, (2) CÓ gcc nhưng thiếu Python.h (python3-dev).
    #   auto (mặc định) — DỊCH THỬ một file C rồi mới quyết (không suy từ
    #                     `which gcc`: phép kiểm đó đã cho kết quả sai)
    #   true            — luôn tắt, chắc chắn không vướng
    #   false           — luôn để transformers tự quyết
    # Dù chọn gì, torch._dynamo.config.suppress_errors cũng được bật: compile
    # hỏng thì rơi về eager chứ không giết cả lần chạy. Compile chỉ là tối ưu
    # tốc độ — không đáng để mất kết quả của nhiều giờ GPU.
    disable_compile: auto

  - id: qwen25vl_3b
    name: "Qwen2.5-VL-3B-Instruct"
    runner: qwen25vl
    hf_id: Qwen/Qwen2.5-VL-3B-Instruct
    dtype: bfloat16
    batch_size: 4
    # Trần số pixel đưa vào ViT động của Qwen. Không đặt thì một ảnh CXR 2500²
    # nở ra vài nghìn visual token và VRAM vỡ ở batch 4.
    max_pixels: 1003520     # = 1280 × 28 × 28
    min_pixels: 200704      # =  256 × 28 × 28
    enabled: true

  # Candidate thứ ba: VLM đa dụng của Microsoft, chạy chung transformers với
  # hai model trên. Dùng REMOTE CODE (auto_map -> modeling_phi3_v.py) ghim vào
  # transformers 4.38, nên src/compat.py trả lại vài API Cache đã bị bỏ trước
  # khi nạp — xem chú thích ở đó.
  - id: phi35v_4b
    name: "Phi-3.5-vision-instruct"
    runner: phi35v
    hf_id: microsoft/Phi-3.5-vision-instruct
    dtype: bfloat16
    # Processor của Phi-3-V nhận một chuỗi text + ảnh của riêng nó, không có
    # đường gộp batch sạch -> runner lặp từng ảnh. Để 1 cho khỏi hiểu nhầm.
    batch_size: 1
    # Số ô cắt ở "HD transform". README gợi ý 16 cho ảnh đơn, nhưng mỗi crop tốn
    # 144 visual token; ảnh X-quang xám, một chủ thể, không có chữ nhỏ để đọc —
    # thứ mà HD transform sinh ra để phục vụ. 4 là đủ và nhanh hơn nhiều.
    num_crops: 4
    enabled: true
    optional: true
    # Model dùng remote code trên Hub (auto_map -> modeling_phi3_v.py), nên
    # transformers phải còn `_prepare_4d_causal_attention_mask`. src/preflight.py
    # thử import chính hàm đó trước khi nạp gì.
    trust_remote_code: true

  # Candidate thứ tư: baseline Y TẾ CHUYÊN BIỆT. Đây là model duy nhất trong
  # bảng từng được huấn luyện trên dữ liệu y sinh, nên nó là thứ cho phép §2.1
  # nói được câu "model y tế có hơn model đa dụng trên ảnh X-quang không".
  # Không có nó, bảng chỉ so ba VLM đa dụng với nhau.
  #
  # Cái giá: nó khai model_type=llava_mistral (transformers không biết kiến
  # trúc này), phải cài package `llava` từ GitHub, và repo đó ghim transformers
  # 4.36 trong khi Gemma 3 đòi >= 4.50 — hai ràng buộc loại trừ nhau trong cùng
  # một sys.path. Nên nó chạy ở VENV RIÊNG (.venv-llavamed, dựng bằng
  # --system-site-packages để mượn torch), qua một tiến trình con đổ ra JSONL
  # đúng schema của ba runner kia. Khâu chấm điểm không cần biết chuyện đó.
  - id: llavamed_7b
    name: "LLaVA-Med v1.5 7B"
    runner: llavamed
    hf_id: microsoft/llava-med-v1.5-mistral-7b
    dtype: bfloat16
    batch_size: 1           # builder của LLaVA-Med không có đường batch sạch
    venv: .venv-llavamed
    conv_mode: mistral_instruct
    enabled: true
    # Mắt xích mong manh nhất của pipeline (kiến trúc ngoài transformers + cài
    # từ GitHub). true = nạp hỏng thì ghi N/A vào báo cáo và chấm các model còn
    # lại, thay vì giết cả lần chạy đã tốn nhiều giờ GPU.
    optional: true

# ── Chấm điểm ───────────────────────────────────────────────────────────────
# Mọi metric tính Ở MỨC TỪNG MẪU rồi mới lấy trung bình. Bắt buộc: kiểm định
# ghép cặp cần vector điểm theo mẫu, không phải một số corpus-level.
metrics:
  normalize:
    lowercase: true
    collapse_whitespace: true
    # Giữ nguyên "Findings:/Impression:" ở CẢ hai phía. Bỏ đi thì model nào
    # phớt lờ định dạng lại được thưởng — mà tuân thủ định dạng chính là một
    # phần của việc "sinh báo cáo".
    strip_section_headers: false
  bleu_orders: [1, 2, 3, 4]
  rouge_types: [rouge1, rouge2, rougeL]
  bertscore:
    enabled: true
    model_type: roberta-large   # mặc định tiếng Anh của bert-score
    num_layers: 17
    batch_size: 32
    rescale_with_baseline: false
    # Biến thể giữ lại: p | r | f1. Mặc định chỉ f1 — P/R gần trùng thông tin
    # với F1, mà mỗi cột thêm vào là 3 kiểm định nữa trong họ hiệu chỉnh Holm.
    keep: [f1]
  # Metric dùng làm trục chính khi xếp hạng trong báo cáo.
  primary: bertscore_f1

# ── Kiểm định ───────────────────────────────────────────────────────────────
# Hai kiểm định, cùng một giả thuyết không, khác nhau ở chỗ chúng mô phỏng cái
# gì:
#   paired bootstrap  — lấy lại mẫu ẢNH (có hoàn lại) -> khoảng tin cậy cho
#                       hiệu số, trả lời "hiệu số này chắc tới đâu".
#   permutation       — đảo dấu hiệu số của từng ảnh (sign-flip) -> phân phối
#                       không CHÍNH XÁC dưới H0 đối xứng, trả lời "nếu hai
#                       model như nhau thì hiệu số cỡ này hiếm tới đâu".
# 4 candidate -> 6 cặp × 8 metric = 48 kiểm định -> p thô sẽ có nhiều dương
# tính giả (riêng ngẫu nhiên đã ~2.4 cái ở alpha 0.05). Hiệu chỉnh:
#   holm  kiểm soát FWER (nghiêm, dùng để KẾT LUẬN)
#   bh    kiểm soát FDR  (thoáng hơn, dùng để SÀNG hướng đi tiếp)
stats:
  n_boot: 10000
  # KHÔNG hạ n_perm để "chạy cho nhanh". p-value permutation có sàn cứng
  # 1/(B+1), và Holm nhân p nhỏ nhất với SỐ KIỂM ĐỊNH (48). Với B = 400 thì sàn
  # sau Holm là 48/401 = 0.120 > alpha -> KHÔNG kiểm định nào có thể đạt ý
  # nghĩa, dù hai model khác nhau một trời một vực; bảng vẫn in đủ số và cột
  # kết luận toàn "không", nên rất dễ đọc thành "ba model tương đương". Cần
  # B >= số_kiểm_định / alpha = 48/0.05 = 960; 10000 là dư dả, tốn ~1 phút.
  # (src/stats.py tự kiểm điều này và kêu nếu vi phạm.)
  n_perm: 10000
  ci: 0.95
  alpha: 0.05
  corrections: [holm, bh]
  # per_metric: hiệu chỉnh trong nội bộ 3 cặp của cùng một metric
  # global:     hiệu chỉnh trên toàn bộ 24 kiểm định
  correction_scopes: [per_metric, global]
  block_size: 1     # >1 = moving-block bootstrap (không cần: mẫu độc lập)

# ── Theo dõi: Weights & Biases ──────────────────────────────────────────────
# Một lần chạy là nhiều giờ trên máy thuê. Nhìn qua tmux buộc phải giữ một phiên
# ssh mở; mất mạng là mất tầm nhìn, và nếu nó chết ở giờ thứ ba thì không còn gì
# để đọc lại. Đẩy lên W&B thì xem được từ điện thoại và số liệu ở lại sau khi
# phiên đã đóng.
#
# W&B là VỎ BỌC, không phải phụ thuộc cứng: thiếu gói, thiếu key, hay init hỏng
# thì mọi lời gọi thành no-op và pipeline chạy y nguyên.
wandb:
  enabled: true
  project: rgexp-basemodel
  entity: null              # null -> tài khoản mặc định
  run_name: null            # null -> "<subdir> · MM-DD HH:MM"
  group: null               # null -> output.subdir; gom mọi lần chạy của cùng
                            # thí nghiệm vào một nhóm trên dashboard
  # MỖI LẦN GỌI LỆNH = MỘT RUN MỚI. Bản trước resume vào cùng một run, và khi dò
  # lỗi (chạy đi chạy lại với cấu hình khác nhau) nó trộn số liệu của lần hỏng
  # với lần tốt vào chung một biểu đồ, không tách ra được. true = quay lại hành
  # vi cũ (nối tiếp run cũ khi chạy lại sau khi đứt).
  resume_same_run: false
  # online | offline | disabled. Không có WANDB_API_KEY thì online TỰ hạ xuống
  # offline (ghi vào ./wandb, `wandb sync` đẩy lên sau) thay vì tắt hẳn — mất
  # tiền GPU rồi mới biết thiếu key thì ít nhất số liệu không mất theo.
  mode: online
  tags: [basemodel, zero-shot, mimic-cxr]
  notes: ""
  # Nhịp gửi tiến độ, tính theo BATCH (cũng là nhịp in ra console).
  log_every: 20
  # Số mẫu văn bản thật gửi kèm mỗi model. Nhìn số BLEU không phân biệt được
  # "model viết sai" với "model từ chối trả lời" hay "prompt dính vào output" —
  # ba ca cần ba cách sửa khác hẳn nhau, và biết ở phút thứ 5 rẻ hơn nhiều so
  # với biết sau ba giờ. 0 = tắt.
  log_samples: 20

# ── Đầu ra ──────────────────────────────────────────────────────────────────
output:
  dir: ./runs
  hub_repo: RGExp123/Research_results
  hub_repo_type: dataset
  hub_private: true
  push: true
  subdir: "2.1_basemodel_comparison"
