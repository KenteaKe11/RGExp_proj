# ═══════════════════════════════════════════════════════════════════════════
# §2.5 — ĐỐI CHỨNG VỚI SOTA: R2Gen · AdaAtt · My Gemma
# ═══════════════════════════════════════════════════════════════════════════
# Đây là file cấu hình DUY NHẤT của repo. Mọi điểm vào không truyền `--config`
# đều đọc file này (`src/config.py::DEFAULT_CONFIG`):
#
#     scripts/run_pretrain.sh   -> src.run_pretrain   Stage 0 của My Gemma
#     scripts/run_section25.sh  -> src.run_section25  §2.5 trọn gói
#
# Trước đây Stage 0 đọc `configs/recombiner.yaml` còn §2.5 đọc file này — hai
# khối `pretrain:` khác lịch lr (div 25/100 so với 30/10) trong khi điều kiện 5
# đòi MỘT config Stage 0 cho mọi kiến trúc, và nhánh pretrain ra phải có đúng
# hình dạng mà §2.5 dựng. Nay hai điểm vào đọc cùng một file nên chuyện lệch
# ấy không còn xảy ra được. Khối riêng của §2.3/§2.4 (`arms`, `arms_moe`,
# `stats.friedman`, `output.*_moe`) KHÔNG được mang sang: những mục ấy đã chốt,
# bản ghi của chúng — kèm chú thích lý do cho từng khoá của `train`,
# `recombiner`, `classifier`, `moe` — nằm ở `_archive/configs/recombiner.yaml`.
#
# Câu hỏi của mục này, viết đủ một câu:
#
#     Trên CÙNG 9600 mẫu huấn luyện và CÙNG 3000 ảnh chấm điểm của tập này,
#     công thức Gemma 3 + Recombinator + ClsHead/RouteHead + Experts K=6·E=10
#     có hơn hai kiến trúc sinh báo cáo đã công bố (R2Gen, AdaAtt) không, và
#     hơn BAO NHIÊU?
#
# Ba candidate, nên ba cặp. k = 3 nhưng KHÔNG Friedman: thiết kế của mục này
# (xem README.md, phần kiểm định) đòi hai kiểm định GHÉP CẶP — permutation và
# bootstrap BCa — trên từng cặp, rồi Holm trên ba p-value. Friedman trả lời
# "có ít nhất một cột khác" — ở k = 3 với ba cặp đều được quan tâm như nhau,
# câu ấy không thêm thông tin mà lại làm mất sức kiểm định.
#
# ── NĂM ĐIỀU KIỆN ĐƯỢC THỐNG NHẤT (không candidate nào được miễn) ──────────
#  1. SOTA đối chứng chỉ nạp lại trọng số ở ĐÚNG trạng thái setup của paper
#     gốc — khối `sota:` dưới đây là bản chép nguyên văn, không hiệu chỉnh.
#  2. Cùng 9600 mẫu train / 3000 ảnh test của tập này (`data:`).
#  3. Kiểm định bằng Paired Bootstrap + Permutation Test (`stats:`).
#  4. MỘT phương pháp resize duy nhất cho mọi model — kể cả khi kích thước
#     đầu vào VÔ TÌNH khớp (`image_policy:`).
#  5. Có ÍT NHẤT một kiến trúc mang stage pretrain/finetune cục bộ (R2Gen
#     end-to-end, AdaAtt hai stage) => MỌI kiến trúc chạy Stage 0 với CÙNG
#     một config pretrain (`pretrain:` — max_lr 2e-4, weight_decay 0.8), rồi
#     vào main-stage. R2Gen/AdaAtt: lr phần đã pretrain = 1/10 lr chính thức
#     (`train.pretrained_lr_mult: 0.1`).
#     Riêng My Gemma: Stage 0 cho ma trận Attn của Recombinator chạy lr × 3
#     (`recombiner.attn_lr_mult`). decoder_ft KHÔNG đóng băng, fine-tune toàn
#     bộ với lr đỉnh khai tường minh từng nhóm (`train.ft_lr`): Sup Head,
#     Route Head, Concat Linear 3e-4 · Attn 1e-4 · phần còn lại của
#     Recombinator 3e-5 — MỘT chu kỳ one-cycle cho cả stage, đáy 1e-7.
# ═══════════════════════════════════════════════════════════════════════════

seed: 42

experiment: "2.5"

# `scratch` | `decoder_ft`. Main-stage của §2.5 LUÔN là `decoder_ft` với
# My Gemma vì điều kiện 5 bắt nhánh phải đi qua Stage 0 trước. `scratch` giữ
# lại để chạy đối chứng "không pretrain" khi cần NÓI RA trong phần Giới hạn.
mode: decoder_ft

# ── Dữ liệu — điều kiện 2 ──────────────────────────────────────────────────
# Khoá cứng. Ba candidate đọc CÙNG hai file split; `assert_no_leak` là hàng
# rào cơ học chứ không phải một lời hứa trong README.
data:
  repo: RGExp123/MIMIC_CXR_cleaned
  repo_type: dataset
  split_csv: split_ref/test_split.csv
  meta_csv: csv_helper/clean_dataset.csv
  image_zip: img_dir.zip
  key_column: img_rel
  ref_column: text_gt
  n_test: 3000
  cache_dir: ./data
  image_max_side: 512
  image_max_side_enforce: true
  zip_mode: auto
  zip_stream_min_rate: 1.0
  train_split_csv: split_ref/train_split.csv
  n_train: 9600
  val_split_csv: split_ref/val_split.csv
  n_val: 512
  assert_no_leak: true

# ── Chính sách ảnh — điều kiện 4 ───────────────────────────────────────────
# R2Gen (ResNet-101) và AdaAtt (ResNet-152) đều quen 224; Gemma 3 xử lý ở 896.
# Ba con số khác nhau, và đó KHÔNG phải lý do để mỗi model tự resize theo cách
# của nó: nếu R2Gen dùng RandomCrop còn Gemma dùng bilinear-longest-side thì
# một phần chênh lệch trong bảng là chênh lệch của hai bộ tiền xử lý, không
# phải của hai kiến trúc.
#
# Nên: MỘT lần resize dùng chung, ở `resize_to`, trước khi bất kỳ processor
# riêng nào chạm vào ảnh. `allow_native_match: false` nghĩa là ngay cả khi một
# model đòi đúng `resize_to` thì ảnh vẫn đi qua đường chung ấy — "vô tình
# khớp" không được phép biến thành một đường tiền xử lý thứ hai.
image_policy:
  unified: true
  resize_to: 512              # cạnh dài; khớp `data.image_max_side`
  interpolation: bicubic
  keep_aspect: true
  pad_to_square: true
  pad_fill: 0
  allow_native_match: false
  # Sau bước chung, mỗi model chỉ còn được phép chuẩn hoá giá trị pixel theo
  # thống kê của backbone nó (ImageNet mean/std cho ResNet, SigLIP cho Gemma).
  # Đó là phép biến đổi trên GIÁ TRỊ, không phải trên HÌNH HỌC.
  per_model_normalize_only: true

labels:
  npz: csv_helper/labels.npz
  key_array: null
  label_array: null
  names_array: null
  encoding:
    neg: [0]
    pos: [1]
    uncertain: [-1, 2]
    nan_to: uncertain
  max_missing_frac: 0.20

# ── BA CANDIDATE ───────────────────────────────────────────────────────────
# `arms_s25` chứ không phải `arms`: `arms` là khoá của §2.3 và nó đã sang
# `_archive/configs/recombiner.yaml`. Trùng tên nghĩa là một lần nạp nhầm file
# vẫn in ra một bảng trông bình thường với những cột sai.
arms_s25:
  - id: r2gen
    name: "A · R2Gen (ResNet-101 + Relational Memory)"
    kind: sota
    runner: r2gen
    setup: r2gen
    pretrain_stage0: true
    enabled: true

  - id: adaatt
    name: "B · AdaAtt (ResNet-152 + Visual Sentinel)"
    kind: sota
    runner: adaatt
    setup: adaatt
    pretrain_stage0: true
    enabled: true

  # Candidate nặng nhất và dễ hỏng nhất chạy TRƯỚC — quy ước 1 của repo.
  # `order: 0` là chỗ nói ra điều đó; thứ tự không được phép ảnh hưởng kết
  # quả (seed và thứ tự dữ liệu đặt lại trước MỖI candidate).
  - id: my_gemma
    name: "C · My Gemma · Recombinator · Cls/Route Head · K=6·E=10 · QLoRA r4"
    kind: ours
    runner: gemma3_recomb
    recomb: true
    top_k: 6
    n_experts: 10
    pretrain_stage0: true
    order: 0
    enabled: true

# ── Setup của hai SOTA — điều kiện 1, chép nguyên văn từ paper gốc ─────────
# KHÔNG hiệu chỉnh một con số nào ở đây. Chỗ duy nhất §2.5 được phép áp đặt là
# `image_policy` (điều kiện 4) và `pretrain` (điều kiện 5) — hai chỗ ấy được
# công bố trong README.md, và `src/run_section25.py` ghi chúng vào
# `manifest.deviations` để báo cáo không thể im lặng về chúng.
sota:
  r2gen:
    name: R2Gen
    variant: R2Gen-origin
    task: radiology_report_generation
    visual_encoder:
      type: ResNet-101
      pretrained: true
      pretrained_source: ImageNet
      output_dim: 2048
      trainable: true
      fine_tune: true
    visual_features:
      input_dim: 2048
      model_dim: 512
    transformer:
      d_model: 512
      d_ff: 512
      num_heads: 8
      num_layers: 3
      dropout: 0.1
    relational_memory:
      num_slots: 3
      num_heads: 8
      d_model: 512
    decoder:
      logit_layers: 1
      drop_prob_lm: 0.5
      use_bn: false
    tokenizer:
      max_seq_length: 60
      min_word_frequency: 3
      special_tokens: ["<bos>", "<eos>", "<pad>"]
    initialization:
      visual_encoder: ImageNet_pretrained_ResNet101
      projection: random
      transformer: random
      relational_memory: random
      decoder: random
      word_embeddings: random
      output_projection: random
    fine_tuning:
      strategy: end_to_end
      freeze_visual_encoder: false
      parameter_groups:
        visual_encoder: {trainable: true, learning_rate: 0.00005}
        all_remaining_parameters: {trainable: true, learning_rate: 0.0001}
      optimizer: {type: Adam, amsgrad: true, weight_decay: 0.00005}
      scheduler: {type: StepLR, step_size: 50, gamma: 0.1}
      epochs: 100
      batch_size: 16
      early_stopping: {enabled: true, patience: 50, monitor: BLEU_4, mode: max}
    # Bản ghi của paper — §2.5 KHÔNG đọc khi sinh (xem khối `generate:`).
    decoding:
      method: beam_search
      beam_size: 3
      temperature: 1.0
      sample_n: 1
      group_size: 1
      output_logsoftmax: true
      decoding_constraint: false
      block_trigrams: true
    reproducibility:
      seed: 9233
      cudnn_deterministic: true
      cudnn_benchmark: false

  adaatt:
    name: AdaAtt
    variant: Adaptive-Attention-Visual-Sentinel-origin
    task: image_captioning
    visual_encoder:
      type: ResNet-152
      pretrained: true
      pretrained_source: ImageNet
      feature_type: spatial_grid_features
      trainable: true
      fine_tune: true
    visual_features:
      spatial_regions: ResNet convolutional feature map
      global_feature: true
      feature_projection: true
    decoder:
      type: LSTM
      num_layers: 1
      hidden_size: 512
    adaptive_attention:
      type: visual_sentinel
      spatial_attention: true
      sentinel: true
      adaptive_fusion: true
    word_embedding: {trainable: true, initialization: random}
    output_projection: {trainable: true, initialization: random}
    initialization:
      visual_encoder: ImageNet_pretrained_ResNet152
      word_embedding: random
      lstm: random
      attention: random
      visual_sentinel: random
      output_projection: random
    fine_tuning:
      strategy: staged_end_to_end
      stage_1:
        description: train language model without CNN fine-tuning
        visual_encoder_trainable: false
        decoder_trainable: true
        attention_trainable: true
        embedding_trainable: true
        output_projection_trainable: true
        learning_rate_language_model: 0.0005
      stage_2:
        description: fine-tune CNN jointly with caption model
        visual_encoder_trainable: true
        decoder_trainable: true
        attention_trainable: true
        embedding_trainable: true
        output_projection_trainable: true
        learning_rate_cnn: 0.00001
        learning_rate_language_model: 0.0005
        start_after_epoch: 20
        additional_epochs: "15-20"
      optimizer:
        type: Adam
        learning_rate_language_model: 0.0005
        learning_rate_cnn: 0.00001
        beta1: 0.8
        beta2: 0.999
      training:
        batch_size: 80
        max_epochs: 50
        early_stopping: {enabled: true, monitor: CIDEr, patience: 6}
    # Bản ghi của paper — §2.5 KHÔNG đọc khi sinh (xem khối `generate:`).
    decoding: {method: beam_search, beam_size: 3}
    reproducibility:
      framework: Torch/Lua
      official_implementation: jiasenlu/AdaptiveAttention

# ══════════════════════════════════════════════════════════════════════════
# CANDIDATE C — MY GEMMA
# ══════════════════════════════════════════════════════════════════════════
base:
  hf_id: google/gemma-3-4b-it
  runner: gemma3_recomb
  dtype: bfloat16
  attn_implementation_train: eager
  attn_implementation_infer: sdpa
  disable_compile: auto
  batch_size: 2
  device_map_train: single
  device_map_infer: auto
  image:
    do_pan_and_scan: false
    processor_size: 896

prompt:
  system: "You are an experienced radiologist reading a chest X-ray."
  user: |
    Write the radiology report for this chest X-ray.
    Answer in exactly this format, with no preamble and no extra sections:
    Findings: <the radiological findings>
    Impression: <the overall impression>

# ── Giải mã — MỘT đặc tả cho CẢ BA candidate (`src/decoding_spec.py`) ─────
# My Gemma đưa khối này cho `transformers.generate`; R2Gen/AdaAtt đưa nó cho
# `src/sota/decoding.beam_search`, vốn cài lại ĐÚNG luật beam search của
# transformers — kể cả lúc chọn checkpoint trên val. Khối `sota.*.decoding`
# bên dưới chỉ còn là bản ghi của paper (điều kiện 1) và KHÔNG được đọc; chỗ
# lệch (block_trigrams của R2Gen) vào `manifest.deviations`.
#
# Mọi khoá phải khai TƯỜNG MINH: generation_config.json của Gemma 3 khai
# sampling, và một khoá bỏ trống là để nó chen vào.
#
# Khác biệt duy nhất: độ dài tối đa. `max_new_tokens` là của My Gemma
# (subword); R2Gen/AdaAtt dừng ở `max_seq_length − 1` = 59 từ của từ điển.
#
# Với MoE, trọng số định tuyến của mỗi ảnh được nhân bản theo beam
# (`moe.RoutingContext.set(..., repeat=num_beams)`). Beam nhân số chuỗi trong
# một lượt sinh lên 3 lần: hết VRAM thì hạ `base.batch_size`.
generate:
  max_new_tokens: 256
  do_sample: false
  num_beams: 3
  length_penalty: 1.0          # điểm = tổng log-prob / (số token sinh)^1
  early_stopping: false        # heuristic dừng của transformers
  no_repeat_ngram_size: 0      # không chặn n-gram
  repetition_penalty: 1.0      # không phạt lặp
  num_return_sequences: 1

# §2.2 đã chốt: QLoRA r4. Giữ nguyên preset đó, không mở lại câu hỏi ấy ở đây.
lora:
  preset: qlora_r4
  presets:
    qlora_r4:  {method: qlora, rank: 4}
    qlora_r8:  {method: qlora, rank: 8}
    qlora_r16: {method: qlora, rank: 16}
    qlora_r32: {method: qlora, rank: 32}
    qdora_r4:  {method: qdora, rank: 4}
    qdora_r8:  {method: qdora, rank: 8}
    qdora_r16: {method: qdora, rank: 16}
    qdora_r32: {method: qdora, rank: 32}

train:
  n_epochs: 1
  per_device_batch_size: 1
  grad_accum: 32
  max_seq_len: 1024
  gradient_checkpointing: true
  weight_decay: 0.01
  max_grad_norm: 1.0
  logging_steps: 10
  # MỘT chu kỳ one-cycle cho TOÀN BỘ main-stage (mọi epoch, không restart —
  # KHÔNG khai `cycle_steps`/`lr_decay` ở đây), để mọi nhóm cùng hạ về đáy ở
  # bước cuối. Mọi nhóm dùng cùng div 30 · final_div 10, rồi đầu warm-up và
  # đáy được LÀM TRÒN XUỐNG còn 1 chữ số có nghĩa (`round_down_sig: 1`):
  #
  #     nhóm                          đầu      đỉnh     đáy
  #     cls_head/route_head/dec_proj  1e-5  -> 3e-4  -> 1e-6
  #     adapter (LoRA/Experts) = Attn 3e-6  -> 1e-4  -> 3e-7   (3.33.. -> 3)
  #     recombinator                  1e-6  -> 3e-5  -> 1e-7   <- đáy nhỏ nhất
  #
  # `min_lr` là con số ĐƯỢC KIỂM (`train_recomb.ft_lrs` DỪNG nếu lệch), không
  # phải con số được đọc.
  schedule:
    impl: lambda
    max_lr: 1.0e-4          # adapter / Experts — CÙNG lr với Attn
    min_lr: 1.0e-7          # = đáy (đã làm tròn) của nhóm nhỏ nhất
    round_down_sig: 1       # làm tròn XUỐNG đầu warm-up + đáy; 0 = tắt
    pct_start: 0.1
    div_factor: 30.0
    final_div_factor: 10.0
    anneal: cos
    cycle_momentum: false
  branch_weight_decay: 0.01

  # ĐIỀU KIỆN 5 — CHỈ cho R2Gen/AdaAtt (`src/train_sota.py`): phần đã pretrain
  # chạy main-stage ở lr × 0.1. My Gemma KHÔNG đọc khoá này nữa.
  pretrained_lr_mult: 0.1
  # My Gemma · decoder_ft — lr ĐỈNH từng nhóm của nhánh
  # (`train_recomb.build_optimizer`; adapter/Experts ở `schedule.max_lr`,
  # bằng `recombinator_attn`).
  # Phải khai ĐỦ năm khoá, mỗi tham số nhánh thuộc đúng một nhóm.
  ft_lr:
    cls_head: 3.0e-4           # Sup Head: Pooling Stack + Main Head
    route_head: 3.0e-4         # Route Head (+ noise_proj)
    dec_proj: 3.0e-4           # Concat Linear 256 -> 64 token vào decoder
    recombinator_attn: 1.0e-4  # Q/K/V/O của Global Extractor
    recombinator: 3.0e-5       # phần còn lại: Local ×2, norm, FFN
  # KHÔNG đóng băng gì — decoder_ft fine-tune toàn bộ. Khoá còn giữ để đối
  # chứng khi cần (requires_grad=False + eval mode + ngoài optimizer). Nhận:
  # recombinator · cls_head · cls_head.pooling_stack · cls_head.main_head.
  freeze_after_pretrain: []
  # true = đóng băng TOÀN BỘ phần đã pretrain (cả Recombinator). Ghi đè
  # `freeze_after_pretrain`.
  freeze_pretrained: false

  target_modules: [q_proj, k_proj, v_proj, o_proj]
  include_prefixes: [language_model, model.language_model]
  exclude_prefixes: [vision_tower, multi_modal_projector, vision_model]
  lora_dropout: 0.05
  bias: none
  alpha_mode: proportional
  alpha_ratio: 2.0
  alpha_fixed: 16
  quant:
    load_in_4bit: true
    quant_type: nf4
    double_quant: true
    compute_dtype: bfloat16

recombiner:
  siglip_dim: 1152
  out_dim: null
  # ── Recombinator: X (4096, 1152) -> Y (256, 2560) ─────────────────────────
  # 1. Local Extractors ×2: RMSNorm -> Linear 1152→hidden GELU -> RMSNorm
  #    -> AvgPool 2×2 trên lưới ảnh (N → N/4) -> Linear hidden→1152 GELU.
  #    4096 (64×64) -> 1024 (32×32) -> 256 (16×16).
  # 2. Global Extractor: Query = đầu ra Local, Key/Value = X gốc (RMSNorm riêng),
  #    MHA head_dim=64 (1152/64 = 18 head) + residual RMSNorm(Query).
  # 3. FFN: Linear 1152→2560 GELU -> RMSNorm -> Linear 2560→2560 GELU + residual.
  n_vis: 4096
  n_tokens: 256          # được KIỂM: = n_vis / pool_factor^n_blocks
  local:
    n_blocks: 2
    hidden: 2048
    pool_factor: 4
  head_dim: 64
  dropout: 0.05
  # Ma trận Attn (Q/K/V/O của Global Extractor) chạy lr × hệ số này ở Stage 0
  # (3 × 2e-4 = 6e-4) và ở chế độ scratch (3 × train max_lr). decoder_ft KHÔNG
  # đọc khoá này — lr Attn ở đó là `train.ft_lr.recombinator_attn`. Phải >= 1.
  attn_lr_mult: 3.0
  # ── Classification Head / Route Head ────────────────────────────────────
  # Cùng hình dạng: Pooling Stack (`pool_stages` tầng, mỗi tầng RMSNorm ->
  # Linear/GELU trục token N→N/2 -> AvgPool N/2→N/4; 256→64→16→4→1) -> Main
  # Head (RMSNorm -> Linear/GELU 2560→hidden -> Linear hidden→target).
  # Classification Head đọc `classifier.hidden/dropout`, target = n_labels × 3.
  # Route Head đọc khối dưới đây, target = n_experts, cộng `noise_proj`
  # (hidden → E) cho nhiễu học được của Top-k Gate.
  pool_stages: 4
  route_head:
    hidden: 1024
    dropout: 0.05
  # Điều kiện của mục: E = 10 (§2.4 đã chốt), K = 6 nằm ở `arms_s25`.
  n_experts: 10
  token_type: text
  dtype: null

  # ── Vào decoder: Linear/GELU trên TRỤC TOKEN, KHÔNG cổng ────────────────
  # 256 token của Recombinator -> Linear (không bias) + GELU -> `n_dec_tokens`
  # token, nối THẲNG vào chuỗi decoder TRƯỚC 256 token ảnh (First / Second
  # trong sơ đồ); phần văn bản của prompt giữ nguyên vị trí. Khởi tạo =
  # trung bình 2×2 trên lưới 16×16 -> 8×8. Hai head vẫn đọc đủ 256 token.
  # Khoá của kiến trúc cũ (`qformer`, `prepare_pool_factor`,
  # `highway_token_dims`, `swiglu_dropout`, `n_query`, `n_heads`, `gate*`) đã
  # BỎ — còn sót khoá nào là DỪNG.
  n_dec_tokens: 64

classifier:
  enabled: true
  feed_logits_to_decoder: false
  n_labels: null
  n_classes: 3
  hidden: 1024
  dropout: 0.1
  # Lệch nhãn neg/pos/uncertain nên KHÔNG dùng CE thường -> ASL, dùng CHUNG
  # cho Stage 0 và decoder_ft. `gamma_neg` dạng danh sách = nén theo TÊN LỚP
  # (thứ tự neg/pos/uncertain), áp lên ô mang nhãn 0: ô lớp neg 4.0, ô lớp pos
  # 3.0, ô lớp uncertain 0.0 (không nén). `gamma_pos` 0.0 = ô dương không nén.
  # `clip` 0.05: ô âm đã có p < 0.05 bị loại hẳn khỏi gradient.
  # `lambda` 0.4: trọng số ASL cạnh CE ở main-stage (Stage 0 chỉ có ASL).
  asl:
    gamma_neg: [4.0, 3.0, 0.0]
    gamma_pos: 0.0
    clip: 0.05
    eps: 1.0e-8
  lambda: 0.4
  lambda_warmup_pct: 0.1
  # Nhánh vào main-stage đã qua Stage 0 => ClsHead không còn ngẫu nhiên =>
  # không warmup. Đây là hệ quả của điều kiện 5, không phải một lựa chọn rời.
  lambda_warmup_pct_pretrained: 0.0

moe:
  enabled: true
  router:
    noise: true
    noise_init: -3.0
    logit_clip_c: 1.2
    renormalize_topk: true
  aux:
    kind: switch_load_balance
    alpha: 0.01
    warmup_pct: 0.1
  expert:
    rank: null
    alpha: null
    dropout: 0.05
    method: lora
  log_routing_n: 3000

# ── Chấm điểm — theo TỪNG MẪU, vì kiểm định là ghép cặp ───────────────────
metrics:
  normalize:
    lowercase: true
    collapse_whitespace: true
    strip_section_headers: false
  bleu_orders: [1, 2, 3, 4]
  rouge_types: [rouge1, rouge2, rougeL]
  bertscore:
    enabled: true
    model_type: roberta-large
    num_layers: 17
    batch_size: 32
    rescale_with_baseline: false
    keep: [f1]
  primary: bertscore_f1

# ── Kiểm định — điều kiện 3 ────────────────────────────────────────────────
# Ba candidate => ba cặp. Mỗi cặp đi ĐÚNG đường của §2.3 (`src/stats_ab.py`):
# permutation đảo dấu trả p, bootstrap BCa trả khoảng tin cậy cho hiệu số.
# Holm chạy TRÊN BA p-value của ba cặp, trong từng metric.
#
# `reference: my_gemma` chỉ quyết định DẤU của hiệu số (mọi cặp đọc là
# "candidate − my_gemma" hay ngược lại), không làm cặp nào bị bỏ.
stats:
  alpha: 0.05
  n_boot: 10000
  n_perm: 10000
  ci: 0.95
  ci_method: bca
  dz_floor: 0.10
  primary_test: perm
  pairs: all               # all | vs_reference
  reference: my_gemma
  adjust: holm
  adjust_scope: pairs      # Holm trong TỪNG metric, trên ba cặp
  # Friedman CỐ Ý không có mặt. Xem đầu file và README.md.

# ── STAGE 0 — pretrain cục bộ, điều kiện 5 ────────────────────────────────
# Một config DUY NHẤT, áp cho mọi kiến trúc có stage cục bộ: `train_sota` đọc
# nó cho R2Gen/AdaAtt, `src.run_pretrain` đọc nó cho My Gemma. Lịch: warm-up
# cosine từ max_lr tới min_lr, MỘT chu kỳ = MỘT epoch, chạy 8 epoch. Sau mỗi
# restart, `lr_decay` hạ CẢ hai mốc (tức 8 chu kỳ nối nhau có biên giảm dần).
#
# `min_lr` KHÔNG phải một khoá mà `one_cycle` đọc. Đường cong nhận hai hệ số
# chia, và min_lr là TÍCH của chúng:
#
#     lr đầu warm-up = max_lr / div_factor         = 2e-4 / 30 = 6.67e-6 -> 6e-6
#     lr cuối cosine = lr đầu / final_div_factor   = 6.67e-7            -> 6e-7
#
# "-> " là bước LÀM TRÒN XUỐNG còn 1 chữ số có nghĩa (`round_down_sig: 1`),
# áp riêng cho từng nhóm. Attn của Recombinator (× `recombiner.attn_lr_mult`
# = 3): 2e-5 -> 6e-4 -> 2e-6 (đã tròn sẵn). Restart epoch e nhân cả đường
# cong với 0.9^e. R2Gen/AdaAtt đọc CÙNG khối này (`train_sota`), nên cùng
# quy tắc làm tròn.
#
# `min_lr: 6.0e-7` dưới đây là con số ĐƯỢC KIỂM, không phải con số được đọc:
# `scripts/selftest_section25.py` đối chiếu nó với hai hệ số (đã làm tròn) và
# DỪNG nếu lệch. Sửa `max_lr` mà quên hai hệ số là đổi min_lr trong im lặng — và một
# đường cong lr sai không ném exception nào.
pretrain:
  n_train: 9600 # 0 = toàn bộ train split đã khai ở `data`
  n_epochs: 8
  cycle_per_epoch: true
  # train_bs hiệu dụng của riêng Stage 0 = 32; main-stage không đổi.
  per_device_batch_size: 16
  grad_accum: 2
  schedule:
    impl: lambda
    max_lr: 2.0e-4
    min_lr: 6.0e-7          # = round_down(max_lr / (div × final_div))
    round_down_sig: 1       # làm tròn XUỐNG đầu warm-up + đáy; 0 = tắt
    # Restart epoch e nhân cả max_lr và min_lr với 0.9^e.
    lr_decay: 0.9
    pct_start: 0.1
    div_factor: 30.0        # lr đầu warm-up = 2e-4 / 30 -> 6e-6
    final_div_factor: 10.0  # lr cuối cosine            -> 6e-7
    anneal: cos
    cycle_momentum: false
  # AdamW (decoupled): mỗi bước kéo trọng số về 0 một lượng lr × wd
  # (đỉnh 2e-4 × 0.8 = 1.6e-4; Attn 6e-4 × 0.8 = 4.8e-4). `weight_decay_range`
  # là khoảng được selftest chấp nhận.
  weight_decay: 0.8
  weight_decay_range: [0.03, 1.0]
  base_method: qlora
  select_metric: cls_f1_pos
  keep_last_ckpt: 2
  # Đẩy ngay từng epoch; Hub không bao giờ nhận trainer_state.pt.
  push_each_epoch: true
  swa:
    enabled: true
    start_epoch: 0.25
  subdir: sup_pretrain
  hub_repo: RGExp123/RGExp_sup_pretrain
  hub_repo_type: model
  hub_private: true
  hub_subdir: latest

# ── Khoá KỸ THUẬT của hai baseline — không thuộc paper nào ────────────────
# Ba khoá dưới đây không có trong setup gốc của R2Gen lẫn AdaAtt, và cũng không
# phải điều kiện của §2.5. Chúng ở đây vì phần cứng, và chúng được tách ra một
# khối riêng để không ai đọc nhầm một con số phần cứng thành một con số của
# paper.
#
# `micro_batch` KHÔNG phải "hạ batch". Paper của AdaAtt khai batch 80, và ở
# 512px với ResNet-152 thì 80 ảnh trong MỘT lượt forward không vừa card nào
# trong tầm. Khoá này chia một batch của paper thành nhiều lượt forward rồi
# cộng dồn gradient: **batch hiệu dụng, số bước và đường cong lr không đổi**.
# Hạ `batch_size` trong khối `sota:` thì mới là đổi thí nghiệm — và khối ấy
# không được chạm vào.
sota_train:
  micro_batch: 8
  infer_batch: 4          # beam nhân số chuỗi lên beam_size lần
  eval_every: 1           # chấm val sau mỗi epoch (dừng sớm đọc con số này)
  amp: true               # bf16 nếu card có; không có thì fp32, KHÔNG fp16
  num_workers: 4
  grad_clip: 0.0          # 0 = tắt. Không paper nào khai clip — đừng bật ngầm.

wandb:
  enabled: true
  project: rgexp-section25
  entity: null
  run_name: null
  group: "section2.5"
  resume_same_run: false
  mode: online
  tags: [section2.5, sota, r2gen, adaatt, gemma3, moe, paired-bootstrap, mimic-cxr]
  notes: ""
  log_every: 20
  log_samples: 20

output:
  dir: ./runs
  hub_repo: RGExp123/Research_results
  hub_repo_type: dataset
  hub_private: true
  push: true
  subdir: "2.5_sota"
  adapter_dir: ./adapters_2_5
  ft_suffix: "_ft"
