# ══════════════════════════════════════════════════════════════════════════
# §4 — QLoRA r4 thuần  vs  Recombinator(pretrain §3) + K=6·E=10 + QFormer + Cls
#
# File này CỐ Ý NGẮN, và đó là toàn bộ lý lẽ của nó.
#
# §4 phải "giữ nguyên vẹn mọi điều kiện của §2.3/§2.4" — CÙNG 6400 mẫu train,
# CÙNG 3000 ảnh test, cùng base NF4, cùng lịch one-cycle, cùng batch, cùng
# seed, cùng chính sách ảnh, cùng metric, cùng tham số kiểm định. Với hai file
# cấu hình độc lập, câu đó là một LỜI HỨA: ai đó sửa `data.n_train` ở một bên
# mà quên bên kia, và ba mục thôi so được với nhau mà không có gì báo.
#
# Nên §4 KHÔNG khai lại một khoá nào trong số đó. `src/run_section4.py` nạp
# `configs/recombiner.yaml` TRƯỚC — đúng file mà §2.3 và §2.4 đọc — rồi phủ
# file này lên trên, và nó DỪNG nếu file này chạm vào bất kỳ khoá nào đã khoá.
#
# ── §4 KHÔNG CÓ PHASE PRETRAIN ────────────────────────────────────────────
# Nhánh của candidate B nạp từ checkpoint mà §3 đã ghi ra. §4 không huấn luyện
# lại chế độ 1, không có `pretrain:` block, và khai một khoá `pretrain.*` nào ở
# đây là DỪNG — nó sẽ là một khoá trông như điều khiển được một phase không
# tồn tại.
#
# Đường dẫn checkpoint KHÔNG viết cứng ở đây: `run_section4.py` đọc
# `configs/section3.yaml` để dựng nó (`output.dir`/`output.subdir`/pretrain/
# ckpt/best). Viết cứng "runs/3_full/..." là một LỜI HỨA rằng §3 vẫn ghi vào
# đúng chỗ ấy; đọc file của §3 là một sự thật.
# ══════════════════════════════════════════════════════════════════════════

experiment: "4"

# ── Hai candidate ─────────────────────────────────────────────────────────
# Khoá riêng `arms_s4` chứ không phải `arms`: `arms` là của §2.3 và nó nằm
# trong recombiner.yaml. Trùng tên nghĩa là một lần nạp sai thứ tự sẽ chạy §4
# với hai candidate của §2.3 — cùng số cột, cùng kiểu kiểm định, bảng vẫn in ra
# bình thường, và không có gì nói rằng nhánh pretrain chưa bao giờ được nạp.
#
# BA cờ, cả ba BẮT BUỘC, không cờ nào có mặc định ngầm:
#   recomb    : có nhánh Recombinator + QFormer + ClsHead hay không
#   pretrain  : nhánh có nạp từ checkpoint §3 hay không
#   top_k/n_experts : có mặt <=> arm này chạy Experts (MoE)
arms_s4:
  - id: qlora_r4
    name: "A · QLoRA r4 thuần"
    recomb: false
    pretrain: false
    enabled: true

  - id: recomb_pre_k6e10
    name: "B · Recombinator(pretrain §3) · K=6 · E=10 · QFormer · Cls"
    recomb: true
    pretrain: true
    top_k: 6
    n_experts: 10
    enabled: true

# ── Nguồn nhánh đã pretrain ───────────────────────────────────────────────
# `section3` = đọc configs/section3.yaml, dựng <output.dir>/<output.subdir>/
# pretrain/ckpt/best. Đó là thư mục mà `run_section3.default_init` ghi ra.
#
# Ghi đè bằng dòng lệnh khi cần: --init-from <dir> | hub:OWNER/NAME/best[@rev]
# | none (arm đối chứng from-scratch, phải NÓI RA).
pretrain_from: section3

# §3 chạy chế độ 1 trên TOÀN BỘ train split, còn §4 huấn luyện trên 6400 mẫu.
# Đó là một khác biệt THẬT giữa hai cột và nó phải vào phần Giới hạn — xem
# README_4.md mục 2.2. `run_section4.py` in ra con số thật đọc từ META của
# checkpoint và ghi nó vào `manifest.limitations`, nên báo cáo không thể im
# lặng về nó.
#
# `true`  = chấp nhận nhánh học trên nhiều dữ liệu hơn (mặc định: nó là một
#           thành phần đã pretrain, cùng nghĩa với vision tower SigLIP đóng
#           băng — được công bố, không phải rò rỉ).
# `false` = DỪNG nếu checkpoint học trên số mẫu khác `data.n_train`.
allow_pretrain_data_mismatch: true

# ── Nơi ghi ───────────────────────────────────────────────────────────────
output:
  subdir: "4_headtohead"
  adapter_dir: ./adapters_4

wandb:
  group: "section4"
  tags: [section4, headtohead, recombiner, pretrain-s3, moe, paired-bootstrap]
