# ═════════════════════════════════════════════════════════════════════════════
# THÍ NGHIỆM 2 — CHỌN CẤU HÌNH LoRA DECODER (ALL-LINEAR) CHO MedGemma 4B — CONFIG NỘI DUNG
# ═════════════════════════════════════════════════════════════════════════════
# Từ Thí nghiệm 1 (§3, configs/backbone.yaml): chọn MedGemma 4B-it.
#
# Câu hỏi: với LoRA gắn vào MỌI lớp tuyến tính của DECODER (q,k,v,o,gate,up,down
#   của khối ngôn ngữ; vision tower + projector đóng băng), trên base LƯỢNG TỬ HOÁ
#   4-bit (QLoRA), rank nào trong {2, 4, 8, 16, 32} cho báo cáo tốt nhất theo
#   BLEU / ROUGE / BERTScore / RadGraph F1 (chính)? (Không đo Alignment AUC.)
#
# Chỉ MỘT biến thay đổi giữa các candidate: rank r (và alpha = 2r để hệ số nhân
#   alpha/r KHÔNG đổi). Cùng dữ liệu, cùng thứ tự, cùng seed, cùng lịch học, cùng
#   batch hiệu dụng, cùng chỗ gắn adapter, cùng cấu hình lượng tử, cùng dtype.
#
# Kiểm định: FRIEDMAN (k = 5, khối = ảnh test), hậu kiểm Nemenyi + Wilcoxon-Holm.
#
#   bash scripts/run_lora.sh all       # data -> train ×5 -> infer ×6 -> score -> stats -> push
#                                      # (push từng candidate ngay khi train/infer xong)
# ═════════════════════════════════════════════════════════════════════════════

seed: 42
experiment: "lora_rank"

# ── Dữ liệu (nguồn y như Thí nghiệm 1) ──────────────────────────────────────
data:
  repo: RGExp123/MIMIC_CXR_cleaned
  repo_type: dataset
  meta_csv: csv_helper/clean_dataset.csv
  image_zip: img_dir.zip
  key_column: img_rel
  ref_column: text_gt
  cache_dir: ./data
  # Repo đã đồng bộ 512² vuông. Resize về 896² do AutoProcessor GỐC của MedGemma
  # (`AutoProcessor.from_pretrained(hf_id)`), cả lúc train lẫn lúc sinh.
  image_max_side: 512
  image_max_side_enforce: true
  zip_mode: auto
  zip_stream_min_rate: 1.0

labels:
  npz: csv_helper/labels.npz
  key_array: null
  label_array: null
  encoding: {neg: [0], pos: [1], uncertain: [-1, 2], nan_to: ignore}
  # Fixture của Thí nghiệm 1 cho thấy lớp `pos` của labels.npz là lớp ÂM của
  # CheXpert (No Finding 0 ca dương / 145k; Pneumothorax "dương" 82%). `auto` đo
  # chiều nhãn bằng văn bản báo cáo (src/label_orientation.py), đảo nếu cần,
  # DỪNG nếu mơ hồ. Bằng chứng ghi vào sampling_report.json -> label_orientation.
  orientation: auto              # auto | as_is | swap

# ── Sàng lọc & lấy mẫu — LẤY MẪU MỚI (không dùng lại fixture Thí nghiệm 1) ────
sampling:
  n_train: 6400
  n_test: 3000
  # KHÔNG dùng tập val (1 epoch, lấy adapter cuối; không chọn checkpoint) -> chỉ train/test.
  n_val: 0
  # Mỗi bệnh nhân ĐÚNG một ảnh trên train ∪ val ∪ test (không trùng bệnh nhân giữa các tập).
  patient_regex: "/p(\\d{8})/"
  # "Mẫu thử phải có mặt tất cả các nhãn bệnh": tối thiểu từng ấy ca DƯƠNG mỗi nhãn.
  min_pos_per_label: {test: 30, train: 60}
  # Hồ thiếu ca dương -> ƯU TIÊN CA DƯƠNG (nhãn hiếm trước, ảnh phủ nhiều nhãn còn
  # thiếu -> đa dạng hoá nhãn), mỗi nhãn vẫn phải có mặt ở mọi tập; ghi phần thiếu.
  on_shortfall: prioritize
  # "Các nhãn ít lệch nhất": tham lam w_j = (c̄+1)/(c_j+1) − 1, rồi chia phân tầng lặp.
  method: greedy_balance
  drop_no_positive: true
  tie_noise: 1.0e-6

# ── Base + lượng tử hoá (CHUNG cho 5 candidate) ─────────────────────────────
base:
  name: "MedGemma 4B-it"
  hf_id: google/medgemma-4b-it
  family: gemma3
  system: null                   # như Thí nghiệm 1
  attn_implementation: sdpa      # cùng một kernel attention ở train và infer

# Đồng bộ kiểu dữ liệu torch cho cả 5 candidate: trọng số không lượng tử hoá
# (vision tower, projector, embedding), pixel_values, compute dtype của NF4.
dtype: bfloat16

quant:
  load_in_4bit: true
  quant_type: nf4
  double_quant: true
  compute_dtype: bfloat16        # = dtype
  # KHÔNG lượng tử hoá nhánh vision + projector + lm_head: chúng đóng băng và giữ
  # bf16 như Thí nghiệm 1. Chỉ decoder là 4-bit.
  skip_modules: [vision_tower, multi_modal_projector, lm_head]

# ── LoRA: all-linear DECODER, chỉ rank thay đổi ─────────────────────────────
lora:
  ranks: [2, 4, 8, 16, 32]
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  include: language_model        # chỉ module có đoạn tên này
  exclude: [vision_tower, multi_modal_projector, vision_model, lm_head]
  # alpha = alpha_ratio × r -> hệ số nhân alpha/r = 2 ở MỌI rank (cột rank chỉ đo
  # số chiều của cập nhật, không trộn với độ lớn cập nhật).
  alpha_ratio: 2.0
  dropout: 0.05
  bias: none
  # Trọng số adapter: float32 (master weights, chuẩn QLoRA) — giống hệt nhau ở 5 rank;
  # phép tính vẫn ở bf16. `bfloat16` để ép adapter về bf16.
  adapter_dtype: float32

# ── Huấn luyện: MỘT lịch cho cả 5 rank ──────────────────────────────────────
train:
  epochs: 1                      # MỘT epoch đi qua toàn bộ 6400 mẫu (400 bước × batch 16)
  effective_batch: 16            # BẤT BIẾN: micro-batch tự dò, loss chuẩn hoá theo token của cả bước
  # Lịch lr: 0 -> lr_max (tuyến tính, warmup_frac = 10% tổng số bước) -> cosine xuống lr_min
  # (đúng lr_min ở bước cuối).
  lr_max: 3.0e-4
  lr_min: 1.0e-5
  warmup_frac: 0.10
  weight_decay: 0.01             # AdamW (tách rời, decoupled)
  adam_betas: [0.9, 0.999]
  max_grad_norm: 1.0
  max_seq_len: 1024              # prompt (≈ 256 token ảnh + lời nhắc) + báo cáo; cắt ĐUÔI
  gradient_checkpointing: true
  # Loss CHỈ trên báo cáo + <end_of_turn> (prompt bị che -100).
  eval_every_epoch: false        # không có tập val
  select_checkpoint: last        # adapter cuối epoch
  ckpt_every_steps: 100          # checkpoint "last" để chạy lại đi tiếp
  max_micro_batch: 16            # trần thử micro-batch đầu tiên (OOM -> chia đôi, làm lại CHÍNH bước đó)
  num_workers: auto              # luồng nạp ảnh

# Tham chiếu KHÔNG vào Friedman: base 4-bit, không adapter (r = 0) — để thấy
# fine-tune có giúp không. Tắt: false.
reference_origin: true

# ── Policy sinh (y hệt Thí nghiệm 1) ────────────────────────────────────────
prompt:
  user: |-
    Write the radiology report for this chest X-ray.
    Answer in exactly this format, with no preamble and no extra sections:
    Findings: <the radiological findings>
    Impression: <the overall impression>

generate:
  do_sample: false
  num_beams: 4
  num_return_sequences: 1
  max_new_tokens: 200
  no_repeat_ngram_size: 0
  repetition_penalty: 1.08
  length_penalty: 0.8
  early_stopping: true

autotune:
  max_batch: 64
  vram_reserve_gib: 1.5
  vram_reserve_frac: 0.06
  ram_reserve_gib: 4.0

# Alignment AUC-ROC: KHÔNG đo ở thí nghiệm này.

# ── Weights & Biases: đồng bộ log huấn luyện (chỉ: step, lr, ce_loss, grad_norm) ────────────────────────────────
# Cần `WANDB_API_KEY` (hoặc đã `wandb login`). Không có -> tự chạy offline (log nằm trong
# <cands>/<id>/wandb, đẩy sau bằng `wandb sync`). W&B hỏng KHÔNG làm hỏng huấn luyện.
# Tắt hẳn: enabled: false hoặc RGEXP_NO_WANDB=1. Mỗi rank = 1 run, id cố định
# `<experiment>-<cand>` nên chạy lại / đi tiếp từ ckpt vẫn ghi vào cùng một run.
wandb:
  enabled: true
  project: rgexp-lora-medgemma
  entity: null                   # null = tài khoản mặc định của API key
  group: lora_rank
  tags: [medgemma-4b, qlora, exp2]
  log_every: 1                   # mỗi N bước tối ưu hoá (ghi: step, lr, ce_loss, grad_norm)

# ── Metrics (y hệt Thí nghiệm 1) ────────────────────────────────────────────
metrics:
  normalize:
    lowercase: true
    strip_section_headers: true
    collapse_whitespace: true
    fix_space_before_punct: true
    strip: true
  bleu_orders: [1, 2, 3, 4]
  rouge_types: [rouge1, rouge2, rougeL]
  bertscore:
    enabled: true
    model_type: roberta-large
    num_layers: 17
    rescale_with_baseline: false
    keep: [f1]
  radgraph:
    enabled: true
    model_type: radgraph-xl
    reward_level: all
  primary: radgraph_f1

# ── Thống kê: Friedman ──────────────────────────────────────────────────────
stats:
  method: friedman
  alpha: 0.05
  text_metrics: [bleu1, bleu2, bleu3, bleu4, rouge1, rouge2, rougeL, bertscore_f1, radgraph_f1]
  # Friedman (hiệu chỉnh ties) + Iman-Davenport F, Kendall W; Holm trên các metric.
  kendall_w_floor: 0.05
  # Hậu kiểm (chỉ metric qua cổng Friedman): Nemenyi CD + Wilcoxon signed-rank
  # (Pratt, giữ cặp d = 0) Holm trong từng metric; effect size rank-biserial.
  zero_method: pratt
  rrb_floor: 0.10
  posthoc_holm: permetric        # permetric | global
  posthoc_permutation: false
  # Quy tắc chọn: rank có TB metric chính cao nhất; nếu rank nhỏ hơn không khác nó
  # (Wilcoxon-Holm không bác, hoặc |r_rb| < rrb_floor) thì chọn rank NHỎ NHẤT trong
  # nhóm tương đương (ít tham số hơn, cùng chất lượng).
  selection_parsimony: true

output:
  dir: ./runs
  subdir: lora_rank
  fixture_dir: ./data/fixture_lora
  hub_repo: RGExp123/Research_v2
  hub_repo_type: dataset
  hub_folder: lora_rank
  hub_private: true
  push_adapters: true            # đẩy adapter đã chọn của từng rank (vài chục–vài trăm MB)
  # Đẩy cands/<id>/ ngay khi MỖI candidate train/infer xong (trong `all`, `train`, `infer`);
  # `all` đẩy toàn bộ một lần nữa sau stats. Tắt tạm: --no-push.
  push_each_candidate: true
  # Mặc định quét + resume: trước mỗi lệnh kéo về từ Hub phần máy này còn thiếu (fixture,
  # adapter + train_stats cùng cấu hình, predictions dài hơn, per_sample). Tắt: --no-hub-resume.
  resume_from_hub: true
