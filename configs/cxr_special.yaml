# RGExp — §2.7: CXR Specialization (General -> CXR) trên Gemma 3 4B-it
# Candidate A: Only decoder (cand_a_decoder)
# Candidate B: Vision + decoder (cand_b_vision_decoder)
# Candidate C: Vision + decoder + Recombinator with Loss = CE + 0.5*ASL (cand_c_recombinator)

section: "2.7"
name: "cxr_specialization"
description: "CXR Specialization baseline candidates for Gemma 3 4B-it prior to MoE"
base_model: "google/gemma-3-4b-it"

hub:
  repo_id: "RGExp123/Research_results"
  subdir: "2.7_cxr_special"
  push: true

local_dirs:
  adapters: "./adapters_cxr_special"
  runs: "./runs/2.7_cxr_special"

dataset:
  name: "MIMIC-CXR"
  n_train: 6400
  n_test: 3000
  n_val: 0
  streaming: true
  stream_zip_path: "RGExp123/MIMIC-CXR-ZIP/img_dir.zip"
  index_file: "data/_stream_index.json"
  seed: 42
  image_max_side: 512

model_config:
  quantization: "nf4"
  adapter_method: "qdora"
  rank: 4
  alpha: 8
  alpha_ratio: 2.0

candidates:
  cand_a_decoder:
    id: "cand_a_decoder"
    name: "Candidate A: Decoder Only"
    type: "decoder_only"
    target_modules:
      vision_encoder: false
      projector: false
      decoder: true
    loss_weights:
      ce: 1.0
      asl: 0.0

  cand_b_vision_decoder:
    id: "cand_b_vision_decoder"
    name: "Candidate B: Vision + Decoder"
    type: "vision_decoder"
    target_modules:
      vision_encoder: true
      projector: true
      decoder: true
    loss_weights:
      ce: 1.0
      asl: 0.0

  cand_c_recombinator:
    id: "cand_c_recombinator"
    name: "Candidate C: Vision + Decoder + Recombinator"
    type: "recombinator"
    target_modules:
      vision_encoder: true
      projector: true
      decoder: true
      recombinator: true
    loss_weights:
      ce: 1.0
      asl: 0.5

training:
  n_epochs: 1
  effective_batch_size: 32
  micro_batch_size: 2
  gradient_accumulation_steps: 16
  optimizer:
    name: "AdamW"
    weight_decay: 0.03
    betas: [0.9, 0.95]
  schedule:
    type: "one_cycle"
    lr_init: 0.0
    max_lr: 2.0e-4
    lr_min: 1.0e-5
    pct_start: 0.1
  asl_loss_params:
    gamma_pos: 0.0
    gamma_neg_classes:
      negative: 4.0
      positive: 3.0
      uncertain: 0.0
    margin: 0.05
  checkpoint:
    save_steps: 200

evaluation:
  baselines:
    - id: "gemma3_baseline"
      name: "Gemma 3 Zero-Shot"
      source_dir: "baselines/gemma3_baseline"
  metrics:
    - "bleu_1"
    - "bleu_2"
    - "bleu_3"
    - "bleu_4"
    - "rouge_1"
    - "rouge_2"
    - "rouge_l"
    - "bertscore_f1"
  stats:
    permutation_tests: 10000
    bootstrap_resamples: 10000
    confidence_level: 0.95
    effect_size_threshold: 0.10
    holm_adjust: true
