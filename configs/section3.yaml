# ═══════════════════════════════════════════════════════════════════════════
# §3 — Cls head · EC-Router (Expert-Choice) · MoE-DoRA   (không Mentor, không pretrain)
# ═══════════════════════════════════════════════════════════════════════════
#   3.0  Data: split MỚI cân bằng nhãn, 1 bệnh nhân – 1 mẫu (train 12800 · val 128 · test 6400)
#   3.1  DÒ c (E = 4 cố định): c ∈ {1, 2, a} + Baseline
#          c = số: mỗi expert chọn k = ⌈c·N/E⌉ token · a = Adaptive Capacity k_i = ⌈max(N/E, e^H_i)⌉
#          tiêu chí: text metric · clinical metric · E-Clinical Pearson (S) và S·Sᵀ
#   3.2  DÒ E (c = c tốt nhất của 3.1): E ∈ {2, 4, 6} + Baseline; arm E4 và Baseline kế thừa từ 3.1
#   (các exp sau 3.2: CHƯA thiết lập. Các exp 3.1/3.2/3.4 cũ nằm ở _archive/section3_v3/)
#
# Chọn bằng dòng lệnh:  bash scripts/run_section3.sh --exp 3.0|3.1|3.2
#
# CHÍNH SÁCH THÍ NGHIỆM
#   1. Infer luôn GREEDY.
#   2. Train 12800 mẫu = 400 bước × batch 32 (1 lượt qua tập train). Val mỗi 40 bước, patience 3.
#   3. Train / val / test: (i) tỉ lệ nhãn dương xấp xỉ nhau, (ii) hình dạng phân phối nhãn tương tự nhau,
#      (iii) 1 bệnh nhân – 1 mẫu (không patient nào xuất hiện hai lần, kể cả giữa các tập).
#   4. Test 6400 mẫu, 4 tập bootstrap, mỗi tập 6400 mẫu (lấy có hoàn lại).
#
# Quy ước: (1) Cls head fine-tune CÙNG LÚC với mọi thứ khác, loss = CE_text + γ·CE_cls (γ = 0.1);
#          (2) Router và Cls head nhận TOÀN BỘ token (ảnh + prompt + câu trả lời đang stream) nhưng NHÂN QUẢ như decoder;
#          (3) infer luôn GREEDY. Mọi PEFT = QDoRA rank 4.
# Loss chỉ còn 2 loại: CE cls (4 lớp CheXbert) và CE text.
seed: 42
experiment: "3.1"

data:
  repo: RGExp123/MIMIC_CXR_cleaned
  repo_type: dataset
  split_csv: test_split.csv            # tên file trong split_local_dir (split MỚI, không phải split_ref/ cũ)
  meta_csv: csv_helper/clean_dataset.csv
  image_zip: img_dir.zip
  key_column: img_rel
  ref_column: text_gt
  n_test: 6400
  manifest_dir: ./data/exp30_v4
  split_local_dir: ./data/splits_exp30_v4
  split_hub_dir: split_ref_exp30_v4    # nơi split được cache trên repo data (tạo ở exp 3.0)
  split_seed: 42
  split_patient_col: subject_id
  reuse_manifests: true
  cache_dir: ./data
  image_max_side: 512
  image_max_side_enforce: true
  zip_mode: auto
  zip_stream_min_rate: 1.0
  train_split_csv: train_split.csv
  n_train: 12800
  val_split_csv: val_split.csv
  n_val: 128                           # nhỏ để mỗi lần val (greedy generate) rẻ: 128 mẫu ≈ 4 batch
  assert_no_leak: true

# Cân bằng nhãn giữa train/val/test (đo trên nhãn CheXbert dương = positive|uncertain, 14 bệnh).
split_balance:
  max_abs_rate_diff: 0.002             # |Δ tỉ lệ dương| lớn nhất của mọi bệnh giữa hai tập bất kỳ
  max_js: 0.0001                       # JS-divergence (bit) của hồ sơ prevalence và của phân phối cardinality
  # (cặp có tập val 128 mẫu bị chặn bởi bước 1/128 ⇒ ngưỡng của cặp đó tự nới lên max(ngưỡng, 1/n) và max(ngưỡng JS, 0.06/n); train~test giữ nguyên)
  enforce: true                        # không đạt ⇒ DỪNG (không âm thầm dùng split lệch)

image_policy:
  unified: true
  resize_to: 512
  interpolation: bicubic
  keep_aspect: true
  pad_to_square: true
  pad_fill: 0
  allow_native_match: false
  per_model_normalize_only: true

base:
  hf_id: google/gemma-3-4b-it
  runner: gemma3_ec
  dtype: bfloat16
  attn_implementation_train: eager
  attn_implementation_infer: sdpa
  disable_compile: auto
  batch_size: 512
  infer_batch_probe: true
  infer_batch_probe_sizes: pow2   # thang infer: 512 → 256 → … → 1
  device_map_train: single
  device_map_infer: auto
  image: {do_pan_and_scan: false, processor_size: 896}

prompt:
  system: "You are an experienced radiologist reading a chest X-ray."
  user: |
    Write the radiology report for this chest X-ray.
    Answer in exactly this format, with no preamble and no extra sections:
    Findings: <the radiological findings>
    Impression: <the overall impression>

# GREEDY — hằng số của họ §3 (runner từ chối beam/sampling).
generate:
  max_new_tokens: 256
  do_sample: false
  num_beams: 1
  length_penalty: 1.0
  early_stopping: false
  no_repeat_ngram_size: 0
  repetition_penalty: 1.0
  num_return_sequences: 1

lora: {rank: 4}                # QDoRA rank 4 cho MỌI PEFT

heads: {d_c: 256, n_classes: 4}   # Cls head: attention pooling nhân quả N→14 (giá trị d_c chiều), Linear →4
classifier: {gamma: 0.1}       # loss = CE_text + γ·CE_cls (đồng huấn luyện)
labels:                        # nhãn sinh LAZY từ CheXbert; KHÔNG đọc labels.npz
  cache_dir: ./data
  batch_size: 32
  device: auto

train:
  # 12800 mẫu · eff_bs 32 · 400 bước = 1 epoch (1 lượt qua tập train); lr: một chu kỳ OneCycle trên cả 400 bước.
  n_epochs: 1
  steps_per_epoch: 400
  epoch_split: false
  batch_probe: true
  batch_probe_sizes: divisors  # micro-batch hạ theo ƯỚC của effective_batch_size khi OOM (32: 8 → 4 → 2 → 1)
  per_device_batch_size: 8
  effective_batch_size: 32
  grad_accum: 1
  max_seq_len: 1024
  gradient_checkpointing: true
  weight_decay: 0.001          # đồng nhất cho mọi module học được
  adam_betas: [0.9, 0.95]
  max_grad_norm: 1.0
  logging_steps: 10
  # MỘT lịch lr cho mọi pipeline: OneCycle, MỘT chu kỳ trên toàn run (400 bước): 0 → 1e-4 → 1e-8
  # (warm-up tuyến tính pct_start, rồi cosine). one_cycle=false ⇒ mỗi epoch một chu kỳ, nhân lr_decay**e.
  schedule:
    max_lr: 1.0e-4
    lr_init: 0.0
    lr_min: 1.0e-8
    pct_start: 0.1
    anneal: cos
    lr_decay: 0.875               # chỉ dùng khi one_cycle=false
    one_cycle: true
  all_linear: true             # DoRA trên MỌI Linear của decoder (q,k,v,o,gate,up,down); target_modules chỉ còn là dự phòng
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  include_prefixes: [language_model, model.language_model]
  exclude_prefixes: [vision_tower, multi_modal_projector, vision_model]
  vision_adapter:
    enabled: true
    include_prefixes: [vision_tower, vision_model]
    layers: last_third         # QDoRA trên 1/3 lớp cuối của vision encoder
    all_linear: true           # mọi Linear trong các lớp đó (q,k,v,out_proj,fc1,fc2)
    method: qdora
    rank: 4
  lora_dropout: 0.05
  bias: none
  alpha_mode: proportional
  alpha_ratio: 2.0
  alpha_fixed: 16
  quant: {load_in_4bit: true, quant_type: nf4, double_quant: true, compute_dtype: bfloat16}

# Mọi pipeline chạy tập val định kỳ; patience lần liền không cải thiện ⇒ dừng sớm
# và nạp lại tham số của lần val có loss thấp nhất.
validation:
  every_steps: 40
  patience: 3
  min_delta: 0.005       # val loss phải giảm ≥ 0.005 (tuyệt đối) so với mốc cải thiện gần nhất mới reset patience

# ── lưới thí nghiệm ────────────────────────────────────────────────────────
# 3.1: DÒ c ở E cố định. c là số (k = ⌈c·N/E⌉) hoặc "a" (Adaptive Capacity) + Baseline.
exp31:
  E: 4                                  # E cố định cho cả 3.1
  c: [1, 2, a]                          # 3 arm: c=1, c=2, a (Adaptive Capacity)
  baseline: true                        # Baseline = Gemma 3 gốc (không huấn luyện), greedy
# 3.2: DÒ E ở c = c TỐT NHẤT của 3.1 (hạng lâm sàng TB, hoà ⇒ hạng văn bản) + Baseline.
# Arm E = exp31.E và Baseline được KẾ THỪA nguyên từ 3.1 (không train/infer lại).
exp32:
  E: [2, 4, 6]
  c: null                               # null = tự chọn từ 3.1; hoặc ép: 1 | 2 | a | số (vd --set exp32.c=a)
  baseline: true

analysis:
  collapse_threshold: 0.9      # cos ΔW trung bình ngoài đường chéo ≥ ngưỡng ⇒ sụp đổ về 1 DoRA
  static_cv: 0.05              # CV của trọng số route qua ảnh < ngưỡng ⇒ route tĩnh ⇒ sụp đổ

metrics:
  normalize: {lowercase: true, collapse_whitespace: true, strip_section_headers: false}
  bleu_orders: [1, 2, 3, 4]
  rouge_types: [rouge1, rouge2, rougeL]
  bertscore: {enabled: true, model_type: roberta-large, num_layers: 17, batch_size: 32,
              rescale_with_baseline: false, keep: [f1]}
  chexbert: {enabled: true, device: auto}
  radgraph: {enabled: true, model_type: radgraph-xl, reward_level: all, batch_size: 16, device: auto}
  primary: chexbert_f1

# Chọn c / E / arm tốt nhất: mọi metric lâm sàng là metric chính (hạng TB tốt nhất); hoà ⇒ metric sinh văn bản.
selection:
  clinical: [chexbert_f1, radgraph_f1_entity, radgraph_f1_partial, radgraph_f1_complete]
  text: [bleu1, bleu2, bleu3, bleu4, rouge1, rouge2, rougeL, bertscore_f1]
  tie_tol: 0.0                  # hạng lâm sàng chênh ≤ tie_tol coi là ngang nhau

stats:
  # Kiểm định = FRIEDMAN. (1) Tổng thể: với MỖI metric, các arm (các arm của exp + Baseline) được xếp hạng trong từng ảnh test (khối = 6400 ảnh,
  # hiệu chỉnh ties, xấp xỉ F Iman-Davenport, Holm trên các metric). (2) Hậu kiểm (protected): chỉ trên metric đã
  # bác H0, mọi cặp arm bằng Wilcoxon ghép cặp + Holm toàn cục; kết luận cần thêm effect size (rank-biserial) vượt sàn.
  alpha: 0.05
  # 4 tập bootstrap × 6400 mẫu (lấy có hoàn lại) chỉ dùng cho BẢNG ĐIỂM (trung bình trên các tập bootstrap).
  n_boot: 4
  bootstrap_sample_size: 6400   # = cỡ tập test
  bootstrap_seeds: [42, 43, 44, 45]
  ci_method: percentile
  ci: 0.95
  zero_method: pratt            # Wilcoxon: GIỮ cặp hiệu số 0 khi xếp hạng (hai arm sinh cùng văn bản vẫn là bằng chứng cho H0)
  posthoc_permutation: false    # tắt permutation ở hậu kiểm (252 kiểm định × 6400 khối quá tốn); Wilcoxon cùng họ hạng với Friedman
  kendall_w_floor: 0.05         # Kendall W dưới mức này ⇒ cảnh báo "n lớn, p không còn là tiêu chí"
  rrb_floor: 0.10               # |rank-biserial| dưới mức này ⇒ cặp bị coi là không đáng kể dù p nhỏ

wandb:
  enabled: true
  project: rgexp-section3
  entity: null
  run_name: null
  group: null
  resume_same_run: false
  mode: online
  tags: [ec-router, cls-head, moe-dora, mimic-cxr]
  notes: ""
  log_every: 20
  log_samples: 20

output:
  dir: ./runs
  hub_repo: RGExp123/Research_results
  hub_repo_type: dataset
  hub_private: true
  push: true
  push_per_arm: true
  subdir: "3.1_c_vs_baseline_v4"
  adapter_dir: ./adapters_3_1_v4
