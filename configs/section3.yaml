# ═══════════════════════════════════════════════════════════════════════════
# §3 — HUẤN LUYỆN THẬT: hai chế độ, một model, toàn bộ trainset
# ═══════════════════════════════════════════════════════════════════════════
# Mục này KHÔNG phải một thí nghiệm so sánh. §2.3 hỏi "nhánh có đáng không",
# §2.4 hỏi "cấu hình MoE nào tốt hơn". §3 không hỏi gì — nó LẤY câu trả lời của
# hai mục đó làm siêu tham số và huấn luyện một model duy nhất cho tử tế:
#
#     CHẾ ĐỘ 1  sup_pretrain   Recombinator + QFormer(vec_1) + ClsHead
#                              100% có giám sát (ASL), KHÔNG decoder.
#                              Cho phân loại HỘI TỤ trước.
#
#     CHẾ ĐỘ 2  decoder_ft     Nạp nhánh đã pretrain, hạ lr của riêng nó,
#                              finetune CÙNG LÚC với decoder (CE + ASL + Aux).
#
# ── Hệ quả của "không so sánh" ─────────────────────────────────────────────
# Không có `arms`, không có `arms_moe`, không Friedman, không bootstrap ghép
# cặp, không `stats`. Một model thì không có gì để xếp hạng, và một bảng kiểm
# định với k = 1 là một bảng trống mang tên khác.
#
# `top_k`, `n_experts` và `lora.preset` (rank) ở đây là SIÊU THAM SỐ — những
# con số đã chọn, không phải những con số đang được đo. Sửa chúng là đổi model;
# nó KHÔNG làm hỏng bảng nào, vì §3 không có bảng nào để hỏng.
#
# ── Vì sao một FILE CẤU HÌNH RIÊNG ─────────────────────────────────────────
# configs/recombiner.yaml gộp §2.3 và §2.4 vào một file, có lý do: §2.4 phải
# "giữ nguyên vẹn mọi điều kiện của §2.3", và với hai file thì câu đó là một lời
# hứa chứ không phải một sự thật cơ học.
#
# §3 thì KHÔNG chịu ràng buộc ấy — nó không so với §2.3 hay §2.4, nên nó được
# phép (và cần) chạy trên toàn bộ trainset thay vì 6400 mẫu. Để nó trong cùng
# file nghĩa là một lần sửa `data.n_train` cho §3 sẽ lặng lẽ đổi tập huấn luyện
# của hai bảng đã chốt. File riêng biến chuyện đó thành không thể.
# ═══════════════════════════════════════════════════════════════════════════

seed: 42
section: "3"

# ── DỮ LIỆU: TOÀN BỘ trainset ──────────────────────────────────────────────
# `n_train: 0` = toàn bộ `train_split_csv`, không phải 6400 mẫu như §2.3/§2.4.
# Đây là khác biệt chính của §3 và là lý do nó đứng riêng.
#
# CẢ HAI chế độ dùng cùng con số này: pretrain một nhánh trên toàn split rồi
# finetune trên một tập con là tự tạo một chỗ lệch phân phối giữa hai giai đoạn
# mà không có gì trong log nói ra.
#
# Manifest ghi vào `data/section3_train.jsonl` + `data/section3_val.jsonl` —
# KHÔNG phải `trainset.jsonl` của §2.3. Dùng chung một file nghĩa là chạy §3
# xong thì tập huấn luyện của §2.3 lặng lẽ thành toàn bộ split, và bảng A/B
# không so được với lần chạy trước. Cache ẢNH thì vẫn dùng chung (`cache_dir`):
# ảnh nào đã tải thì không tải lại, và đó là thứ đắt nhất.
data:
  repo: RGExp123/MIMIC_CXR_cleaned
  repo_type: dataset
  split_csv: split_ref/test_split.csv
  meta_csv: csv_helper/clean_dataset.csv
  image_zip: img_dir.zip
  key_column: img_rel
  ref_column: text_gt

  train_split_csv: split_ref/train_split.csv
  n_train: 0               # 0 = TOÀN BỘ split
  val_split_csv: split_ref/val_split.csv
  n_val: 256               # chỉ để CHỌN epoch pretrain và nhìn đường học
  cache_dir: ./data

  # Hàng rào rò rỉ. `n_test: 0` = đọc TOÀN BỘ key của test split để đối chiếu —
  # không phải 3000 key đầu. §3 không chấm điểm nên nó không cần tải một tấm ảnh
  # test nào; nó chỉ cần DANH SÁCH KEY, và danh sách ấy phải đầy đủ.
  #
  # Rò rỉ ở đây không làm hỏng §3 (nó không có bảng), nó làm hỏng MỌI mục sau
  # này trích checkpoint của §3 — và triệu chứng là "kết quả tốt bất ngờ", tức
  # là ca hỏng duy nhất người ta có xu hướng KHÔNG đi kiểm tra.
  n_test: 0
  assert_no_leak: true

  image_max_side: 512
  image_max_side_enforce: true
  zip_mode: auto
  zip_stream_min_rate: 1.0

# ── Nhãn cho ClsHead — y hệt §2.3 ──────────────────────────────────────────
# Ở §2.3 nhãn là MỘT trong hai nguồn gradient. Ở chế độ 1 của §3 nó là nguồn
# DUY NHẤT, nên `max_missing_frac` đáng sợ hơn một bậc: vượt ngưỡng nghĩa là
# pretrain gần như không được giám sát gì cả.
labels:
  npz: csv_helper/labels.npz
  key_array: null
  label_array: null
  names_array: null
  encoding:
    neg: [0]
    pos: [1]
    uncertain: [-1, 2]
    nan_to: uncertain
  max_missing_frac: 0.20

base:
  hf_id: google/gemma-3-4b-it
  runner: gemma3_recomb
  dtype: bfloat16
  attn_implementation_train: eager
  attn_implementation_infer: sdpa
  disable_compile: auto
  batch_size: 2
  device_map_train: single
  device_map_infer: auto
  image:
    do_pan_and_scan: false
    processor_size: 896

# Prompt vẫn cần: chế độ 2 tính CE trên phần báo cáo, và `ReportDataset` dựng
# chuỗi từ đây. Chế độ 1 KHÔNG dùng khối này (không có decoder, không token hoá
# báo cáo) — giữ nguyên văn của §2.1/§2.2/§2.3 để checkpoint §3 còn so được với
# chúng nếu sau này ai đó muốn.
prompt:
  system: "You are an experienced radiologist reading a chest X-ray."
  user: |
    Write the radiology report for this chest X-ray.
    Answer in exactly this format, with no preamble and no extra sections:
    Findings: <the radiological findings>
    Impression: <the overall impression>

# ═══════════════════════════════════════════════════════════════════════════
# SIÊU THAM SỐ ĐÃ CHỌN — ba con số, và chúng là hằng số
# ═══════════════════════════════════════════════════════════════════════════
# `lora.preset` (rank + kiểu lượng tử), `moe.top_k`, `moe.n_experts`. §3 không
# đo chúng; nó dùng chúng. Đổi một trong ba là đổi model — hợp lệ, và không có
# bảng nào hỏng theo.
#
# Một điều BẮT BUỘC phải giữ khi sửa: `lora.preset` quyết định `base_method`
# (qlora -> NF4 4-bit), và `pretrain.base_method` phải khớp nó. Nhánh học trên
# `last_hidden_state` của vision tower, và một vision tower NF4 cho ra đặc trưng
# khác một vision tower bf16. Lệch hai khoá ấy là pretrain trên một phân phối
# khác phân phối gặp ở chế độ 2 — không có exception nào.
lora:
  preset: qlora_r4
  presets:
    qlora_r4:  {method: qlora, rank: 4}
    qlora_r8:  {method: qlora, rank: 8}
    qlora_r16: {method: qlora, rank: 16}
    qlora_r32: {method: qlora, rank: 32}
    qdora_r4:  {method: qdora, rank: 4}
    qdora_r8:  {method: qdora, rank: 8}
    qdora_r16: {method: qdora, rank: 16}
    qdora_r32: {method: qdora, rank: 32}

moe:
  # Ở §3, `enabled` là một khoá THẬT (ở §2.3/§2.4 nó do `--exp` đặt). Để `false`
  # là chạy §3 với LoRA thường thay vì Experts — một model khác, hợp lệ, và
  # `train_stats.json` ghi rõ nó là cái nào.
  enabled: true

  # HAI SIÊU THAM SỐ. Ở §2.4 đây là biến đang so; ở đây chúng là số đã chọn.
  # Ràng buộc duy nhất, kiểm trong code: 1 <= top_k < n_experts. `top_k =
  # n_experts` là một mô hình DÀY ĐẶC mang tên MoE — mọi expert luôn được chọn
  # nên Route_Gate không định tuyến gì.
  top_k: 6
  n_experts: 10

  router:
    noise: true
    noise_init: -3.0       # σ₀ ≈ 0.049
    logit_clip_c: 1.2      # C·tanh(x/C) — MƯỢT, không phải clamp
    renormalize_topk: true
  aux:
    kind: switch_load_balance
    alpha: 0.01
    warmup_pct: 0.1
  expert:
    method: lora           # LoRA thuần, KHÔNG DoRA — xem README_2.4 mục 4.3
    rank: null             # null = lấy rank của `lora.preset`
    alpha: null            # null = alpha_ratio × rank
    dropout: 0.05
  log_routing_n: 3000

# ── HÌNH DẠNG NHÁNH — phải GIỐNG giữa hai chế độ ───────────────────────────
# Chế độ 1 ghi checkpoint theo hình dạng này; chế độ 2 dựng lại nhánh rồi nạp
# vào. Lệch một khoá đổi shape (`swiglu_hidden`, `n_query`, `qformer.d_model`)
# là chế độ 2 DỪNG ở lúc nạp — đó là hành vi đúng, nhưng nó xảy ra SAU khi đã
# trả xong tiền GPU cho cả lần pretrain. Sửa thì sửa TRƯỚC khi chạy chế độ 1.
recombiner:
  siglip_dim: 1152
  swiglu_hidden: 2560
  out_dim: null
  n_query: 32
  n_heads: 8
  dropout: 0.0
  swiglu_dropout: 0.0
  pre_norm: true

  # QFormer: HAI query, và chúng không biết gì về nhau (self-attention giữa các
  # query bị tắt cứng trong code).
  #
  # Ở CHẾ ĐỘ 1, `freeze` bị code ÉP thành [aux] bất kể khoá này — decoder không
  # chạy nên không có gì để định tuyến, và `vec_2` không có nguồn gradient nào
  # ngoài ASL. Để ASL kéo cả hai query là để hai vector cùng học một việc.
  #
  # Ở CHẾ ĐỘ 2, `freeze` bị ÉP thành [] — `vec_2` là nguồn định tuyến, và một
  # `vec_2` bị detach nghĩa là router chạy, vẫn định tuyến, nhưng QFormer không
  # bao giờ học được cách sinh ra một `vec_2` hữu ích. Loss vẫn giảm bình thường.
  #
  # Nên khoá này ở đây chỉ là TÀI LIỆU về hình dạng; hai chế độ tự đặt nó.
  qformer:
    tasks: [sup, aux]
    freeze: [aux]
    d_model: 1024
    n_layers: 1
    n_heads: 8
    ffn_mult: 2
    dropout: 0.0

  # Bị GHI ĐÈ bằng `moe.n_experts` ở cả hai chế độ — giữ ở đây để hình dạng
  # checkpoint của chế độ 1 khớp chế độ 2 ngay cả khi ai đó tắt `moe.enabled`.
  n_experts: 8

  token_type: text
  dtype: null
  gate_init: 0.0

# ── SUP LOSS ───────────────────────────────────────────────────────────────
classifier:
  enabled: true
  feed_logits_to_decoder: false
  n_labels: null
  n_classes: 3
  hidden: 1024
  dropout: 0.1
  asl:
    gamma_neg: 2.0
    gamma_pos: 0.0
    clip: 0.05
    eps: 1.0e-8

  # Trọng số ASL trong tổng của CHẾ ĐỘ 2: loss = CE + λ·ASL + α·Aux.
  # (Chế độ 1 không có λ — ASL là toàn bộ hàm mất mát.)
  lambda: 0.2

  # λ-warmup có ĐÚNG MỘT lý do: ở bước 0 ClsHead là ngẫu nhiên. Ở §3 chế độ 2,
  # tiền đề ấy KHÔNG còn đúng — ClsHead vừa hội tụ xong ở chế độ 1.
  #
  # Giữ warmup nghĩa là trong 10% đầu lịch, đúng lúc lr leo tới đỉnh và CE mạnh
  # nhất, gần như KHÔNG có lực nào giữ nhánh ở lại chỗ nó đã hội tụ. Đó chính là
  # chỗ pretrain bị xoá đi, và đường loss trông hoàn toàn bình thường trong lúc
  # nó xảy ra.
  lambda_warmup_pct: 0.1               # dùng khi chạy chế độ 2 KHÔNG có pretrain
  lambda_warmup_pct_pretrained: 0.0    # dùng khi có pretrain — mặc định TẮT

# ═══════════════════════════════════════════════════════════════════════════
# CHẾ ĐỘ 2 — decoder_ft
# ═══════════════════════════════════════════════════════════════════════════
train:
  n_epochs: 1
  per_device_batch_size: 2
  grad_accum: 16                 # eff_bs 32
  max_seq_len: 1024
  gradient_checkpointing: true
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 10

  schedule:
    impl: lambda
    max_lr: 3.0e-4
    pct_start: 0.1
    div_factor: 25.0
    final_div_factor: 100.0
    anneal: cos
    cycle_momentum: false

  branch_weight_decay: 0.01

  # Cổng vào decoder khởi tạo 0 và AdamW dịch mỗi tham số ~lr mỗi bước, nên
  # quãng đường tối đa của nó trong một lịch ngắn là cỡ 0.04 — cổng gần như
  # KHÔNG THỂ mở. `gate_lr_mult` cho nó được PHÉP mở; `gate_final` trong
  # train_stats.json nói dữ liệu có muốn mở nó hay không.
  #
  # Lưu ý: `gate` KHÔNG được pretrain ở chế độ 1 (decoder không chạy nên nó
  # không nhận gradient), nên lập luận này còn nguyên vẹn ở §3.
  gate_lr_mult: 20.0

  # ── LR CỦA NHÁNH ĐÃ PRETRAIN ─────────────────────────────────────────────
  # Cùng tính chất AdamW ở trên, dùng NGƯỢC chiều. Sau chế độ 1, Recombinator +
  # QFormer + ClsHead đã nằm ở một cực tiểu của ASL. Ở bước 0 của chế độ 2, CE
  # là nguồn gradient MỚI và lớn — decoder chưa từng thấy 32 token này — và
  # AdamW dịch mọi tham số đi ~lr bất kể chúng đã hội tụ hay chưa.
  #
  # Với lr đỉnh 3e-4 dùng chung, vài chục bước đầu đủ để đẩy nhánh ra khỏi chỗ
  # đã hội tụ, và cái mất đi là TOÀN BỘ thứ chế độ 1 vừa mua. Triệu chứng:
  # `cls_f1_pos` tụt trong 10% đầu lịch rồi không quay lại, trong khi CE giảm
  # bình thường — không exception, không dòng log nào gọi tên nó.
  #
  # Chỉ áp lên các khối CÓ trong file pretrain (src/pretrain_io.PRETRAINED_MODULES).
  # `route_gate` vẫn còn TƯƠI ở chế độ 2 nên nó ở nhóm lr đầy đủ — ép một khối
  # ngẫu nhiên học ở 1/10 tốc độ chính là ép router học chậm gấp mười.
  pretrained_lr_mult: 0.1

  # Đóng băng hẳn thay vì hạ lr. Mặc định `false`: đóng băng biến ASL từ một LỰC
  # thành một PHÉP ĐO, và khi đó nhánh không còn học được gì từ việc decoder cần
  # gì ở nó.
  freeze_pretrained: false

  target_modules: [q_proj, k_proj, v_proj, o_proj]
  include_prefixes: [language_model, model.language_model]
  exclude_prefixes: [vision_tower, multi_modal_projector, vision_model]
  lora_dropout: 0.05
  bias: none
  alpha_mode: proportional
  alpha_ratio: 2.0
  alpha_fixed: 16

  quant:
    load_in_4bit: true
    bnb_4bit_quant_type: nf4
    bnb_4bit_use_double_quant: true
    bnb_4bit_compute_dtype: bfloat16

# ═══════════════════════════════════════════════════════════════════════════
# CHẾ ĐỘ 1 — sup_pretrain
# ═══════════════════════════════════════════════════════════════════════════
#     loss = ASL( ClsHead( QFormer_sup( Recombinator( SigLIP(ảnh) ) ) ) )
#
# Không CE, không λ, không LoRA, không Aux Loss. Decoder KHÔNG chạy — base chỉ
# được nạp để lấy ĐÚNG vision tower và processor mà chế độ 2 dùng, và lượt
# vision chạy trong `no_grad`.
#
# Hệ quả: `gate` và `route_gate` không nhận một gradient nào, nên chúng KHÔNG
# nằm trong file checkpoint. Xem src/pretrain_io.py.
pretrain:
  seed: null                 # null = dùng `seed` toàn cục

  # Batch LỚN HƠN chế độ 2 được, và đó là điểm chính: không decoder nghĩa là
  # không có 1024 token đi qua 34 lớp, và lượt vision chạy trong `no_grad`.
  # Phần tốn VRAM còn lại là activation 4096 × swiglu_hidden cho mỗi ảnh.
  per_device_batch_size: 8
  grad_accum: 4              # eff_bs 32 — BẰNG chế độ 2, có chủ ý: "một bước"
                             # có cùng nghĩa ở cả hai chế độ.
  n_epochs: 8
  max_grad_norm: 1.0
  weight_decay: 0.01         # nhánh là mạng DÀY ĐẶC, không phải LoRA
  logging_steps: 20

  # One-cycle trải trên TOÀN BỘ n_epochs, không phải mỗi epoch một chu kỳ: nhiều
  # chu kỳ nghĩa là mỗi epoch lại đẩy nhánh ra khỏi cực tiểu vừa tìm được, và
  # `ckpt/best` sẽ luôn rơi vào ngay sau một đáy chu kỳ VÌ LÝ DO CƠ HỌC.
  schedule:
    impl: lambda
    max_lr: 3.0e-4
    pct_start: 0.1
    div_factor: 25.0
    final_div_factor: 100.0
    anneal: cos
    cycle_momentum: false

  # PHẢI khớp `lora.preset` — xem chú thích ở khối siêu tham số.
  base_method: qlora

  # ── Checkpoint theo EPOCH, kèm vị trí mẫu ───────────────────────────────
  # Ghi sau MỖI lượt đi hết trainset. §3 chạy nhiều epoch, nên ranh giới epoch
  # là mốc duy nhất so sánh được giữa hai lần chạy — số bước thì phụ thuộc vào
  # batch, còn "đã đi hết dữ liệu bao nhiêu lần" thì không.
  #
  # `trainer_state.pt` giữ trạng thái Generator + cursor + chỉ số mẫu tại cursor
  # + optimizer + scheduler, nên chạy lại là ĐI TIẾP đúng chỗ. Nó KHÔNG bao giờ
  # được đẩy Hub (nặng gấp ~3 lần phần trọng số, vô nghĩa với người dùng lại).
  keep_last_ckpt: 2          # `ckpt/best` KHÔNG bao giờ bị dọn
  select_metric: cls_f1_pos  # trên VAL. `cls_acc` không dùng được: lớp `neg`
                             # áp đảo nên một head đoán `neg` cho MỌI ô vẫn đạt
                             # accuracy rất cao trong khi chưa học được gì.
  select_mode: max

  # Repo MODEL riêng cho checkpoint nhánh — tách khỏi repo kết quả của §2.x.
  # `push.push_results` có ignore_patterns chặn `*.safetensors`, nên trọng số
  # đẩy vào đó sẽ bị bỏ qua ÂM THẦM.
  hub_repo: RGExp123/RGExp_sup_pretrain
  hub_subdir: best
  hub_private: true
  push: true

wandb:
  enabled: true
