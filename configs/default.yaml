# ═════════════════════════════════════════════════════════════════════════════
# MIMIC-CXR MoE-LoRA — cấu hình mặc định (SWEEP PHASE 1)
#
#   fixed  — khoá theo tài liệu thiết kế. Sửa thì phải ghi vào sweep log.
#   sweep  — ô đang chạy: số block của Recombinator g-brmf (n = 1..4).
#   run    — tự do chỉnh theo phần cứng.
#
# Adapter đã CHỐT: QDoRA r8. Số expert (4) và top-k (2) cũng cố định ở Phase
# này — chúng là đối tượng của Phase 2, không phải Phase 1.
#
# Ghi đè: --n-block 3   hoặc   --set run.phase1_samples=3200
# ═════════════════════════════════════════════════════════════════════════════

fixed:
  # §1.1 Split cố định theo key (img_rel), không theo vị trí hàng
  n_val: 2000
  n_test: 3000
  seed: 42

  # §1.3 + §4.1 — ảnh nguồn 512² đồng bộ.
  image_size_src: 512
  resize_filter: bicubic     # chỉ dùng khi model đó có resize
  antialias: true
  pad_side_train: left      # target nằm cuối -> logits_to_keep cắt được
  pad_side_infer: right     # token sinh ra nối tiếp liền mạch

  # §1.4 Target train 100% là y_gt, tránh y_aug kém chất lượng
  target_column: text_gt

  # §1.6 — CE tiêu chuẩn + label smoothing: tổng khối lượng dồn cho các lớp
  # SAI là 0.1 (nhãn không còn one-hot), lớp đúng giữ 0.9.
  label_smoothing: 0.1

  # ── MoE: cấu hình CHỐT (hết sweep) ───────────────────────────────────────
  # 16 expert, mỗi mẫu dùng 6 -> bỏ qua 10/16 expert. Sparsity chỉ tiết kiệm
  # tính toán khi CẢ BATCH cùng bỏ qua một expert (xem src/moe.py::CTX.active);
  # với batch lớn thì gần như expert nào cũng có người chọn, nên chi phí thực
  # tế xấp xỉ 16 bản delta/step, KHÔNG phải 6.
  n_expert: 16
  top_k: 6

  # ── Adapter (đã chốt: QDoRA r8) ──────────────────────────────────────────
  lora_r: 8
  alpha_ratio: 2            # alpha = 2r = 16
  # 0.0 CÓ CHỦ Ý, không phải quên. Lớp DoRA của peft chỉ dùng được kết quả
  # base_layer đã tính sẵn khi KHÔNG có dropout; có dropout thì mỗi expert
  # phải tính LẠI phép nhân ma trận base cho x đã bị drop -> chi phí × số
  # expert. Regularization đã có label_smoothing + weight_decay lo.
  lora_dropout: 0.0
  lora_targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

  compute_dtype: bfloat16   # §4.1.3 — cần sm80+
  trainable_dtype: float32  # master weight adapter + router
  adam_eps: 1.0e-6
  quant_type: nf4
  double_quant: true

  # §2 Guard — 7 check. Ở Phase này policy TẮT nên guard chỉ ĐO (ghi pass/fail
  # vào reports.csv) chứ không sinh lại. Ngưỡng giữ nguyên để khi bật lại thì
  # so được với các lần chạy cũ.
  max_retries: 3
  max_consec_word_repeat: 2
  max_ngram_repeat_ratio: 0.25
  min_clean_char_ratio: 0.85
  max_total_tokens: 110
  min_findings_tokens: 12
  temp_decay: 0.7
  min_temp: 0.05
  rep_decay: 0.9
  min_rep_penalty: 1.05

# ─────────────────────────── Ô đang chạy ─────────────────────────────────────
sweep:
  model: gemma3
  # §2 — Recombinator chỉ còn MỘT biến thể, giữ trường này để tag ô và đường
  # ống report không phải đổi khi sau này thêm biến thể mới.
  # g-brmf  GQAttn (8 head / 4 KV-group) + Bottleneck-ResMLP FFN
  #         852_992 param/block
  variant: g-brmf
  # CHỐT: 12 block (hết sweep). Router = 1.58M stem + 12×0.85M block +
  # 0.79M separation + 0.15M sup_head + 0.13M route_head ≈ 12.9M;
  # cộng 16 expert QDoRA r8 (~15.9M/expert) ≈ 267M param trainable.
  n_block: 12

# Bảng tra: tên model + module loại khỏi adapter + CẤU HÌNH ẢNH RIÊNG.
models:
  gemma3:
    model_id: google/gemma-3-4b-it
    exclude: [vision_tower, multi_modal_projector, lm_head]
    # SigLIP của Gemma 3 chạy ở 896² CỐ ĐỊNH (bảng position embedding 4096 vị
    # trí). Cỡ khác -> phải nội suy pos-emb. 256 image token.
    image_size: 896
    hidden_size: 2560        # chiều đầu ra encoder -> đầu vào Stem
    processor_kwargs: {}
  qwen25vl:
    # Chưa nằm trong sweep Phase 1 (tài liệu chốt Gemma3-4b-it). Giữ lại để
    # đổi backbone mà không phải sửa code: Stem đọc hidden_size thật từ
    # config của model lúc build.
    model_id: Qwen/Qwen2.5-VL-3B-Instruct
    exclude: [visual, lm_head]
    image_size: null
    hidden_size: 2048
    processor_kwargs:
      min_pixels: 3136        # 56²  — sàn mặc định, chặn việc phóng to ngược
      max_pixels: 262144      # 512² — trần, chặn ảnh nguồn to hơn dự kiến

run:
  mode: both                 # train | test | both  (both = train xong chạy test)
  # false = chạy thật. true = dừng sau STAGE 0. STAGE 0 thử 2 step cho MỖI
  # phase sắp chạy (cả 1 và 2, hoặc đúng phase chọn bằng --phase / only_phase)
  # — phase 2 mới là phase giữ E bản delta + moment expert, tức phase OOM.
  dry_run: false
  # null = chạy phase 1 rồi phase 2. Đặt 1 hoặc 2 để chạy riêng một phase.
  only_phase: null

  # ── Nguồn dữ liệu: một repo HF duy nhất ───────────────────────────────────
  # RGExp123/MIMIC_CXR_cleaned/
  #   ├── csv_helper/   clean_dataset.csv, labels.npz
  #   ├── split_ref/    split_meta.json, train|val|test_split.csv
  #   └── img_dir.zip   ảnh, tổ chức thư mục chuẩn MIMIC-CXR
  data:
    repo: RGExp123/MIMIC_CXR_cleaned
    repo_type: dataset
    meta_csv: csv_helper/clean_dataset.csv
    labels_npz: csv_helper/labels.npz
    split_dir: split_ref          # trống -> tự sinh split mới
    image_zip: img_dir.zip
    image_cache: ./data/images
    # Cả hai để null = TỰ DÒ lớp bọc trong zip và số đoạn đầu img_rel cần bỏ.
    image_subdir: null
    image_rel_strip: null
    image_column: img_rel

  out_dir: ./outputs
  ckpt_dir: ./ckpt
  hub_repo: null            # null -> tự đặt theo model+variant+n_block
  hub_private: true
  push_to_hub: true
  resume: true
  force_eval: false

  use_wandb: true
  wandb_project: mimic-cxr-moe-sweep
  wandb_run: null           # null -> tự đặt theo ô sweep

  # ── Lịch hai phase (§1.7) ────────────────────────────────────────────────
  # null = TỰ CHIA: lấy TRỌN tập train (≈151k − n_val − n_test) rồi cắt đôi
  # theo thứ tự rare-first, phase 1 nửa đầu, phase 2 nửa sau. Mỗi mẫu được
  # thấy đúng MỘT lần trên cả lịch train = 1 epoch. Hai lát vẫn KHÔNG trùng
  # nhau: phase 2 học lại mẫu phase 1 đã thuộc thì val_loss hết ý nghĩa.
  # Ghi số cứng (vd 6400) sẽ vô hiệu hoá việc tự chia.
  phase1_samples: null      # chỉ nhánh supervised — loss = Focal
  phase2_samples: null      # router + expert + decoder — loss = CE+sup+aux
  n_test_samples: 200       # §1.1 — 200 mẫu sinh text có metrics

  # ── Batch: null = tự chọn theo VRAM, giữ effective_batch = 32 ─────────────
  #   ≥70GB → 8×4  |  ≥38GB → 4×8  |  ≥22GB → 2×16  |  <22GB → 1×32
  # Ghi số cứng ở đây là VÔ HIỆU HOÁ preset: config.py chỉ thay khi thấy
  # null. Trên card 16GB (4070 Ti Super / 4080) train_bs=8 chết OOM ngay
  # micro-batch đầu. Muốn ép cho MỘT lần chạy thì dùng
  #     --set run.train_bs=2 --set run.grad_accum=16
  train_bs: 8
  grad_accum: 8
  infer_bs: 8
  grad_ckpt: null
  num_workers: 4            # DataLoader worker — hạ xuống 2 trên máy ít vCPU

  # §4.1.2 — N = prompt + ảnh + target + padding. null = tự tính về lũy thừa 2.
  max_seq_len: 896
  seq_delta: 128            # chỗ chừa cho target (guard chặn ở 110 token)

  # ── Loss & optim ─────────────────────────────────────────────────────────
  lr: 1.0e-4                # expert QDoRA (nắn model đã pretrain)
  lr_router: 3.0e-4         # router (mạng train từ số 0 -> cần lớn hơn)
  weight_decay: 0.01
  max_grad_norm: 1.0

  # ── Lịch LR: cosine warm restarts (SGDR) + cộng trung bình trọng số ──────
  # MỌI mốc ở đây đếm bằng MẪU, không bằng step. Lý do: step = mẫu /
  # (train_bs × grad_accum), mà batch mỗi máy một khác — cycle dài "100 step"
  # thì máy A100 (8×8) và máy 4080 (1×32) restart ở hai chỗ khác nhau trong
  # dữ liệu, và checkpoint bàn giao giữa hai máy sẽ có đường LR gãy khúc.
  #
  # Một cycle: LR bật lên đỉnh (lr_router / lr) rồi cosine xuống đáy trong
  # đúng `cycle_samples` mẫu, rồi bật lại. Cuối mỗi cycle — lúc chạm đáy —
  # trọng số được chụp và cộng trung bình đều (SWA).
  #
  # Chọn cycle_samples thế nào: đủ dài để LR đi trọn một vòng có ý nghĩa,
  # đủ ngắn để một phase có ≥4-5 cycle (dưới 3 snapshot thì trung bình gần
  # như vô tác dụng). Phase auto ≈ 75k mẫu -> 6400 cho ~12 cycle.
  # Nên là bội của effective batch (32 hoặc 64) để biên cycle rơi đúng ranh
  # giới step; lệch thì chỉ có cảnh báo, không chặn.
  cycle_samples: 1600
  # null = MỘT cycle duy nhất (thành cosine thường có warmup, không restart).
  # Đây là cách tắt restart mà không phải nuôi nhánh code thứ hai.

  warmup_samples: 320       # CHỈ cycle đầu — các restart sau bật thẳng lên đỉnh
  warmup_steps: 10          # bản cũ, chỉ dùng khi warmup_samples = null
  min_lr_ratio: 0.0         # đáy cosine = ratio × lr. 0 = chạm đáy hẳn (SGDR gốc)
  cycle_lr_decay: 1.0       # đỉnh của cycle c = lr × decay^c. 1.0 = không giảm

  # ── SWA: cộng trung bình trọng số các snapshot đáy ────────────────────────
  # Trung bình ĐỀU (running mean, fp32, giữ trên CPU — một bản duy nhất, bộ
  # nhớ không tăng theo số cycle). Không cần pass cập nhật BatchNorm như SWA
  # kinh điển: model chỉ có LayerNorm/RMSNorm, không lớp nào giữ thống kê
  # chạy theo batch.
  #
  # Mỗi phase có bộ trung bình RIÊNG và reset khi sang phase mới: Phase 1 chỉ
  # train router với loss Focal, Phase 2 train cả expert với CE+sup+aux — hai
  # quỹ đạo khác nhau, trộn trung bình là vô nghĩa.
  #
  # Hết phase, bản trung bình được đem đi val và so với bản cuối:
  #   auto   -> val_loss thấp hơn thì thắng (mặc định — hỏi rồi mới lấy)
  #   always -> luôn dùng bản trung bình, không hỏi
  #   never  -> vẫn gom snapshot và ghi vào ckpt nhưng không bao giờ áp
  swa: true
  swa_use: always
  # Dừng sớm GIỮA cycle thì snapshot cuối KHÔNG được chụp: lúc đó trọng số
  # đang ở giữa dốc (LR cao), cho vào trung bình là kéo nó ra khỏi vùng đáy.
  # §1.7b — Total_Loss = 1·CE + 0.5·Focal + 0.07·Aux  (tỉ lệ CHỐT)
  w_sup: 0.5                # hệ số Focal (supervised) trong Phase 2
  w_aux: 0.07               # hệ số load-balancing (aux)
  focal_gamma: 2.0          # "lực phạt mũ 2"
  # §1.6 — α_ij = 1/(f_ij + ε)^p. p = 0.125 (nghịch đảo căn bậc 8) kéo dải α
  # từ ~1000× (p = 0.5, bản cũ) xuống ~5×: ô hiếm vẫn nặng hơn ô phổ biến
  # nhưng không còn một mình nuốt gradient của cả batch.
  focal_alpha_pow: 0.125
  # row | global | none — xem docstring src/losses.py::inv_freq_alpha
  focal_alpha_normalize: row

  eval_every: 10
  eval_max_batches: 20

  # ── Dừng sớm ─────────────────────────────────────────────────────────────
  # 3 lần val LIÊN TIẾP không cải thiện val_loss -> dừng phase, lưu ckpt, đi
  # tiếp (Phase 2 dừng sớm = sang thẳng infer).
  early_stop_patience: 3
  early_stop_min_delta: 0.0   # cải thiện phải > ngưỡng này mới tính
  early_stop_phases: []      # [] = tắt | [2] = chỉ Phase 2 | [1, 2] = cả hai
  # Giữ bản ckpt tại val TỐT NHẤT (chỉ trọng số, không optimizer, không push).
  # Dừng sớm mà không có bản này thì ckpt cuối là bản đã tệ đi 3 lần val.
  save_best: true
  # ── Checkpoint: đếm theo LẦN VAL, không theo step ────────────────────────
  # 2 val = 1 ckpt. Một checkpoint ≈ 1.07GB trọng số + ~2.1GB optimizer (AdamW
  # giữ 2 moment fp32 cho ~267M param trainable).
  save_every_n_vals: 2
  # Chỉ dùng khi hub_sync = false. Bật hub_sync thì MỌI lần save đều push, vì
  # lúc đó Hub là bản gốc chung của các máy — push thưa = máy khác đọc bản cũ.
  push_every_n_saves: 2

  # ── Đồng bộ NHIỀU MÁY qua Hub ────────────────────────────────────────────
  # true = trước mỗi lần val, đọc last/train_state.json trên Hub (vài KB) và
  # so tiến độ (done, phase, samples — KHÔNG so step, vì step phụ thuộc batch
  # của từng máy):
  #   ta đi trước / bằng  -> được quyền ghi, ckpt push đè lên Hub
  #   Hub đi trước ta     -> BỎ tiến độ cục bộ, tải ckpt Hub về, nạp rồi chạy
  #                          tiếp từ đó (không hỏi, ngay lập tức)
  # Một máy chạy một mình vẫn dùng được: nó luôn là bản mới nhất.
  hub_sync: true
  # true = đẩy CẢ optimizer.pt lên Hub (~2.1GB/lần). Tốn băng thông nhưng máy
  # nhận bàn giao mới có moment AdamW để chạy tiếp; false thì mỗi lần đổi máy
  # là momentum + LR reset về 0.
  hub_include_optimizer: true
  # true = đẩy cả swa.pt (bộ cộng dồn SWA, ~cỡ weights.pt) lên Hub. Bỏ nó lại
  # thì máy nhận bàn giao giữa phase bắt đầu trung bình từ 0 và bản trung bình
  # cuối cùng chỉ gom được vài cycle cuối.
  hub_include_swa: true
  log_every_sec: 60.0

  # ── Infer ────────────────────────────────────────────────────────────────
  # false = TẮT policy: sinh đúng một lần, không retry, metrics chấm trên
  # raw_output (cột "raw_outp" của bảng sweep). 7-check vẫn chạy để GHI LẠI
  # tỉ lệ vi phạm. Bật true khi muốn đo lại ảnh hưởng của guard.
  use_policy: false
  max_new_tokens: 150
  min_new_tokens: 12
  temperature: 0.3
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.2
  no_repeat_ngram: 3

  use_bertscore: true       # §1.5 optional

# ═════════════════════════════════════════════════════════════════════════════
# OPTION 2 — chạy trên GPU THUÊ THEO GIỜ (container Docker)   §0.2 / §9
#
# Khối này chỉ đổi CHỖ ĐỂ FILE và CÁCH CHẠY — không đổi bất kỳ tham số training
# nào ở `fixed`/`sweep`, nên kết quả hai option so sánh được với nhau.
# ═════════════════════════════════════════════════════════════════════════════
remote:
  # auto = bật khi thấy /.dockerenv hoặc RGEXP_REMOTE=1  |  on / off = ép cứng
  enabled: auto

  volume: /workspace
  workdir: /workspace/RGExp_proj          # nơi clone repo
  hf_home: /workspace/.cache/huggingface  # -> HF_HOME (model + dataset đã tải)
  torch_home: /workspace/.cache/torch     # -> TORCH_HOME
  image_cache: /workspace/data/images
  out_dir: /workspace/outputs
  ckpt_dir: /workspace/ckpt

  # false = KHÔNG dựng venv. Ảnh pytorch/* đã có sẵn torch khớp CUDA của máy.
  use_venv: false

  # Train một ô mất nhiều giờ. ssh đứt là SIGHUP giết tiến trình -> tmux.
  tmux_session: sweep

  # KHÔNG commit giá trị thật (repo public = lộ máy đang thuê):
  #     export RGEXP_SSH_HOST=<HOST>   RGEXP_SSH_PORT=<PORT_SSH>
  ssh_host: null
  ssh_port: null
  ssh_user: root
  ports:
    jupyter: 8888
    filebrowser: 5335
    extra: 8999

  # ── Ghi chú phần cứng: HAI cửa phải qua ───────────────────────────────────
  # 1) bf16 -> chỉ Ampere trở lên (sm80+). V100/T4 không có, dừng ngay ở
  #    detect_hardware().
  # 2) VRAM -> base NF4 ~2.5GB, nhưng QDoRA phải dequantize từng base weight
  #    trong forward và MoE giữ E bản delta cùng lúc. 16GB là sàn thực tế cho
  #    train_bs=1; 24GB trở lên mới thoải mái.
