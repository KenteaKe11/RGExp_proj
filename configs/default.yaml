# ═════════════════════════════════════════════════════════════════════════════
# MIMIC-CXR MoE-LoRA — cấu hình mặc định
#
#   fixed  — khoá theo tài liệu thiết kế. Sửa thì phải ghi vào log lần chạy.
#   arch   — model nền. KHÔNG còn sweep: kiến trúc router đã chốt hẳn.
#   run    — tự do chỉnh theo phần cứng.
#
# BA THAY ĐỔI LỚN so với bản trước, đọc trước khi sửa gì:
#
#   1. ROUTER ĐỔI HẲN KIẾN TRÚC và nó CẮM THÊM MỘT ĐƯỜNG vào decoder.
#      Feat-Extractor tự train (5 bậc conv, 1→1024 kênh, 512²→16²) → 256
#      token × 1024 chiều → self-attn → QFormer 2 query → hai head
#      (14 finding | E expert). Ngoài gate, 256 token đó còn được chiếu lên
#      2560 chiều và GHÉP VÀO ĐẦU CHUỖI decoder. Không còn ConvNeXt/DenseNet,
#      không còn backbone pretrain nào.
#   2. BỎ HẲN SWA. Trọng số đem đi chấm và đem đi probe là bản CUỐI trong
#      weights.pt, không còn trung bình snapshot nào.
#   3. EXPERT CHỈ GẮN VÀO 4 MA TRẬN ATTENTION (q, k, v, o). Không đụng vào
#      MLP của decoder — một expert còn 4.68M param thay vì 15.9M.
#
# Giữ nguyên từ bản trước: MỘT phase multi-task duy nhất; cân bằng tải bằng
# ĐÚNG một số hạng aux trong Total_Loss (Switch, sàn 1.0); lịch Gumbel và
# lịch LR đếm bằng MẪU; lịch train KHÔNG CÓ ĐÍCH (chạy tuần tự tập train,
# hết thì epoch += 1, mãi mãi, tới khi Ctrl-C hoặc hết giờ máy); lần chạy
# sau LUÔN resume nếu có checkpoint.
#
# Ghi đè:  --set run.cycle_samples=6400   hoặc   --model qwen25vl
# ═════════════════════════════════════════════════════════════════════════════

fixed:
  # §1.1 Split cố định theo key (img_rel), không theo vị trí hàng
  n_val: 2000
  n_test: 3000
  seed: 42

  # §1.3 + §4.1 — ảnh nguồn 512² đồng bộ.
  image_size_src: 512
  resize_filter: bicubic     # chỉ dùng khi model đó có resize
  antialias: true
  pad_side_train: left      # target nằm cuối -> logits_to_keep cắt được
  pad_side_infer: right     # token sinh ra nối tiếp liền mạch

  # §1.4 Target train 100% là y_gt, tránh y_aug kém chất lượng
  target_column: text_gt

  # §1.6 — CE tiêu chuẩn + label smoothing: tổng khối lượng dồn cho các lớp
  # SAI là 0.1 (nhãn không còn one-hot), lớp đúng giữ 0.9.
  label_smoothing: 0.1

  # ── MoE: cấu hình CHỐT ───────────────────────────────────────────────────
  # 24 expert, mỗi mẫu dùng 6 -> bỏ qua 18/24. Sparsity chỉ tiết kiệm tính
  # toán khi CẢ BATCH cùng bỏ qua một expert (xem src/moe.py::CTX.active);
  # với batch lớn thì gần như expert nào cũng có người chọn, nên chi phí thực
  # tế xấp xỉ 24 bản delta/step, KHÔNG phải 6.
  #
  # TOP-K THUẦN trên CẢ 12 expert. Không còn expert HỨNG (n_shared) nào bị
  # loại khỏi vòng chọn, không còn trần tải mỗi micro-batch. Cân bằng tải
  # hoàn toàn do run.w_aux lo.
  n_expert: 9
  top_k: 3

  # ── Nhiễu Gumbel khi CHỌN top-k (chỉ lúc TRAINING) ───────────────────────
  # top-k(logit + σ·Gumbel) = lấy mẫu k expert KHÔNG LẶP từ softmax(logit),
  # nên expert xếp thứ 7 vẫn thỉnh thoảng được chạy thay vì chết vĩnh viễn vì
  # thua 0.01 logit ở step đầu. eval/infer TẮT hẳn -> số đo tất định.
  #
  # ĐÂY LÀ GIÁ TRỊ SAU WARMUP (xem decay_warmup_samples). σ KHÔNG được về 0:
  # từ khi bỏ bias cân bằng tải, Gumbel là cơ chế KHÁM PHÁ DUY NHẤT còn lại,
  # và aux loss không thay được việc đó (nó chỉ nắn qua P_e — với P đều thì
  # Aux = 1.0 bất kể tải lệch tới đâu, xem src/losses.py::aux_loss).
  route_noise: 0.5

  # ── Lịch decay MŨ của σ, đếm bằng MẪU ────────────────────────────────────
  #   σ(t) = σ_start · (σ_end/σ_start)^(t/n)     t = MẪU tích luỹ, n = dưới
  #
  # σ_start = 1.0 -> lấy mẫu ĐÚNG CHUẨN Gumbel-top-k ở đầu buổi train, khi
  # route_head còn khởi tạo ngẫu nhiên và mọi expert đều đáng thử. σ_end =
  # 0.5 -> siết lại nhưng vẫn còn đảo được tuyến.
  #
  # ĐẾM BẰNG MẪU, không bằng step: step = mẫu / (train_bs × grad_accum), mà
  # batch mỗi máy một khác — "1000 step" là hai quãng dữ liệu khác hẳn nhau
  # trên máy 8×8 và máy 1×32, còn "3200 mẫu" thì rơi đúng một chỗ trên mọi
  # máy, kể cả khi checkpoint bàn giao giữa hai máy khác batch.
  #
  # null = TẮT lịch (dùng thẳng route_noise từ mẫu 0).
  # decay_warmup_samples: 0 cũng tắt.
  route_noise_start: 1.0
  decay_warmup_samples: 3200

  # ── Ảnh vào nhánh router ─────────────────────────────────────────────────
  # Router đọc THẲNG pixel_values của processor Gemma (dải [-1,1]), thu về
  # 512² rồi trung bình 3 kênh xám về 1. 512 KHÔNG phải lựa chọn tự do:
  # Feat-Extractor có 5 bậc stride-2, nên 512 cho lưới 16×16 = 256 token —
  # đúng số token được ghép vào đầu chuỗi decoder. config.py chặn cứng mọi
  # giá trị khác.
  #
  # KHÔNG còn `router_backbone` / `router_frozen_upto`: nhánh này không nạp
  # trọng số pretrain nào và train hết từ số 0 (xem src/router.py).
  router_img_size: 512

  # ── Adapter (đã chốt: QDoRA r8) ──────────────────────────────────────────
  lora_r: 8
  alpha_ratio: 2            # alpha = 2r = 16
  # 0.05: lớp DoRA của peft chỉ dùng được kết quả base_layer đã tính sẵn khi
  # KHÔNG có dropout; có dropout thì mỗi expert phải tính LẠI phép nhân ma
  # trận base cho x đã bị drop -> chi phí × số expert. Giữ nhỏ có chủ ý.
  lora_dropout: 0.0
  # CHỈ 4 ma trận attention. Không đụng gate_proj/up_proj/down_proj: MLP
  # chiếm hơn 2/3 số tham số adapter (15.9M -> 4.68M mỗi expert khi bỏ chúng)
  # trong khi chuyên môn hoá theo LOẠI PHIM là việc của attention — chọn
  # nhìn vào đâu — chứ không phải của MLP. 24 expert × 4.68M = 112M param
  # trainable, vừa với VRAM của một T4.
  lora_targets: [q_proj, k_proj, v_proj, o_proj]

  # §4.1.3 — cần sm80+. GPU không có bf16 (V100 sm70 / T4 sm75) KHÔNG đổi
  # khoá này thành float16 (Gemma 3 tràn ở layer 5) mà chạy hẳn profile fp32:
  #     bash scripts/run_v100.sh --dry-run     # = --config configs/v100_32g.yaml
  compute_dtype: bfloat16
  trainable_dtype: float32  # master weight adapter + router
  adam_eps: 1.0e-6
  quant_type: nf4
  double_quant: true

  # §2 Guard — 7 check. Policy TẮT nên guard chỉ ĐO (ghi pass/fail vào
  # reports.csv) chứ không sinh lại. Ngưỡng giữ nguyên để khi bật lại thì
  # so được với các lần chạy cũ.
  max_retries: 3
  max_consec_word_repeat: 2
  max_ngram_repeat_ratio: 0.25
  min_clean_char_ratio: 0.85
  max_total_tokens: 110
  min_findings_tokens: 12
  temp_decay: 0.7
  min_temp: 0.05
  rep_decay: 0.9
  min_rep_penalty: 1.05

# ─────────────────────────── Kiến trúc / model nền ───────────────────────────
# Trước đây khối này tên `sweep:` và có thêm `variant` + `n_block`. Không còn
# gì để quét: router đã chốt (xem src/router.py), nên chỉ còn model nền.
# `arch.tag` = "<model>-cnnqf1024" đặt tên outputs/, ckpt/, repo Hub và wandb run.
arch:
  model: gemma3

# Bảng tra: tên model + module loại khỏi adapter + CẤU HÌNH ẢNH RIÊNG.
# `hidden_size` không nằm ở đây: chiều hidden của decoder được ĐỌC TỪ chính
# config của model lúc dựng (src/model.py), vì MLP Proj của router phải chiếu
# đúng vào nó — ghi tay ở hai chỗ là để chúng lệch nhau.
models:
  gemma3:
    model_id: google/gemma-3-4b-it
    exclude: [vision_tower, multi_modal_projector, lm_head]
    # SigLIP của Gemma 3 chạy ở 896² CỐ ĐỊNH (bảng position embedding 4096 vị
    # trí). Cỡ khác -> phải nội suy pos-emb. 256 image token.
    # Router KHÔNG dùng cỡ này: nó thu 896 -> 512 (xem fixed.router_img_size),
    # tức quay lại gần đúng số pixel của ảnh nguồn.
    image_size: 896
    processor_kwargs: {}
  qwen25vl:
    # Giữ lại để đổi model nền mà không phải sửa code.
    model_id: Qwen/Qwen2.5-VL-3B-Instruct
    exclude: [visual, lm_head]
    image_size: null
    processor_kwargs:
      min_pixels: 3136        # 56²  — sàn mặc định, chặn việc phóng to ngược
      max_pixels: 262144      # 512² — trần, chặn ảnh nguồn to hơn dự kiến
run:
  mode: both                 # train | test | both | probe
  # both = train cho tới khi bị dừng tay (Ctrl-C) rồi mới chạy infer. Vì lịch
  # train không có đích, "train xong" chỉ xảy ra khi người dùng dừng: Ctrl-C
  # được bắt, checkpoint được lưu, rồi mới sang khâu infer.
  # false = chạy thật. true = dừng sau STAGE 0 (2 step thử).
  dry_run: false

  # ── Nguồn dữ liệu: một repo HF duy nhất ───────────────────────────────────
  # RGExp123/MIMIC_CXR_cleaned/
  #   ├── csv_helper/   clean_dataset.csv, labels.npz
  #   ├── split_ref/    split_meta.json, train|val|test_split.csv
  #   └── img_dir.zip   ảnh, tổ chức thư mục chuẩn MIMIC-CXR
  data:
    repo: RGExp123/MIMIC_CXR_cleaned
    repo_type: dataset
    meta_csv: csv_helper/clean_dataset.csv
    labels_npz: csv_helper/labels.npz
    split_dir: split_ref          # trống -> tự sinh split mới
    image_zip: img_dir.zip
    image_cache: ./data/images
    # Cả hai để null = TỰ DÒ lớp bọc trong zip và số đoạn đầu img_rel cần bỏ.
    image_subdir: null
    image_rel_strip: null
    image_column: img_rel

  out_dir: ./outputs
  ckpt_dir: ./ckpt
  hub_repo: RGExp123/MoE-LoRA   # PHẢI có namespace owner/name — null -> tự đặt theo arch.tag
  hub_private: true
  push_to_hub: true
  force_eval: false
  # Không còn khoá `resume`: LUÔN resume nếu có checkpoint (cục bộ hoặc Hub,
  # bản nào đi xa hơn thì lấy bản đó). Muốn train lại từ số 0 thì xoá thư mục
  # ckpt của ô đó — cố ý làm cho việc đó phải là một hành động rõ ràng.

  use_wandb: true
  wandb_project: mimic-cxr-moe-sweep
  wandb_run: null           # null -> tự đặt theo arch.tag

  # ── Lịch train: KHÔNG CÓ ĐÍCH ────────────────────────────────────────────
  # Không còn phase1_samples/phase2_samples. Vòng train đi tuần tự qua tập
  # train theo thứ tự rare-first; hết tập thì epoch_idx += 1 và đi lại từ đầu
  # đúng thứ tự đó. Con trỏ tiến độ là SỐ MẪU TÍCH LUỸ, không reset theo epoch,
  # nên checkpoint đọc được trên mọi máy dù batch khác nhau.
  n_test_samples: 200       # §1.1 — 200 mẫu sinh text có metrics (mode=test)

  # ── Phase probe: khảo sát chuyên môn expert (mode: probe) — xem §3.6 ──────
  # KHÔNG train. Nạp last/ trên Hub, sinh báo cáo cho từng
  # ảnh test, rồi bật lần lượt từng expert trong top-k (trọng số 1.0) để đo:
  # bản đồ không gian 16×16 image token của Gemma, vector 14 bệnh + 4 aspect,
  # top-10 token
  # unembedding. Mỗi ảnh xong là một bản ghi JSON, key_id = img_rel.
  probe_repo: null          # null -> "<hub_repo>-probe" (repo_type=dataset)
  probe_n_images: null      # null = TRỌN tập test (n_test_samples bị bỏ qua)
  # Số ảnh ĐẦU của tập test chạy ĐỦ n_expert expert (1+24 forward) thay vì
  # chỉ top-k (1+6 forward). Chỉ nhóm này cho hồ sơ VÔ ĐIỀU KIỆN — mọi
  # expert đo trên cùng một tập ảnh, kể cả expert router chưa từng chọn —
  # nên bảng chuyên môn và ma trận cosine trong reports/probe/ dựng trên nó.
  #   0    tắt, quay về hành vi cũ · null  MỌI ảnh chạy đủ 24 (chậm ~3.6×)
  probe_full_n: 300
  probe_commit_every: 1.0   # phút — CommitScheduler gom bao lâu thì commit
  probe_top_tokens: 10
  probe_log_every: 20       # ảnh
  probe_flush_every: 20     # ảnh — ghi lại reports.csv

  # ── Batch: null = tự chọn theo VRAM, giữ effective_batch = 32 ─────────────
  #   ≥70GB → 8×4  |  ≥38GB → 4×8  |  ≥22GB → 2×16  |  <22GB → 1×32
  # Ghi số cứng ở đây là VÔ HIỆU HOÁ preset: config.py chỉ thay khi thấy
  # null. Trên card 16GB (4070 Ti Super / 4080) train_bs=8 chết OOM ngay
  # micro-batch đầu. Muốn ép cho MỘT lần chạy thì dùng
  #     --set run.train_bs=2 --set run.grad_accum=16
  train_bs: 2
  grad_accum: 32
  infer_bs: 2
  grad_ckpt: null
  num_workers: 4            # DataLoader worker — hạ xuống 2 trên máy ít vCPU

  # §4.1.2 — N = prompt + ảnh + target + padding. null = tự tính về lũy thừa 2.
  max_seq_len: 896
  seq_delta: 128            # chỗ chừa cho target (guard chặn ở 110 token)

  # ── Loss & optim ─────────────────────────────────────────────────────────
  lr: 1.0e-4                # expert QDoRA (nắn model đã pretrain)
  lr_router: 3.0e-4         # router (mạng train từ số 0 -> cần lớn hơn)
  weight_decay: 0.01
  max_grad_norm: 1.0

  # ── Lịch LR: cosine warm restarts (SGDR), đếm bằng MẪU ──────────────────
  # MỌI mốc ở đây đếm bằng MẪU, không bằng step. Lý do: step = mẫu /
  # (train_bs × grad_accum), mà batch mỗi máy một khác — cycle dài "100 step"
  # thì máy A100 (8×8) và máy 4080 (1×32) restart ở hai chỗ khác nhau trong
  # dữ liệu, và checkpoint bàn giao giữa hai máy sẽ có đường LR gãy khúc.
  #
  # Lịch train không có đích nên cycle LẶP VÔ HẠN: mỗi cycle đúng
  # `cycle_samples` mẫu, LR bật lên đỉnh rồi cosine xuống đáy, rồi lại bật.
  #
  # Chọn cycle_samples thế nào: đủ dài để LR đi trọn một vòng có ý nghĩa, đủ
  # ngắn để một phiên máy (Kaggle 12h chẳng hạn) đi qua được vài vòng. Nên là
  # bội của effective batch (32 hoặc 64) để biên cycle rơi đúng ranh giới
  # step; lệch thì chỉ có cảnh báo, không chặn.
  cycle_samples: 3200
  # WARMUP Ở ĐẦU **MỌI** CYCLE, không chỉ cycle đầu — đổi so với bản trước.
  # SGDR gốc bật thẳng lên đỉnh ở mỗi restart với lý lẽ "moment AdamW còn
  # nguyên nên không có spike". Lý lẽ đó không đúng ở đây: cuối mỗi cycle LR
  # chạm ĐÁY (min_lr_ratio=0) nên moment bậc hai đã co theo một chuỗi bước
  # rất nhỏ, và nhảy thẳng lên 3e-4 ngay sau đó là bước dài trên một ước
  # lượng phương sai đã lỗi thời. Cái giá: mất 256/3200 = 8% mỗi cycle ở
  # vùng LR thấp. Xem src/optim.py::CosineRestartSchedule.
  warmup_samples: 256
  min_lr_ratio: 0.0         # đáy cosine = ratio × lr. 0 = chạm đáy hẳn (SGDR gốc)
  # Lịch vô hạn: giữ 1.0. Nhỏ hơn 1 nghĩa là đỉnh của cycle c = lr × decay^c,
  # tức LR tắt dần về 0 và train tự chết — gần như không bao giờ là ý muốn.
  cycle_lr_decay: 1.0

  # ── §1.7 Total_Loss = 1·CE + 0.7·ASL + 0.1·Aux   (tỉ lệ CHỐT) ──────────
  w_sup: 0.7                # hệ số nhánh supervised (ASL trên 14 finding)

  # Hệ số số hạng CÂN BẰNG TẢI. Aux = E·Σ f_e·P_e (Switch-Transformer):
  #   f_e = tỉ lệ MẪU thật sự chọn expert e   (đếm, KHÔNG gradient)
  #   P_e = xác suất TRUNG BÌNH router gán cho e   (có gradient)
  # Σf = ΣP = 1 nên Aux ≥ 1, và = 1 đúng khi cả hai đều đều.
  #
  # Nó THAY HẲN cơ chế aux-free của bản trước (bias b_e + trần tải + expert
  # hứng). Ba cơ chế cùng nắn một đại lượng thì khi tải vẫn lệch không đọc
  # được cái nào đang thắng; và bias còn làm `chosen` lúc probe lệch khỏi
  # `prob` mà không giải thích được. Giờ chỉ còn một cơ chế, một việc.
  #
  # HAI ĐIỀU CẦN BIẾT KHI ĐỌC LOG:
  #   * Aux có SÀN 1.0, nên 0.05·Aux cộng một nền ≈0.05 vào Total_Loss ngay
  #     cả khi cân bằng hoàn hảo. Đọc `balance` (= chính Aux) và so với 1.0,
  #     đừng đọc phần đóng góp trong loss.
  #   * Khi P còn gần đều (đầu buổi train) thì Aux = 1.0 BẤT KỂ tải lệch tới
  #     đâu — số hạng này chỉ cắn khi router bắt đầu tự tin sai chỗ. Đó là lý
  #     do fixed.route_noise không được về 0.
  #
  # 0.01–0.05 là dải chuẩn. 0 = tắt hẳn cân bằng tải (router sẽ sập về vài
  # expert trong vài trăm step); >0.5 thì nó lấn át CE.
  w_aux: 0.01

  # ── ASL: Asymmetric Loss trên 14 finding (§1.6) ──────────────────────────
  # Nhánh supervised KHÔNG còn softmax 4 aspect + Focal. Nhãn 4 aspect của
  # CheXbert được gập về MỘT trục nhị phân trước khi vào loss:
  #
  #     positive  -> 1.0
  #     negative  -> 0.0
  #     uncertain -> uncertain_soft (0.7 — nghiêng về dương)
  #     blank     -> MASK: không gradient, không nằm trong mẫu số
  #
  # Thứ tự 4 aspect KHÔNG hardcode: nó được suy từ chính `class_names` trong
  # labels.npz lúc chạy (src/losses.py::aspect_roles), và nổ ngay nếu không
  # khớp được — gán nhầm uncertain thành negative là lỗi im lặng.
  #
  # γ giữ ĐÚNG default của bản gốc ASL (Ridnik et al. 2021):
  asl_gamma_pos: 0.0        # nhánh dương KHÔNG focus — mọi ca dương đều học
  asl_gamma_neg: 4.0        # nhánh âm focus mạnh — ô âm dễ gần như hết grad
  # NGƯỠNG ÂM TÍNH — hằng số DUY NHẤT đi chệch default, và đi theo chuẩn y tế.
  # p⁻ = min(1 − p + m, 1): ô âm mà model đã đoán dưới m thì hết gradient HẲN.
  # Default của ASL là 0.05. Ở đây 0.02 theo mốc "probably benign" của
  # BI-RADS 3 — ngưỡng ≤ 2% khả năng ác tính, tức mức mà chuẩn đọc phim cho
  # phép xử lý một tổn thương NHƯ THỂ nó âm tính. 5% là mức bỏ sót mà không
  # chuẩn đọc phim nào chấp nhận.
  asl_clip: 0.02
  # 1 = dương, 0 = âm. "possible pneumonia" là khẳng định YẾU chứ không phải
  # phủ định, nên nó nằm ở phía dương nhưng nhẹ hơn một ca chắc chắn.
  uncertain_soft: 0.65

  eval_every: 10
  eval_max_batches: 20

  # ── Checkpoint ───────────────────────────────────────────────────────────
  # KHÔNG có dừng sớm: lịch train không có đích thì "không cải thiện 3 lần"
  # không còn là lý do để kết thúc thứ gì. Train chạy tới khi người dùng dừng.
  # Vẫn giữ bản ckpt tại val TỐT NHẤT (chỉ trọng số, không optimizer, không
  # push) để có đường lùi khi lần chạy sau đi xấu đi.
  save_best: true
  # Ckpt đếm theo LẦN VAL, không theo step. 2 val = 1 ckpt. Một checkpoint
  # ≈ 0.8GB trọng số + ~1.6GB optimizer (AdamW giữ 2 moment fp32 cho ~203M
  # param trainable).
  save_every_n_vals: 2
  # Chỉ dùng khi hub_sync = false. Bật hub_sync thì MỌI lần save đều push, vì
  # lúc đó Hub là bản gốc chung của các máy — push thưa = máy khác đọc bản cũ.
  push_every_n_saves: 2

  # ── Đồng bộ NHIỀU MÁY qua Hub ────────────────────────────────────────────
  # true = trước mỗi lần val, đọc last/train_state.json trên Hub (vài KB) và
  # so tiến độ (số mẫu tích luỹ — KHÔNG so step, vì step phụ thuộc batch của
  # từng máy):
  #   ta đi trước / bằng  -> được quyền ghi, ckpt push đè lên Hub
  #   Hub đi trước ta     -> BỎ tiến độ cục bộ, tải ckpt Hub về, nạp rồi chạy
  #                          tiếp từ đó (không hỏi, ngay lập tức)
  # Một máy chạy một mình vẫn dùng được: nó luôn là bản mới nhất.
  hub_sync: true
  # true = đẩy CẢ optimizer.pt lên Hub (~1.6GB/lần). Tốn băng thông nhưng máy
  # nhận bàn giao mới có moment AdamW để chạy tiếp; false thì mỗi lần đổi máy
  # là momentum reset về 0.
  hub_include_optimizer: true

  # ── Quota HF: giữ tối đa N revision trên repo checkpoint ─────────────────
  # HF đếm dung lượng theo TOÀN BỘ blob LFS còn trong lịch sử repo, không phải
  # theo cây file ở HEAD. Mỗi lần push last/ là ~2.4GB blob mới nằm lại vĩnh
  # viễn: ghi đè hay xoá ở commit sau không trả lại byte nào. Sau vài chục lần
  # save là repo phình tới hạn mức và mọi push tiếp theo bị từ chối.
  #
  # Hub KHÔNG có API xoá riêng revision cũ nhất — chỉ có gộp cả nhánh. Nên:
  # đếm revision sau mỗi lần push, tới bản thứ N+1 thì gộp toàn bộ lịch sử
  # còn MỘT commit. Nội dung ở HEAD (last/ best/ eval/) giữ nguyên, resume và
  # bàn giao giữa các máy không đổi; chỉ mất khả năng xem lại commit cũ.
  # Thao tác này KHÔNG hoàn tác được. Đặt 0 (hoặc null) để tắt hẳn.
  hub_keep_revisions: 7
  log_every_sec: 60.0

  # ── Infer ────────────────────────────────────────────────────────────────
  # false = TẮT policy: sinh đúng một lần, không retry, metrics chấm trên
  # raw_output (cột "raw_outp" của bảng metrics). 7-check vẫn chạy để GHI LẠI
  # tỉ lệ vi phạm. Bật true khi muốn đo lại ảnh hưởng của guard.
  use_policy: false
  max_new_tokens: 150
  min_new_tokens: 12
  temperature: 0.3
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.2
  no_repeat_ngram: 3

  use_bertscore: true       # §1.5 optional

# ═════════════════════════════════════════════════════════════════════════════
# OPTION 2 — chạy trên GPU THUÊ THEO GIỜ (container Docker)   §0.2 / §9
#
# Khối này chỉ đổi CHỖ ĐỂ FILE và CÁCH CHẠY — không đổi bất kỳ tham số training
# nào ở `fixed`/`arch`, nên kết quả hai option so sánh được với nhau.
# ═════════════════════════════════════════════════════════════════════════════
remote:
  # auto = bật khi thấy /.dockerenv hoặc RGEXP_REMOTE=1  |  on / off = ép cứng
  enabled: auto

  volume: /workspace
  workdir: /workspace/RGExp_proj          # nơi clone repo
  hf_home: /workspace/.cache/huggingface  # -> HF_HOME (model + dataset đã tải)
  torch_home: /workspace/.cache/torch     # -> TORCH_HOME
  image_cache: /workspace/data/images
  out_dir: /workspace/outputs
  ckpt_dir: /workspace/ckpt

  # false = KHÔNG dựng venv. Ảnh pytorch/* đã có sẵn torch khớp CUDA của máy.
  use_venv: true

  # Train chạy vô hạn tới khi dừng tay. ssh đứt là SIGHUP giết tiến trình -> tmux.
  tmux_session: sweep

  # KHÔNG commit giá trị thật (repo public = lộ máy đang thuê):
  #     export RGEXP_SSH_HOST=<HOST>   RGEXP_SSH_PORT=<PORT_SSH>
  ssh_host: null
  ssh_port: null
  ssh_user: root
  ports:
    jupyter: 8888
    filebrowser: 5335
    extra: 8999

  # ── Ghi chú phần cứng: HAI cửa phải qua ───────────────────────────────────
  # 1) bf16 -> chỉ Ampere trở lên (sm80+). V100/T4 không có: detect_hardware()
  #    dừng ngay, TRỪ KHI chạy profile fp32 configs/v100_32g.yaml (chậm hơn
  #    2-3× nhưng không tràn số — xem README §0.3). Trên card sm70 nhớ wheel
  #    torch cu126: bản dựng CUDA 12.8+ đã bỏ kernel Volta.
  # 2) VRAM -> base NF4 ~2.5GB, nhưng QDoRA phải dequantize từng base weight
  #    trong forward và MoE giữ E bản delta cùng lúc. 16GB là sàn thực tế cho
  #    train_bs=1; 24GB trở lên mới thoải mái.
