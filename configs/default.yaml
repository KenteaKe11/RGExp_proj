# ═════════════════════════════════════════════════════════════════════════════
# MIMIC-CXR VLM — cấu hình mặc định
#
#   fixed  — khoá theo Sweep-Strategy §1. Sửa thì phải ghi vào sweep log.
#   sweep  — ô đang chạy trong bảng §3.2 (biến thể × rank × model).
#   run    — tự do chỉnh theo phần cứng.
#
# Dữ liệu lấy hết từ Hugging Face Hub, không phụ thuộc Kaggle.
# Ghi đè: --set sweep.variant=qdora --set sweep.rank=8
# ═════════════════════════════════════════════════════════════════════════════

fixed:
  # §1.1 Split cố định theo key (img_rel), không theo vị trí hàng
  n_val: 2000
  n_test: 3000
  seed: 42

  # §1.3 + §4.1 — ảnh nguồn 512² đồng bộ.
  # Kích thước ĐƯA VÀO MODEL không còn đặt ở đây: mỗi model một vision tower
  # khác nhau nên khai riêng ở `models.<tên>.image_size` bên dưới.
  image_size_src: 512
  resize_filter: bicubic     # chỉ dùng khi model đó có resize
  antialias: true
  pad_side_train: left      # target nằm cuối -> logits_to_keep cắt được
  pad_side_infer: right     # token sinh ra nối tiếp liền mạch

  # §1.4 Target train 100% là y_gt, tránh y_aug kém chất lượng
  target_column: text_gt

  # §1.6 CE chuẩn + label smoothing
  label_smoothing: 0.1

  # §3.2 alpha = 2r kể cả khi lượng tử hóa (theo thực hành công nghiệp;
  # paper 2405.09673 gợi ý 0.5r cho QLoRA — nếu thử thì ghi vào sweep log).
  alpha_ratio: 2
  lora_dropout: 0.05
  lora_targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

  compute_dtype: bfloat16   # §4.1.3 — cần sm80+
  trainable_dtype: float32  # master weight adapter, tránh Adam eps underflow
  adam_eps: 1.0e-6
  quant_type: nf4
  double_quant: true

  # §2 Guard inference — 7 check, chạy hết cả 7, retry tối đa 3
  max_retries: 3
  max_consec_word_repeat: 2
  max_ngram_repeat_ratio: 0.25
  min_clean_char_ratio: 0.85
  max_total_tokens: 110
  min_findings_tokens: 12
  temp_decay: 0.7
  min_temp: 0.05
  rep_decay: 0.9
  min_rep_penalty: 1.05

# ─────────────────────── Ô đang chạy trong bảng §3.2 ─────────────────────────
sweep:
  # gemma3 | qwen25vl  (§3.2: ưu tiên Gemma3 trước)
  model: gemma3
  # lora | qlora | dora | qdora
  variant: dora
  # LoRA/QLoRA: 16 hoặc 32.  DoRA/QDoRA: 8 hoặc 16.
  rank: 8

# Bảng tra: tên model + module vision loại khỏi adapter + CẤU HÌNH ẢNH RIÊNG.
#
#   image_size       số  = resize ảnh về size² trước khi vào processor
#                    null = giữ nguyên kích thước gốc, để processor tự lo
#   processor_kwargs tham số đẩy thẳng vào AutoProcessor.from_pretrained
models:
  gemma3:
    model_id: google/gemma-3-4b-it
    exclude: [vision_tower, multi_modal_projector, lm_head]
    # SigLIP của Gemma 3 chạy ở 896² CỐ ĐỊNH (bảng position embedding 4096 vị
    # trí). Cỡ khác -> phải nội suy pos-emb -> vision tower ra ngoài chế độ nó
    # quen. Nên resize 512 -> 896 bằng BICUBIC (§4.1.1). 256 image token.
    image_size: 896
    processor_kwargs: {}
  qwen25vl:
    model_id: Qwen/Qwen2.5-VL-3B-Instruct
    exclude: [visual, lm_head]
    # ViT của Qwen2.5-VL là NaViT + 2D-RoPE: độ phân giải ĐỘNG, không có cỡ
    # pretrain cố định để bám. Phóng 512 -> 896 chỉ là nội suy pixel (không
    # thêm thông tin) mà tốn ~3x image token. Nên đưa thẳng ảnh gốc 512²;
    # smart_resize làm tròn về bội 28 -> 504² -> (504/28)² = 324 image token.
    image_size: null
    processor_kwargs:
      min_pixels: 3136        # 56²  — sàn mặc định, chặn việc phóng to ngược
      max_pixels: 262144      # 512² — trần, chặn ảnh nguồn to hơn dự kiến

run:
  mode: train                # train | test | both  (both = train xong chạy test)
  # false = chạy thật. true = dừng sau STAGE 0 (2 step) để kiểm cấu hình.
  dry_run: false

  # ── Nguồn dữ liệu: một repo HF duy nhất ───────────────────────────────────
  # RGExp123/MIMIC_CXR_cleaned/
  #   ├── csv_helper/   clean_dataset.csv, labels.npz
  #   ├── split_ref/    split_meta.json, train|val|test_split.csv
  #   └── img_dir.zip   ảnh, tổ chức thư mục chuẩn MIMIC-CXR
  data:
    repo: RGExp123/MIMIC_CXR_cleaned
    repo_type: dataset
    meta_csv: csv_helper/clean_dataset.csv
    labels_npz: csv_helper/labels.npz
    split_dir: split_ref          # trống -> tự sinh split mới
    image_zip: img_dir.zip
    # Thư mục giải nén ảnh. Giải nén MỘT LẦN rồi đánh dấu; lần chạy sau bỏ qua.
    image_cache: ./data/images
    # ── Khớp đường dẫn ảnh ───────────────────────────────────────────────────
    # Cả hai để null = TỰ DÒ: sau khi giải nén, code lấy vài img_rel thật trong
    # CSV rồi thử mọi tổ hợp (lớp bọc trong zip) × (số đoạn đầu img_rel cần bỏ)
    # cho tới khi mọi mẫu tồn tại trên đĩa. Chỉ đặt tay khi tự dò báo lỗi.
    #
    #   image_subdir     lớp bọc bên trong zip, vd "img_dir"
    #   image_rel_strip  số đoạn ĐẦU của img_rel phải bỏ đi, vd 1 khi CSV ghi
    #                    "files/p10/..." mà trên đĩa chỉ có "p10/...".
    #                    Key img_rel gốc KHÔNG bị sửa — split và labels.npz vẫn
    #                    chiếu theo giá trị nguyên bản.
    image_subdir: null
    image_rel_strip: null
    image_column: img_rel

  out_dir: ./outputs
  ckpt_dir: ./ckpt
  hub_repo: null            # null -> tự đặt theo model+variant+rank
  hub_private: true
  push_to_hub: true
  resume: true

  # Ô đã có eval (metrics.json + reports.csv ở out_dir, hoặc eval/ trên Hub) và
  # eval đó khớp step của ckpt -> bỏ qua khâu infer, trả 0 để sweep sang ô kế.
  # true = ép chấm lại dù đã có.
  force_eval: false

  use_wandb: true
  wandb_project: mimic-cxr-vlm-sweep
  wandb_run: null           # null -> tự đặt theo ô sweep

  n_train_samples: null     # null = full train split (~152_917)
  n_test_samples: 200       # §1.1 — sinh 200 mẫu có metrics để theo dõi hội tụ
  num_epochs: 1             # §4.1.4
  max_steps: 100           

  # ── Batch: null = tự chọn theo VRAM, giữ effective_batch = 32 (§3.2) ──────
  #   ≥70GB → 8×4  |  ≥38GB → 4×8  |  ≥22GB → 2×16  |  <22GB → 1×32
  train_bs: 8
  grad_accum: 8
  infer_bs: 8
  grad_ckpt: null

  # §4.1.2 — max_seq_len tự tính: 2^ceil(log2(prompt + img_token + delta)).
  # null = tự tính. Đặt số cụ thể để ép.
  max_seq_len: 1024
  seq_delta: 128            # chỗ chừa cho target (guard chặn ở 110 token)

  lr: 1.0e-4                # §3.2 lr_max
  weight_decay: 0.01
  warmup_steps: 10
  max_grad_norm: 1.0

  eval_every: 15
  eval_max_batches: 20
  save_every: 15
  push_every_n_saves: 2
  log_every_sec: 100.0

  max_new_tokens: 150
  min_new_tokens: 12
  temperature: 0.3
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.2
  no_repeat_ngram: 3

  use_bertscore: true       # §1.5 optional; chạy 2 lượt (raw + post)

# ═════════════════════════════════════════════════════════════════════════════
# OPTION 2 — chạy trên GPU THUÊ THEO GIỜ (container Docker)   §0.2 / §9
#
# Option 1 (mặc định) là GPU cục bộ: venv trong repo, cache ở $HOME.
# Option 2 là container thuê (vd pytorch/pytorch:latest): torch ĐÃ có sẵn trong
# python hệ thống, $HOME nhỏ và mất khi Restart, ssh đứt là mất session.
#
# Khối này chỉ đổi CHỖ ĐỂ FILE và CÁCH CHẠY — không đổi bất kỳ tham số training
# nào ở `fixed`/`sweep`, nên kết quả hai option so sánh được với nhau.
# ═════════════════════════════════════════════════════════════════════════════
remote:
  # auto = bật khi thấy /.dockerenv hoặc RGEXP_REMOTE=1  |  on / off = ép cứng
  enabled: auto

  # ── Chỗ để file: đặt hết trên volume dung lượng lớn ───────────────────────
  # Container thuê thường gắn một volume (vd 100GB) ở /workspace; lớp ghi của
  # container thì nhỏ và mất khi Restart. gemma-3-4b ~9GB + img_dir.zip vài
  # chục GB — để cache ở mặc định $HOME/.cache là hết chỗ hoặc phải tải lại.
  volume: /workspace
  workdir: /workspace/RGExp_proj          # nơi clone repo
  hf_home: /workspace/.cache/huggingface  # -> HF_HOME (model + dataset đã tải)
  torch_home: /workspace/.cache/torch     # -> TORCH_HOME
  # Ghi đè run.data.image_cache khi remote BẬT (ảnh giải nén, vài chục GB).
  # null = giữ nguyên giá trị ở run.data.image_cache.
  image_cache: /workspace/data/images
  # out_dir / ckpt_dir cũng chuyển sang volume.
  # null = giữ nguyên ./outputs, ./ckpt như option 1.
  out_dir: /workspace/outputs
  ckpt_dir: /workspace/ckpt

  # ── Python ────────────────────────────────────────────────────────────────
  # false = KHÔNG dựng venv. Ảnh pytorch/* đã có sẵn torch khớp CUDA của máy;
  # dựng venv mới sẽ cô lập mất bản torch đó, setup.sh phải tải lại ~2.5GB và
  # dễ lấy sai bản CUDA. Chỉ đặt true nếu ảnh gốc KHÔNG có torch.
  use_venv: false

  # ── Session ───────────────────────────────────────────────────────────────
  # Train một ô mất nhiều giờ. ssh đứt (wifi, máy sleep, hết phiên) là SIGHUP
  # giết tiến trình -> luôn chạy trong tmux; ssh vào lại thì `tmux attach`.
  tmux_session: sweep

  # ── Thông tin instance ────────────────────────────────────────────────────
  # KHÔNG commit giá trị thật (repo public = lộ máy đang thuê). Đặt qua biến
  # môi trường ở MÁY CỦA BẠN, không phải trong file này:
  #     export RGEXP_SSH_HOST=<HOST>   RGEXP_SSH_PORT=<PORT_SSH>
  ssh_host: null            # vd: <HOST>       (lấy trong dashboard khi thuê)
  ssh_port: null            # vd: <PORT_SSH>
  ssh_user: root
  # Port BÊN TRONG container; dashboard map ra <HOST>:<PORT_*> tương ứng.
  ports:
    jupyter: 8888
    filebrowser: 5335
    extra: 8999             # để trống cho tensorboard / http tuỳ ý

  # ── Ghi chú phần cứng: HAI cửa phải qua ───────────────────────────────────
  # 1) bf16 (§4.1.3) -> chỉ Ampere trở lên (sm80+): A100 / H100 / L40S / L4 /
  #    RTX 3090 / 4090 / 3070...  V100 (sm70) và T4 (sm75) KHÔNG có bf16,
  #    setup.sh và detect_hardware() dừng ngay ở bước kiểm GPU.
  # 2) VRAM -> Gemma3-4b ở bf16 tốn ~8.6GB CHỈ RIÊNG weight, chưa kể optimizer
  #    và activation. Máy ≤12GB (vd RTX 3070 8GB) chỉ chạy nổi nhánh lượng tử
  #    hoá: --variant qlora hoặc qdora (NF4, ~2.5GB weight). Bảng đầy đủ ở §9.4.
