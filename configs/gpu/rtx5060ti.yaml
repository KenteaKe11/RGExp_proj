# ═════════════════════════════════════════════════════════════════════════════
# CONFIG GPU — NVIDIA GeForce RTX 5060 Ti 16 GB (GDDR7, Blackwell, sm_120)
#
#     bash scripts/run_vextractor.sh --gpu rtx5060ti --detach
#     (KHÔNG truyền --gpu thì vẫn là rtx3060: src/config.DEFAULT_GPU)
#
# CHỈ các khoá trong src/config.GPU_KEYS, và PHẢI khai đủ tất cả — thiếu một
# khoá là DỪNG, không rơi về mặc định trong code. Thí nghiệm (lr, epoch, dữ liệu,
# batch HIỆU DỤNG) ở configs/vextractor.yaml. grad_accum được suy ra:
#     32 / 1 = 32
#
# Máy đích: Windows 11 · i7-12700K (8P + 4E = 20 luồng) · 28 GB RAM ·
# NVMe 1600 GB · 1× RTX 5060 Ti 16 GB. Ba con số ngoài GPU quyết định khối
# `io.*` bên dưới: 20 luồng (giải nén), 28 GB RAM (prefetch), và 1600 GB đĩa
# (tải TRỌN zip thay vì stream).
#
# ⚠ ĐỔI CARD KHÔNG ĐƯỢC ĐỔI KẾT QUẢ. File này chỉ nói "chạy thế nào", nên thứ
# duy nhất nó được phép đụng tới là TỐC ĐỘ và VRAM. Cụ thể: 4 GB thừa so với
# RTX 3060 đi vào Stage 0 / Stage 1 / sinh — KHÔNG đi vào `train.
# per_device_batch_size` (xem ngay dưới).
#
# ── Blackwell: HAI thứ phải đúng trước khi chạy ──────────────────────────────
# 1. **torch phải có cubin sm_120.** `scripts/setup.sh` đã dò đúng
#    (`compute_cap` 12.0 -> wheel `cu128`, tức torch >= 2.7). Sai bản thì
#    `import torch` vẫn chạy, `torch.cuda.is_available()` vẫn True, rồi vỡ ở
#    lượt matmul đầu bằng "no kernel image is available" — `requires.cuda_arch`
#    dưới đây bắt nó NGAY lúc nạp config (`config.check_gpu_device` so
#    `torch.cuda.get_arch_list()`), thay vì để nó nổ giữa lúc nạp model.
# 2. **bitsandbytes phải là bản có kernel sm_120.** Base của candidate là Gemma
#    3 4B **NF4**, tức mọi matmul của decoder đi qua bitsandbytes.
#    `requirements-adapters.txt` khai `bitsandbytes>=0.43.0` — một sàn, nên pip
#    lấy bản mới nhất và đúng. Nhưng nếu môi trường có gì GHIM nó xuống bản
#    trước Blackwell thì lỗi rơi đúng vào "no kernel image is available" ở lượt
#    forward đầu của decoder, KHÔNG phải lúc import.
#
# bao giờ được dùng (xem §1.1 của README — `has_cuda_kernel` luôn False vì một
# lỗi import trong code của OpenGVLab), nên Stage 0 chạy bản PyTorch ở mọi card.
# ═════════════════════════════════════════════════════════════════════════════
name: rtx5060ti
gpu_name_contains: "RTX 5060 Ti"
requires:
  cuda_arch: sm_120
  # 15, không 16: `total_memory` của card 16 GB đọc ra ~15,9 GiB. Con số này
  # còn có việc thứ hai — RTX 5060 Ti có BẢN 8 GB cùng tên, và
  # `gpu_name_contains` một mình KHÔNG phân biệt được hai bản. Mọi con số dưới
  # đây dựng cho bản 16 GB; chạy chúng trên bản 8 GB là OOM.
  min_vram_gb: 15

set:
  # ── Huấn luyện adapter — KHOÁ của $1, KHÔNG phải khoá của card ──────────
  # 1, y hệt rtx3060, và đây là chỗ DUY NHẤT của file này không được chỉnh theo
  # VRAM. Batch LOGIC mỗi lượt là một phần LỊCH HỌC của candidate A: với
  # grad_accum, loss của mỗi micro-batch được lấy trung bình theo token TRONG
  # micro-batch ấy rồi mới chia cho accum, nên đổi 1 -> 2 là đổi cách lấy
  # trung bình, tức đổi gradient — và B không còn đứng cùng bảng với A.
  # `train_vextractor.train` nói thẳng điều đó khi OOM, và
  # `fixture.set_lock("train_batch")` giữ số đã khoá, bỏ qua số mới.
  #
  # VRAM thừa của card này vì thế đi vào chỗ khác: mảnh VẬT LÝ của main stage
  # (CE ghép lại theo token nên gradient KHÔNG đổi), Stage 0, Stage 1 và sinh.
  train.per_device_batch_size: 1
  # Giữ true. Nó không đụng tới phép toán (chỉ đổi thời gian ↔ activation), nên
  # `false` là một khoá TỐC ĐỘ hợp lệ trên 16 GB — nhưng chỉ sau khi đã thấy
  # `train_stats.json` báo VRAM đỉnh còn dư, chứ không phải đoán trước.
  train.gradient_checkpointing: true
  train.prefetch: true            # dựng micro-batch kế tiếp trong 1 luồng nền

  # ── Stage 0 + Stage 1 (KHÔNG nạp Gemma) ────────────────────────────────
  # Đây mới là chỗ 4 GB thừa có nghĩa: hai giai đoạn này KHÔNG có ràng buộc nào
  # từ A, nên mảnh vật lý được phép leo tới tận `batch_size` = 32.
  #
  # Stage 0 giữ student và teacher Extractor FocalNet-Base LRF (60,25 M mỗi nhánh)
  # cùng DINO head (2,63 M mỗi nhánh).
  # Batch dò tự động theo VRAM; giảm local crop nếu thiết bị không đủ bộ nhớ.
  stage0.micro_batch: 4           # khởi điểm; autobatch dò lại (ước của 32)
  stage0.probe_sizes: [1, 2, 4]   # điểm ĐO riêng của Stage 0 (main stage dùng
                                  # autobatch.probe_sizes bên dưới). Đo ở vùng
                                  # nó thật sự chạy thì ngoại suy mới đúng.
  # Stage 1 nhẹ hơn Stage 0 hẳn một bậc: Extractor chạy `no_grad` (không giữ
  # activation), chỉ Compressor ~37,77 M có gradient, và ĐÚNG 2 view thay vì 8.
  # Trên 16 GB nó thừa sức chạm 32 — nên điểm dò mở tới đó.
  stage1.micro_batch: 16          # khởi điểm; autobatch dò lại (ước của 32)
  stage1.probe_sizes: [8, 16, 32]

  # ── Sinh + chấm ─────────────────────────────────────────────────────────
  # 4 thay vì 2: sinh không có gradient, không có optimizer state, và beam 3
  # nhân số chuỗi lên 3 lần chứ không nhân trọng số. Vẫn chỉ là KHỞI ĐIỂM —
  # autobatch sinh dò lại và KHOÁ một số dùng chung cho cả 4 candidate
  # (`fixture.set_lock("infer_batch")`), nên số này không đổi kết quả, chỉ đổi
  # thời gian. Trần 16 giữ nguyên: ảnh 896² của Gemma 3 làm KV-cache phình
  # nhanh hơn nhiều so với phần trọng số.
  base.batch_size: 4
  metrics.bertscore.batch_size: auto  # dò như hai pipeline kia (khởi điểm 64)

  # ── Batch theo hồi quy VRAM (src/autobatch.py) — BẬT, đích 80% ─────────
  # 0.80, KHÔNG 0.85 như rtx3060, và lý do là VẬT LÝ chứ không phải thận
  # trọng: 3060 ở đó là một máy THUÊ không màn hình, còn card này thường cắm
  # màn hình trên Windows — WDDM giữ sẵn ~0,5-1 GB cho desktop/trình duyệt, và
  # phần ấy KHÔNG nằm trong hồi quy của autobatch. Máy headless (Linux, không
  # X) thì nâng lại 0.85 được: nó cho thêm đúng ~0,8 GB.
  autobatch.enabled: true
  autobatch.target_frac: 0.80
  autobatch.probe_sizes: [2, 4, 8]   # điểm đo của MAIN STAGE (xem stage0.probe_sizes)
  autobatch.infer_probe_sizes: [2, 4]
  autobatch.infer_max_bs: 16

  # ── I/O (src/hw.py, src/data.py, src/prefetch.py) ───────────────────────
  # 20, không `auto`. `auto` = `hw.cpu_budget()`, và trên Windows nó rơi về
  # `os.cpu_count()` (`os.sched_getaffinity` không có) = 20 — nên hai giá trị
  # TRÙNG NHAU ở đây. Khai thẳng số vì máy đã biết: `auto` là câu trả lời cho
  # "container được cấp bao nhiêu vCPU", một câu hỏi không tồn tại trên máy này.
  #
  # 20 luồng ấy đi vào `_extract`: mỗi luồng nhận một đoạn LIỀN KỀ của zip, mở
  # handle riêng, rồi inflate + decode JPEG + resize + nén lại. PIL và zlib nhả
  # GIL nên nó scale thật trên 20 luồng logic.
  io.workers: 20
  # 4, không 3: 28 GB RAM và `train.per_device_batch_size` = 1, nên mỗi
  # micro-batch dựng sẵn chỉ là một ảnh (448² cho nhánh + 896² cho processor của
  # Gemma) — thêm một bậc queue gần như miễn phí và che được độ trễ đọc đĩa.
  io.prefetch_depth: 4            # số micro-batch dựng sẵn trước GPU
  io.pin_memory: true             # CPU->GPU không chặn (pinned + non_blocking)
  # ── `download`, KHÔNG `content`/`auto` — và đây là phép tính, không phải
  #    sở thích ────────────────────────────────────────────────────────────
  # `auto` (mặc định của `data.zip_mode`) stream trước: đọc central directory
  # rồi RANGE-request từng entry, 8 kết nối song song, fsspec đệm theo block
  # 8 MB. Nghe như nó chỉ tải phần cần — nhưng KHÔNG, ở đúng tỉ lệ của thí
  # nghiệm này:
  #
  #     cần  = n_train 6400 + n_val 2000 + n_test 3000 = 11 400 ảnh
  #     zip  = 157 917 entry / 17,7 GB  ->  ~112 KB/ảnh, ~71 entry mỗi block 8 MB
  #     tỉ lệ cần = 7,2%, và split là mẫu NGẪU NHIÊN nên chúng RẢI RÁC
  #     => P(một block 8 MB chứa ít nhất một ảnh cần) = 1 − (1−0,072)^71 ≈ 99,5%
  #
  # Tức stream phải chạm gần như MỌI block, tải gần đủ 17,7 GB ấy — nhưng qua
  # 8 kết nối HTTPS với một lượt đi-về mỗi block, thay vì một lượt tải trọn file
  # đa kết nối (hf_transfer / hf_xet, `scripts/_env.sh` bật). Và `auto` cũng
  # không cứu được: nó chỉ bỏ stream khi tốc độ dưới `data.zip_stream_min_rate`
  # = 1 ảnh/s — ở mức ấy 11 400 ảnh là hơn 3 GIỜ mà vẫn "đủ nhanh" để không
  # fallback.
  #
  # `download` đổi cả hai chỗ: tải trọn zip đa kết nối (và `hf_hub_download`
  # CACHE nó, nên lần chạy sau — kể cả sau `--retrain-all` — là 0 byte mạng),
  # rồi giải nén bằng `io.workers` = 20 luồng trên NVMe thay vì 8 luồng bị
  # chặn ở mạng. Giá: ~17,7 GB đĩa cho zip (cộng ~1 GB cache ảnh đã resize,
  # là không đáng kể. Đây CHÍNH là lý do rtx3060 cũng khai `download`; khác biệt
  # duy nhất là ở đó đĩa 100 GB nên con số phải cân, còn ở đây thì không.
  io.zip_mode: download
