# ═════════════════════════════════════════════════════════════════════════════
# Profile — 1 × NVIDIA RTX PRO 6000 Blackwell, lát MIG 2g.48gb
#           (~48 GB, một nửa số SM của card, sm_120)
#
#     export CUDA_VISIBLE_DEVICES=MIG-<uuid>      # nvidia-smi -L
#     bash scripts/run_pretrain.sh  --hw rtx_pro_6000_mig_2g48 --detach
#     bash scripts/run_section25.sh --hw rtx_pro_6000_mig_2g48 --mode comparer_pretrain --detach
#     bash scripts/run_section25.sh --hw rtx_pro_6000_mig_2g48 --detach
#
# Luật của hai khối giống hệt `rtx_pro_6000_blackwell.yaml` (đọc đầu file đó).
#
# `experiment:` CHÉP NGUYÊN khối của profile 96 GB — cùng thí nghiệm 16384 mẫu
# / My Gemma 2 epoch, cùng run dir, cùng thư mục checkpoint, cùng repo Stage 0.
# Chung chỗ ở đây là CỐ Ý: chỉ `set:` (phần cứng) khác nhau, batch hiệu dụng
# bằng nhau, nên checkpoint baseline train trên card đủ 96 GB (--mode
# comparer_pretrain) được lát MIG kéo về dùng thẳng, và ngược lại. selftest
# kiểm hai khối `experiment:` bằng nhau từng khoá.
#
# MIG: một lát chỉ thấy MỘT thiết bị CUDA, không P2P, không NVLink, và chỉ có
# phần SM của lát — thời gian mỗi bước xấp xỉ gấp đôi card nguyên. Bộ nhớ
# `torch.cuda.get_device_properties(0).total_memory` là của LÁT (~47 GiB).
# ═════════════════════════════════════════════════════════════════════════════
name: rtx_pro_6000_mig_2g48
gpu_name_contains: "RTX PRO 6000"
requires:
  cuda_arch: sm_120
  min_vram_gb: 44

set:
  # ── My Gemma · decoder_ft — eff_bs 32 = 2 × 16 ─────────────────────────
  # Không checkpointing: ước lượng ~20 GB ở 2 mẫu × ~1.3k token (logits fp32
  # trên từ vựng 262k ~2.7 GB). Hết VRAM thì bật lại checkpointing TRƯỚC khi
  # hạ về 1 × 32.
  train.per_device_batch_size: 2
  train.grad_accum: 16
  train.gradient_checkpointing: false

  # ── Stage 0 — eff_bs 32 = 32 × 1 ───────────────────────────────────────
  # Đo trên lát này (nvidia-smi, 20/09): 16 × 2 chỉ dùng ~11 GB / 48 GB. Ảnh
  # cố định 896px nên VRAM mỗi bước là hằng số — 32 × 1 (~22 GB) hết VRAM thì
  # nổ ngay ở bước đầu, không phải sau vài giờ. 32 là trần: grad_accum >= 1.
  pretrain.per_device_batch_size: 32
  pretrain.grad_accum: 1
  pretrain.data_threads: 8

  # ── R2Gen / AdaAtt — AdaAtt 80 = 40 × 2 · R2Gen 16 = 16 × 1 · Stage 0 32 × 1
  # Ảnh cố định 512px -> VRAM mỗi bước hằng số, hết VRAM là nổ ở bước đầu.
  # Nổ thì hạ về 20 (80 = 20 × 4).
  sota_train.micro_batch: 40
  sota_train.infer_batch: 16      # × beam 3 = 48 chuỗi mỗi lượt
  sota_train.num_workers: 8

  # ── Sinh + chấm ─────────────────────────────────────────────────────────
  base.batch_size: 8              # My Gemma sinh: 8 ảnh × beam 3
  metrics.bertscore.batch_size: 64

experiment:
  # CHÉP NGUYÊN từ rtx_pro_6000_blackwell.yaml — sửa một bên thì sửa cả hai.
  data.n_train: 16384
  pretrain.n_train: 16384
  # Stage 0 (sup_pretrain của My Gemma + Stage 0 của hai baseline): 2 epoch
  # thay vì 3 — tập train dài gấp 2.56 lần, nên 2 epoch vẫn nhiều bước hơn
  # (2 × 512 = 1024 bước so với 3 × 200 = 600). Điều kiện 5 giữ: CẢ BA dùng
  # chung con số này.
  pretrain.n_epochs: 2
  # My Gemma · decoder_ft: 2 epoch = 2 × 512 = 1024 bước, MỘT chu kỳ one-cycle
  # trải trên CẢ 1024 bước (warm-up 10% đầu -> đỉnh -> cosine về đáy ở bước
  # cuối), KHÔNG restart ở ranh giới epoch. `train_recomb.ft_lrs` DỪNG nếu
  # `train.schedule` khai `cycle_steps`/`lr_decay`; selftest kiểm đường lr.
  train.n_epochs: 2

  output.subdir: "2.5_sota_b16k"
  output.adapter_dir: ./adapters_2_5_b16k
  pretrain.subdir: sup_pretrain_b16k
  pretrain.hub_repo: RGExp123/RGExp_sup_pretrain_b16k
  sota_hub.subdir: "2.5_sota_b16k"
