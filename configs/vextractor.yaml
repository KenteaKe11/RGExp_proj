# ═════════════════════════════════════════════════════════════════════════════
# §2.2 V-EXTRACTOR — [Z ‖ T] vs [Z ‖ Q ‖ T] — CONFIG NỘI DUNG
# ═════════════════════════════════════════════════════════════════════════════
# Câu hỏi: trên ĐÚNG candidate `qlora_r32_decoder` của $1 (Gemma 3 4B NF4 +
# QLoRA r32 trên mọi Linear của decoder, 1 epoch = 200 bước, cùng 6400 mẫu train,
# cùng loader, cùng 3000 ảnh test), NỐI thêm 16 learner vector Q ngay sau 256
# token ảnh có đổi chất lượng báo cáo không?
#
#   A  qlora_r32_decoder           — LẤY TỪ $1 (weight + predictions + điểm có
#                                    tem khớp), KHÔNG huấn luyện lại.
#   B  qlora_r32_decoder_vextractor  — Stage 0 (backbone ViT-B/16 học TỰ GIÁM SÁT
#                                    bằng DINO, KHÔNG nhãn; checkpoint đem đi là
#                                    bản TEACHER/EMA) -> main stage y hệt A +
#                                    nhánh V-Extractor (backbone teacher infer).
#
# Biến DUY NHẤT giữa A và B là chuỗi vào decoder: [Z ‖ text] vs [Z ‖ Q ‖ text],
# với Q = Aligner(Extractor(ViT-B/16-teacher(ảnh 448²))) — 16 vector MỚI; Z (256 token ảnh) KHÔNG bị đụng vào.
# 16 vị trí thêm có nhãn −100 nên số token vào CE không đổi. KHÔNG có lớp khởi
# tạo 0. Stage 0 chỉ dạy ENCODER (tự giám sát, không nhãn), còn Extractor
# và Aligner là của main stage — nên Q ở bước 0 là ngẫu nhiên, và thứ mang sẵn
# thông tin là các đặc trưng thị giác nó đọc. Kiểm định: bootstrap ghép cặp (BCa) + permutation đảo dấu,
# Holm trên các metric (`src/stats_ab.py`).
#
# KHÁC §2.0 (`_archive/zrecomb/`, Recombiner Test): ở đó có khối Recomb chiếu X
# lên 2560 rồi Z bị THAY bằng Z' = Z + Retriever(Z, R), chuỗi không dài thêm. Ở
# đây nhánh có encoder RIÊNG (DINOv3 ViT-B/16 ăn ảnh 448²) — và chuỗi dài
# thêm 32.
#
# Mọi khoá quyết định KẾT QUẢ của A (seed, data, image_policy, base, prompt,
# generate, train, metrics) được chép NGUYÊN VĂN từ configs/lora.yaml của $1
# (_archive/v2/configs/lora.yaml) — vân tay fixture của file này PHẢI trùng $1
# (selftest kiểm), nếu không thì B không đứng cùng bảng với A được.
# Phần riêng của §2.2 nằm ở các khối `labels`, `stage0`, `vextractor`, `vextractor_exp`.
#
#   bash scripts/run_vextractor.sh train    # kéo A từ $1 -> Stage 0 -> main -> sinh -> chấm
#   bash scripts/run_vextractor.sh stats    # bootstrap + permutation -> REPORT.md (GHI ĐÈ)
#   bash scripts/run_vextractor.sh push     # -> current/$2.2_V-Extractor_Test/
# ═════════════════════════════════════════════════════════════════════════════

seed: 42

experiment: "vextractor"

# ── Dữ liệu — điều kiện 2 ──────────────────────────────────────────────────
# Khoá cứng. Ba candidate đọc CÙNG hai file split; `assert_no_leak` là hàng
# rào cơ học chứ không phải một lời hứa trong README.
data:
  repo: RGExp123/MIMIC_CXR_cleaned
  repo_type: dataset
  split_csv: split_ref/test_split.csv
  meta_csv: csv_helper/clean_dataset.csv
  image_zip: img_dir.zip
  key_column: img_rel
  ref_column: text_gt
  n_test: 3000
  cache_dir: ./data
  image_max_side: 512
  image_max_side_enforce: true
  zip_mode: auto
  zip_stream_min_rate: 1.0
  train_split_csv: split_ref/train_split.csv
  n_train: 6400
  val_split_csv: split_ref/val_split.csv
  # HỒ val: 2000 mẫu được tải về và giữ trong cache. Mỗi lần eval bốc RANDOM
  # `train.eval.n_samples` (256) trong hồ này — xem khối `train.eval`.
  n_val: 2000
  assert_no_leak: true

# ── Chính sách ảnh — điều kiện 4 ───────────────────────────────────────────
# R2Gen (ResNet-101) và AdaAtt (ResNet-152) đều quen 224; Gemma 3 xử lý ở 896.
# Ba con số khác nhau, và đó KHÔNG phải lý do để mỗi model tự resize theo cách
# của nó: nếu R2Gen dùng RandomCrop còn Gemma dùng bilinear-longest-side thì
# một phần chênh lệch trong bảng là chênh lệch của hai bộ tiền xử lý, không
# phải của hai kiến trúc.
#
# Nên: MỘT lần resize dùng chung, ở `resize_to`, trước khi bất kỳ processor
# riêng nào chạm vào ảnh. `allow_native_match: false` nghĩa là ngay cả khi một
# model đòi đúng `resize_to` thì ảnh vẫn đi qua đường chung ấy — "vô tình
# khớp" không được phép biến thành một đường tiền xử lý thứ hai.
image_policy:
  unified: true
  resize_to: 512              # cạnh dài; khớp `data.image_max_side`
  interpolation: bicubic
  keep_aspect: true
  pad_to_square: true
  pad_fill: 0
  allow_native_match: false
  # Sau bước chung, mỗi model chỉ còn được phép chuẩn hoá giá trị pixel theo
  # thống kê của backbone nó (ImageNet mean/std cho ResNet, SigLIP cho Gemma).
  # Đó là phép biến đổi trên GIÁ TRỊ, không phải trên HÌNH HỌC.
  per_model_normalize_only: true

# ══════════════════════════════════════════════════════════════════════════
# CANDIDATE C — MY GEMMA
# ══════════════════════════════════════════════════════════════════════════
base:
  hf_id: google/gemma-3-4b-it
  runner: gemma3_vextractor
  dtype: bfloat16
  attn_implementation_train: eager
  attn_implementation_infer: sdpa
  disable_compile: auto
  device_map_train: single
  device_map_infer: auto
  image:
    do_pan_and_scan: false
    processor_size: 896

prompt:
  system: "You are an experienced radiologist reading a chest X-ray."
  user: |
    Write the radiology report for this chest X-ray.
    Answer in exactly this format, with no preamble and no extra sections:
    Findings: <the radiological findings>
    Impression: <the overall impression>

# ── Giải mã — MỘT đặc tả cho CẢ BA candidate (`src/decoding_spec.py`) ─────
# My Gemma đưa khối này cho `transformers.generate`; R2Gen/AdaAtt đưa nó cho
# `src/sota/decoding.beam_search`, vốn cài lại ĐÚNG luật beam search của
# transformers — kể cả lúc chọn checkpoint trên val. Khối `sota.*.decoding`
# bên dưới chỉ còn là bản ghi của paper (điều kiện 1) và KHÔNG được đọc; chỗ
# lệch (block_trigrams của R2Gen) vào `manifest.deviations`.
#
# Mọi khoá phải khai TƯỜNG MINH: generation_config.json của Gemma 3 khai
# sampling, và một khoá bỏ trống là để nó chen vào.
#
# Khác biệt duy nhất: độ dài tối đa. `max_new_tokens` là của My Gemma
# (subword); R2Gen/AdaAtt dừng ở `max_seq_length − 1` = 59 từ của từ điển.
#
# Với MoE, trọng số định tuyến của mỗi ảnh được nhân bản theo beam
# (`moe.RoutingContext.set(..., repeat=num_beams)`). Beam nhân số chuỗi trong
# một lượt sinh lên 3 lần: hết VRAM thì hạ `base.batch_size`.
generate:
  max_new_tokens: 256
  do_sample: false
  num_beams: 3
  length_penalty: 1.0          # điểm = tổng log-prob / (số token sinh)^1
  early_stopping: false        # heuristic dừng của transformers
  no_repeat_ngram_size: 0      # không chặn n-gram
  repetition_penalty: 1.0      # không phạt lặp
  num_return_sequences: 1

# ═════════════════════════════════════════════════════════════════════════════
# LỊCH MAIN STAGE — CHÉP NGUYÊN VĂN TỪ $1 (khoá của fixture). Candidate B dùng
# ĐÚNG khối này cho LoRA: 1 epoch, eff_bs 32, one-cycle đỉnh 1e-4, wd 0.01,
# val 256 mẫu mỗi 25 bước. Các khoá `ft_lr`, `freeze_*`, `branch_weight_decay`,
# `pretrained_lr_mult` là của §2.x cũ — $2 KHÔNG đọc chúng (lr của nhánh ở
# `vextractor.main`), chúng ở lại chỉ để khối này trùng $1 từng chữ.
# ═════════════════════════════════════════════════════════════════════════════
train:
  n_epochs: 1   # decoder_ft: 1 epoch
  # Batch HIỆU DỤNG của decoder_ft. Số mẫu mỗi lượt ở configs/gpu/<card>.yaml;
  # grad_accum = 32 / per_device_batch_size (phải chia hết).
  effective_batch: 32
  max_seq_len: 1024
  weight_decay: 0.01
  max_grad_norm: 1.0
  logging_steps: 10
  # Ghi trọng số ra đĩa mỗi bao nhiêu bước. 0 = tắt (chỉ ghi 1 lần ở cuối).
  # Mốc này tồn tại vì một lần chết CUDA ở bước cuối đã xoá sạch 3 giờ.
  save_every_steps: 25

  # ── Đo trên val — CHỈ để nhìn, KHÔNG chạm vào trọng số ──────────────────
  # Mỗi `every_steps` bước (và ở bước cuối), bốc NGẪU NHIÊN `n_samples` = 256
  # trong `data.n_val` = 2000 mẫu val rồi tính CE trên đó. Không chọn
  # checkpoint theo val, không early stop: mọi candidate vẫn chạy ĐÚNG một
  # epoch với cùng lịch one-cycle như README chốt — val chỉ trả lời "candidate
  # này có bắt đầu học thuộc tập train chưa".
  #
  # `resample: true` = bốc lại mỗi lần eval ("mỗi lần"), nên đường val hơi
  # nhiễu: mỗi điểm đo trên một tập 256 khác nhau. Bù lại nó phủ hết 2000 mẫu
  # sau vài lần đo thay vì nhìn mãi một góc.
  #
  # Tập 256 ấy KHÔNG phụ thuộc candidate: chỉ số được sinh từ (seed, số thứ tự
  # lần eval) chứ không từ arm id, nên ở lần eval thứ k mọi candidate đo
  # trên ĐÚNG cùng 256 mẫu và các đường val so được với nhau. Cũng vì thế nó
  # tái lập được: chạy lại cùng seed cho đúng những tập ấy (`seed_mix` đổi số
  # này nếu muốn một loạt tập khác).
  eval:
    enabled: true
    n_samples: 256
    every_steps: 25
    resample: true
    seed_mix: 0
  # MỘT chu kỳ one-cycle cho TOÀN BỘ main-stage (1 epoch, không restart —
  # KHÔNG khai `cycle_steps`/`lr_decay` ở đây), để mọi nhóm cùng hạ về đáy ở
  # bước cuối. Mọi nhóm dùng cùng div 30 · final_div 33.3 (đỉnh/đáy ≈ 1000),
  # rồi đầu warm-up và đáy được LÀM TRÒN XUỐNG còn 1 chữ số có nghĩa
  # (`round_down_sig: 1`):
  #
  #     nhóm                                    đầu      đỉnh      đáy
  #     cls_head · route_head · dec_proj · FFN  1e-5  -> 3e-4   -> 3e-7
  #     recombinator_retriever_3 (i = n)        1e-5  -> 3e-4   -> 3e-7
  #     recombinator_retriever_2                1e-6  -> 5.48e-5 -> 5e-8
  #     adapter (LoRA/Experts)                  3e-6  -> 1e-4   -> 1e-7
  #     recombinator_retriever_1 (+ Query)      3e-7  -> 1e-5   -> 1e-8  <- đáy nhỏ nhất
  #
  # `min_lr` là con số ĐƯỢC KIỂM (`train_recomb.ft_lrs` DỪNG nếu lệch), không
  # phải con số được đọc.
  schedule:
    impl: lambda
    max_lr: 1.0e-4          # adapter / Experts (LoRA)
    min_lr: 1.0e-8          # = đáy (đã làm tròn) của nhóm nhỏ nhất (Retriever 1)
    round_down_sig: 1       # làm tròn XUỐNG đầu warm-up + đáy; 0 = tắt
    pct_start: 0.1
    div_factor: 30.0
    final_div_factor: 33.3  # 1e-5 / 30 / 33.3 = 1.001e-8 -> làm tròn 1e-8
    anneal: cos
    cycle_momentum: false
  branch_weight_decay: 0.01

  # ĐIỀU KIỆN 5 — CHỈ cho R2Gen/AdaAtt (`src/train_sota.py`): phần đã pretrain
  # chạy main-stage ở lr × 0.1. My Gemma KHÔNG đọc khoá này nữa.
  pretrained_lr_mult: 0.1
  # My Gemma · decoder_ft — lịch lr ĐƠN GIẢN (`train_recomb.ft_lrs`):
  #   1. lr_max toàn hệ = `max_lr` (3e-4): Sup Head, Route Head, Concat Linear,
  #      FFN của Recombinator và Retriever n. LoRA/Experts ở `schedule.max_lr`.
  #   2. lr_max CHỈ đổi theo Retriever i = 1..n, tăng dần theo cấp số nhân:
  #      i=1 = `retriever_first` (1e-5, kèm Learnable Query), i=n = `max_lr`.
  #      n = 3: 1e-5 · 5.48e-5 · 3e-4. Không có hệ số Attn ở decoder_ft.
  # Phải khai ĐÚNG hai khoá.
  ft_lr:
    max_lr: 3.0e-4               # lr_max toàn hệ
    retriever_first: 1.0e-5      # Retriever 1 (+ Learnable Query)
  # KHÔNG đóng băng gì — decoder_ft fine-tune toàn bộ. Khoá còn giữ để đối
  # chứng khi cần (requires_grad=False + eval mode + ngoài optimizer). Nhận:
  # recombinator · cls_head · cls_head.pooling_stack · cls_head.main_head.
  freeze_after_pretrain: []
  # true = đóng băng TOÀN BỘ phần đã pretrain (cả Recombinator). Ghi đè
  # `freeze_after_pretrain`.
  freeze_pretrained: false

  target_modules: [q_proj, k_proj, v_proj, o_proj]
  include_prefixes: [language_model, model.language_model]
  exclude_prefixes: [vision_tower, multi_modal_projector, vision_model]
  lora_dropout: 0.05
  bias: none
  alpha_mode: proportional
  alpha_ratio: 2.0
  alpha_fixed: 16
  quant:
    load_in_4bit: true
    quant_type: nf4
    double_quant: true
    compute_dtype: bfloat16

# ── Chấm điểm — theo TỪNG MẪU, vì kiểm định là ghép cặp ───────────────────
metrics:
  normalize:
    lowercase: true
    collapse_whitespace: true
    strip_section_headers: false
  bleu_orders: [1, 2, 3, 4]
  rouge_types: [rouge1, rouge2, rougeL]
  bertscore:
    enabled: true
    model_type: roberta-large
    num_layers: 17
    rescale_with_baseline: false
    keep: [f1]
  primary: bertscore_f1

# ═════════════════════════════════════════════════════════════════════════════
# §2.1 — PHẦN RIÊNG (không nằm trong vân tay fixture của $1)
# ═════════════════════════════════════════════════════════════════════════════
vextractor_exp:
  # A: lấy từ thí nghiệm trước. Kéo từ Hub `<hub_root>/$<hub_index>_<hub_title>_Test`
  # (fixture + predictions + điểm, CHỈ khi tem khớp: vân tay config, sha256
  # weight, batch sinh). Weight của A không cần tải (không sinh lại).
  baseline:
    id: qlora_r32_decoder
    name: "QLoRA r=32 · full decoder ($1)"
    method: qlora
    rank: 32
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    hub_index: 1
    hub_title: LoRA
    # máy đã chạy $1: fixture + điểm cục bộ được dùng trước khi kéo Hub
    local_adapter_dir: ./adapters_lora
    local_run_dir: ./runs/lora_rank_target
  # B: y như A + V-Extractor (Stage 0 + ảnh -> Q, nối [Z ‖ Q ‖ T]).
  # true = huấn luyện lại TOÀN BỘ B: Stage 0 + main + sinh + chấm, bỏ qua mọi
  # thứ đã có (cục bộ lẫn Hub). Tương đương cờ `--retrain-all`.
  retrain_all: false
  candidate:
    id: qlora_r32_decoder_vextractor
    name: "QLoRA r=32 · full decoder + V-Extractor (Q)"

# ── Nhãn bệnh lý — CHỈ CHO LENS (csv_helper/labels.npz, `src/labels_cls.py`) ──
# Stage 0 là TỰ GIÁM SÁT và KHÔNG đọc nhãn nào. Khối này chỉ còn
# phục vụ `lens`: chọn ảnh minh hoạ (nhiều pos + uncertain nhất) và in bảng 14
# nhãn của ảnh ấy. Nó KHÔNG vào vân tay Stage 0 và KHÔNG vào loss nào cả.
labels:
  npz: csv_helper/labels.npz
  local_path: null
  # labels.npz (đã soi): y_gt (157917, 14) int · y_aug · img_rel · study_id ·
  # disease_labels (14 tên) · class_names = [positive, negative, uncertain, blank].
  # Mã trong y_gt là CHỈ SỐ của class_names — 0 = positive, 1 = negative (KHÔNG
  # phải mã CheXpert thô 1/0/-1). Cột "No Finding" chỉ có 0/3 -> 0 là dương.
  key_array: img_rel
  label_array: y_gt           # y_aug (nhãn tăng cường, có mã -1) KHÔNG dùng
  encoding:
    pos: [0]
    neg: [1]
    uncertain: [2]
    nan_to: ignore
  # blank (3) = bệnh không được nhắc tới (~62% số ô): không map lớp nào -> ô
  # one-hot TOÀN 0. Không còn ASL nào để mask nó khỏi; Lens chỉ đọc các ô có nhãn.
  blank_policy: ignore
  max_missing_frac: 0.20

# ═════════════════════════════════════════════════════════════════════════════
# NHÁNH BỔ SUNG THỊ GIÁC CHẤT LƯỢNG CAO — BA KHỐI (`src/vextractor.py`)
# ═════════════════════════════════════════════════════════════════════════════
#
#   ảnh 448² ─► 1. EXTRACTOR  ConvNeXt-Base (DINOv3), cắt sau Stage 3
#                             (B,3,448,448) -> (B,512,28,28) -> V (B,784,512)
#            ─► 2. COMPRESSOR QFormer, 32 latent @1024, N = 2 nhóm khối
#                             -> V_c (B,32,1024)
#            ─► 3. ALIGNER    RMSNorm(1024) + SwiGLU 1024→4096→2560
#                             -> Q (B,32,2560)
#
#   [Z ‖ Q ‖ T] ─► Gemma decoder (QLoRA r32) ─► CE
#
# BA khối, BA giai đoạn, mỗi giai đoạn dạy ĐÚNG MỘT khối:
#
#   Stage 0  Extractor   DINOv3 finetune (tự giám sát, DINO, EMA, multi-crop)
#   Stage 1  Compressor  chưng cất từ teacher Stage 0 ĐÓNG BĂNG
#   main     Aligner + LoRA (từ bước 0), rồi Compressor (sau 20% bước)
#
# ── 1. EXTRACTOR ─────────────────────────────────────────────────────────────
# `convnext_base.dinov3_lvd1689m` là CHECKPOINT DINOv3 THẬT của Facebook cho họ
# ConvNeXt (họ phát hành ViT-S/S+/B/L/H+/7B và ConvNeXt-T/S/B/L — KHÔNG có Swin).
# Stage 0 vì thế là ĐÚNG nghĩa "chạy tiếp": cùng họ trọng số, cùng hàm mục tiêu,
# chỉ đổi miền ảnh từ web sang CXR.
#
# `n_stages: 3` — dừng ở stride 16 / 512 kênh. Stage 4 (1024 kênh, stride 32)
# biến mất hẳn: 27,4 M tham số khỏi state_dict, khỏi VRAM, khỏi optimizer; đổi
# lại lưới mịn gấp 4× (28×28 = 784 ô thay vì 14×14 ở 448²). Mất tầng ngữ nghĩa
# cao nhất, được độ phân giải không gian mà Cross-attn và Lens dùng trực tiếp.
#
# ⚠ Ở 448² lưới là 28×28 = 784 ô, KHÔNG phải 14×14. ConvNeXt có stem stride 4
# rồi ba lần stride 2; 14×14 chỉ xảy ra ở ảnh 224² hoặc ở Stage 4. `n_patch`
# đến từ MỘT lượt forward THẬT (`vextractor.backbone_body`), không từ một công
# thức gõ tay, nên nó không thể lệch với model.
#
# ConvNeXt thuần tích chập: không pos-embed để nội suy, không cửa sổ để đệm,
# không BatchNorm nào mang thống kê chạy. MỘT state_dict chạy cả 448² (global)
# lẫn 224² (local crop của Stage 0). Và nó KHÔNG có cls token -> `stage0.dino.
# pool` bắt buộc `mean`, `cls` bị TỪ CHỐI ngay lúc dựng backbone.
#
# Chuẩn hoá ảnh KHÔNG khai ở đây: nó được hỏi từ
# `timm.get_pretrained_cfg(arch).mean/std` và đóng vào spec của mọi checkpoint.
#
# ── 2. COMPRESSOR ────────────────────────────────────────────────────────────
#   kv = RMSNorm(V)                                   512, MỘT lần, ngoài mọi nhóm
#   q  = 32 latent @768
#   N × [ khối 1:  q += SelfAttn(N(q))
#                  q += CrossAttn(N(q), kv)           <- chỗ DUY NHẤT đọc V
#                  q += SwiGLU(N(q))
#         khối 2:  q += SelfAttn(N(q))
#                  q += SwiGLU(N(q))                ]
#
# 512 -> 768 xảy ra NGAY TRONG Cross-attn (`k_proj`/`v_proj` nhận 512, trả
# 768). KHÔNG có `Linear 512→768` đứng trước: một lớp chiếu riêng thêm 0,39 M
# tham số mà không thêm sức biểu diễn nào (nó chỉ gộp được vào k/v phía sau).
#
# `head_dim` là khoá KHAI, `n_heads` được SUY RA (768 // 128 = 6). Chiều ngược
# lại — khai n_heads rồi để head_dim rơi ra — là cách head_dim đổi LẶNG LẼ mỗi
# lần ai đó sửa `d_latent`. Khai cái BẤT BIẾN, suy ra cái phụ thuộc; khai
# `n_heads` ở đây bị TỪ CHỐI ồn ào như mọi khoá lạ khác.
#
# Khối 2 KHÔNG có Cross-attn, và đó là chủ ý: nó để 32 vector thống nhất lại
# với nhau sau khi vừa đọc xong ảnh, trước khi nhóm sau lại đi đọc tiếp.
#
# Tham số ở 768 / kv 512 / hidden 1024:
#   SelfAttn 4×768² = 2,36 M · CrossAttn 2×768² + 2×512×768 = 1,97 M
#   SwiGLU 3×768×1024 = 2,36 M · 5 × RMSNorm(768) = 3 840
#   => KHỐI 1 (self+cross+ffn) 6,69 M · KHỐI 2 (self+ffn) 4,72 M
#   => MỘT nhóm 11,41 M (khớp `~11.41M (xN)` của đặc tả); N = 5 -> 57,06 M.
#
# Chi phí nằm ở `d_latent` (theo d²) và `n_blocks` (tuyến tính), KHÔNG ở
# `n_query`: 32 latent chỉ là 24 576
# tham số. Đổi `n_query` đụng tới THỜI GIAN và độ dài chuỗi decoder, không tới
# bảng tham số.
#
# ── 3. ALIGNER ───────────────────────────────────────────────────────────────
# RMSNorm(768) + MỘT khối SwiGLU 768→4096→2560 (`down(SiLU(gate(x)) ⊙ up(x))`,
# bias=False cả ba theo quy ước Gemma 3 / LLaMA, init 1/√fan_in). Không
# attention, không residual: phần "suy nghĩ" nằm trọn trong Compressor, và đây
# là chỗ DUY NHẤT nhánh đổi chiều lên không gian embedding của decoder.
#
# RMSNorm ở đầu là BẮT BUỘC, không phải trang trí: SwiGLU có CỔNG NHÂN, và một
# cổng nhân ăn đầu vào nhỏ thì BÌNH PHƯƠNG cái nhỏ ấy. Bỏ nó thì RMS(Q) ở bước
# 0 rơi xuống ~1e-4, và trên model đồ chơi của selftest nó underflow HẲN về 0
# (bản đồ saliency của Lens thành ma trận không). Giá: 1024 tham số. Vì cùng lý
# do, ba ma trận có cổng init `1/√fan_in` và `_init` PHẢI bỏ qua chúng.
#
# `mlp_hidden` 4096 > `d_latent` 768 — NỞ RA, cùng hướng với FFN của decoder
# (Gemma 3: 2560 → 10240). Muốn một nút THẮT thì đặt nó dưới 768; cả hai đều
# chạy, nhưng hỏi hai câu khác nhau.
#
# ⚠ Đặc tả ghi Aligner `~18.89M`. Đó là con số của đầu vào 1024; với `d_latent`
# = 768 (chiều thật của V_c) nó là **16,78 M**. Aligner ăn V_c NGUYÊN chiều —
# không có lớp chiếu 768→1024 nào chen vào chỉ để khớp một con số.
#
# `d_latent` 768 KHÁC `d_model` 2560: `d_model` đọc từ AutoConfig của decoder,
# `d_latent` khai ở đây, và `build_aligner` nối chúng — nên đổi base sang một
# decoder khác chiều sẽ lộ ra chứ không lặng lẽ.
vextractor:
  extractor:                # ảnh (3,448,448) -> V (784, 512)
    image_size: 448         # stem/4 rồi 3 × /2 -> stride 16; 448/16 = 28 -> 784 ô
    # timm; lần chạy đầu tải ~350 MB. ConvNeXt-Base DINOv3, cắt còn 3 stage:
    # ~60,1 M tham số (đặc tả ghi ~59,39 M — con số ĐO ĐƯỢC là 60,12 M).
    arch: convnext_base.dinov3_lvd1689m
    pretrained: true        # false bị TỪ CHỐI: "DINOv3 finetuning" từ trọng số
                            # ngẫu nhiên chỉ ra một backbone ngẫu nhiên khác
    # Lát cắt của họ PHẲNG (ViT `.blocks`). ConvNeXt KHÔNG có — phải là null,
    # khai số ở đây sẽ bị TỪ CHỐI.
    n_layers: null
    # Lát cắt của họ PHÂN CẤP (`.stages`). 3 = giữ Stage 1–3 -> 512 kênh.
    n_stages: 3
  compressor:               # QFormer: V (784, 512) -> V_c (32, 768)
    n_query: 32             # số latent = số token Q nối vào chuỗi decoder
    d_latent: 768           # KHÁC d_model (2560): Aligner mới là chỗ đổi chiều
    head_dim: 128           # n_heads SUY RA = d_latent // head_dim = 6
    mlp_hidden: 1024        # SwiGLU 768 -> 1024 -> 768 (mỗi khối)
    n_blocks: 5             # N: số lần lặp (khối 1 -> khối 2)
    dropout: 0.0            # 0: không tiêu RNG của dropout LoRA
  aligner:                  # V_c (32, 768) -> Q (32, 2560)
    mlp_hidden: 4096        # SwiGLU 768 -> 4096 -> 2560 (16,78 M)
    dropout: 0.0

  # ── Main stage: HAI nhóm, HAI lịch (`src/train_vextractor.py`) ──────────
  # Mốc khai theo TỈ LỆ tổng số bước, không theo số bước tuyệt đối: main stage
  # khoá 1 epoch = 200 bước theo $1, nhưng `--dry-run` và mọi lần đổi
  # `train_batch` đổi con số ấy. Khai "40 bước" thì với một lần chạy 4 bước,
  # Compressor không bao giờ mở.
  #
  #   Aligner     warm-up 1e-6 -> 1e-4 trong 10% bước, rồi PHẲNG.
  #               HỌC CÙNG LoRA NGAY TỪ BƯỚC 0 — mục tiêu của nó là học cách
  #               biến tín hiệu đặc trưng thị giác sang không gian ngữ nghĩa,
  #               và nó không làm được việc ấy nếu bị đóng băng lúc LoRA đang
  #               định hình.
  #
  #   Compressor  ĐÓNG BĂNG HOÀN TOÀN 20% bước đầu, rồi warm-up 1e-8 -> 1e-5
  #               trong 10% bước, rồi PHẲNG. Mục tiêu của nó ở đây KHÁC Stage 1:
  #               học cách xử lý đặc trưng đã có THEO tín hiệu từ LoRA →
  #               Aligner. Tín hiệu ấy chưa tồn tại ở bước 0 (Aligner còn ngẫu
  #               nhiên, LoRA chưa đi được đâu), nên 20% bước đầu là thời gian
  #               để nó xuất hiện. `requires_grad=False` chứ không phải lr = 0:
  #               Compressor là khối học được ĐẦU TIÊN sau Extractor, nên tắt
  #               grad ở đó cắt hẳn phần backward bên dưới Aligner.
  #
  #   Extractor   KHÔNG BAO GIỜ mở. Nó nạp trọng số TEACHER (EMA) của Stage 0 và
  #               chạy ở chế độ TEACHER INFERENCE (requires_grad=False + eval +
  #               no_grad + KHÔNG nằm trong optimizer) suốt main stage.
  #
  # LoRA của decoder vẫn chạy ĐÚNG lịch one-cycle của $1 (khối `train.schedule`).
  main:
    align_lr_min: 1.0e-6      # ĐẦU dốc warm-up của Aligner (bước 0 có ĐÚNG số này)
    align_lr_main: 1.0e-4     # lr PHẲNG sau warm-up
    align_warmup_frac: 0.10   # 10% tổng bước (= 20/200)
    align_wd: 0.01
    comp_lr_min: 1.0e-8
    comp_lr_main: 7.0e-6
    comp_freeze_frac: 0.20    # 20% tổng bước ĐÓNG BĂNG (= 40/200)
    comp_warmup_frac: 0.10    # rồi 10% tổng bước warm-up (= 20/200)
    comp_wd: 0.01
    separate_clip: true       # clip_grad_norm_ riêng LoRA / nhánh

# ── Stage 1: COMPRESSOR TRANSFER LEARNING — `src/stage1_vextractor.py` ───────
# Compressor học từ teacher của Stage 0, teacher ĐÓNG BĂNG HOÀN TOÀN và sinh
# nhãn chuẩn DINOv3:
#
#   view_t ─► Extractor(0) ─► pool ─► DINO head(0) ───────────► t_raw   [ĐỨNG YÊN]
#   view_s ─► Extractor(0) ─► Compressor ─► mean(V_c) ─► head MỚI ─► s_raw
#   loss = CE( softmax((t_raw − center)/τ_t) ‖ log_softmax(s_raw/τ_s) )
#
# Mục tiêu: LÀM GIÀU không gian Compressor TRƯỚC khi đưa vào Aligner. Ở main
# stage ba khối cùng động; nếu Compressor còn ngẫu nhiên ở bước 0 thì 200 bước
# của main stage phải vừa học nén ảnh vừa học viết báo cáo.
#
# KHÔNG có EMA ở đây. Ở Stage 0 teacher là trung bình trượt của student và cặp
# EMA + centering giữ DINO khỏi sụp; ở Stage 1 teacher là một CHECKPOINT, nên
# với một ảnh thì đích KHÔNG ĐỔI suốt giai đoạn và không có gì để sụp. Centering
# và sharpening vẫn giữ, nhưng để định HÌNH DẠNG của đích.
#
# HAI view, và đúng hai: teacher một global 448², student một global 448² KHÁC
# (augment khác). Multi-crop của Stage 0 vô nghĩa ở đây — teacher đứng yên nên
# thêm view chỉ là tính lại cùng một đích; và `patches()` đòi đúng 784 ô nên
# local crop 224² sẽ bị TỪ CHỐI ồn ào chứ không lặng lẽ chạy trên lưới 196 ô.
#
# MỌI siêu tham số DINO (τ_s/τ_t, centering, prototype, augment) mượn NGUYÊN của
# `stage0.dino` — khai lại ở đây là để hai giai đoạn chạy hai công thức khác
# nhau mà không ai thấy. Khối này chỉ khai LỊCH HỌC.
#
# HAI nhóm lr, cùng lịch chung nhưng hai CẶP số: warm-up tuyến tính trong
# `warmup_epochs` epoch rồi GIỮ `lr_max` của từng nhóm tới hết. Ma trận attention
# quyết định 32 vector ĐỌC Ở ĐÂU trên lưới 784 ô, và đó là thứ dễ hỏng nhất khi
# bị đẩy nhanh: một bước lớn làm phân phối attention sụp về vài ô rồi không quay
# lại. FFN chỉ biến đổi thứ đã đọc được, nên nó chịu được một dốc cao hơn.
# `latent` + mọi RMSNorm + DINO head mới đi theo nhóm FFN (xem
# `vextractor.Compressor.ffn_parameters`).
stage1:
  attn_lr_min: 1.0e-8
  attn_lr_max: 1.0e-5     # MỨC CHẠY của nhóm attn (không hạ theo lịch)
  ffn_lr_min: 1.0e-7
  ffn_lr_max: 1.0e-4      # MỨC CHẠY của nhóm ffn
  warmup_epochs: 1.0      # độ dài dốc warm-up (epoch), rồi GIỮ lr_max tới hết
  max_epochs: 20          # TRẦN, không phải số epoch sẽ chạy — patience quyết
  # CHẶNG 5, giống hệt Stage 0: mỗi epoch val không cải thiện thì CẢ HAI nhóm
  # (attn và ffn) chia cho số này, sàn là `lr_min` của từng nhóm. MỘT bộ đếm
  # chung cho hai nhóm, vì val là MỘT con số — không có cách nào nói nhóm nào
  # làm nó xấu đi, nên tách hai bộ đếm là bịa ra một tín hiệu không tồn tại.
  plateau_gamma: 1.5
  patience: 3             # epoch LIÊN TIẾP val không cải thiện thì dừng phần lịch
  tail_epochs: 1          # rồi chạy thêm ngần này epoch cosine về lr_min của
                          # TỪNG nhóm, RỒI MỚI lấy best val
  min_delta: 0.0
  weight_decay: 0.03
  # batch HIỆU DỤNG (của riêng Stage 1). `micro_batch` / `probe_sizes` là khoá
  # PHẦN CỨNG và nằm ở configs/gpu/<card>.yaml — khai chúng ở đây thì bị config
  # GPU đè im lặng, nên `load_config` DỪNG.
  batch_size: 32
  max_grad_norm: 1.0
  val_n_samples: 256      # val CỐ ĐỊNH (val_resample: false) -> đường val chỉ
  val_resample: false     # phụ thuộc trọng số, không phụ thuộc lần bốc mẫu

# ── Stage 0: DINOv3 FINETUNING — `src/stage0_vextractor.py`, `src/dino.py` ──
# KHÔNG nạp Gemma, KHÔNG nhãn, KHÔNG ASL, KHÔNG Cls Head. Thứ DUY NHẤT được
# huấn luyện là Extractor (ConvNeXt-Base, trọng số DINOv3), bằng chính hàm mục
# tiêu nó được sinh ra với.
#
#   student(view) ─► DINO head ─┐
#                                ├─ CE( softmax((t − center)/τ_t) ‖ log_softmax(s/τ_s) )
#   teacher = EMA(student) ─────┘   teacher CHỈ thấy 2 global; student thấy tất cả
#
# "Load lại training state của pretrain rồi finetune tiếp": checkpoint DINOv3
# công bố chỉ có TRỌNG SỐ — không optimizer, không center, không teacher EMA
# riêng. Nên ở đây nó nghĩa là nạp trọng số ấy vào CẢ student lẫn teacher, dựng
# DINO head / optimizer / center mới, rồi chạy tiếp DINO trên miền ảnh CXR.
#
# Thứ được LƯU RA base//final/ là **teacher** (EMA), không phải student: teacher
# mượt hơn, không mang nhiễu của bước Adam cuối, và chính nó là nhánh sinh mục
# tiêu trong DINO — Stage 1 và main stage vì thế chạy Extractor ở đúng chế độ
# teacher inference.
#
# LỊCH CHUNG (`src/schedule.py`) — HAI chặng, cộng một hệ số nhân:
#   1. warm-up tuyến tính 1e-8 -> 1e-5   `warmup_epochs` (1) epoch ĐẦU (200 bước)
#   2. GIỮ 1e-5                          49 EPOCH CÒN LẠI
#   5. mỗi epoch val KHÔNG cải thiện     -> lr hiện tại ÷ `plateau_gamma` (1,5),
#                                           sàn `lr_min`; val cải thiện thì
#                                           GIỮ NGUYÊN (không leo lại)
#
# `lr_max` là MỨC CHẠY, không phải một đỉnh tạm rồi hạ: không còn `lr_main`,
# không còn chặng cosine nào trong lịch chung. Thứ DUY NHẤT kéo lr xuống là
# chặng 5 — tức chính đường val, chứ không phải một lịch định trước. Một đường
# lr do val điều khiển thì không cần đoán trước lúc nào nên hạ.
#
# ⚠ `warmup_epochs` KHÔNG phải độ dài giai đoạn — đó là `max_epochs`.
#
# DỪNG SỚM và cái ĐUÔI của nó: `patience` = 3 epoch LIÊN TIẾP val không cải
# thiện thì phần theo lịch dừng — nhưng giai đoạn chưa kết thúc, nó chạy THÊM
# `tail_epochs` epoch "hạ cánh" cosine từ lr ĐANG chạy về `lr_min`, RỒI MỚI lấy
# checkpoint tốt nhất theo val. Điểm val của epoch đuôi vẫn được đem so với kỷ
# lục cũ, nên nếu nó tệ hơn thì `best` vẫn là epoch cũ và không mất gì.
#
# MỌI siêu tham số DINO dưới đây GIỮ NGUYÊN qua các lần đổi họ backbone — τ_s/
# τ_t, centering, lịch EMA, số prototype, multi-crop, weight decay, và CẢ `pool`.
# Đổi họ backbone mà đổi luôn siêu tham số thì không còn nói được hiệu số đến từ
# đâu.
stage0:
  # Ba đỉnh của lịch chung. KHAI CẢ BA: đoán một cái từ hai cái kia là đưa một
  # hằng số vào giữa một lịch mà người chạy tin là mình đã khai đủ.
  # lr_min là BA thứ cùng lúc, nên đừng đọc nó chỉ như "lr nhỏ nhất": đầu dốc
  # warm-up (bước 0 có ĐÚNG số này), SÀN của chặng 5, và ĐÁY của epoch đuôi.
  lr_min: 1.0e-8
  lr_max: 1.0e-5            # MỨC CHẠY sau warm-up (giữ tới hết)
  warmup_epochs: 1.0        # độ dài dốc warm-up (epoch). Xem chú thích trên.
  max_epochs: 50            # TRẦN thật sự của giai đoạn
  # CHẶNG 5 — "Nếu patient tăng 1, decay lr hiện tại. Nếu không thì duy
  # trì lr." Mỗi epoch val không cải thiện thì lr HIỆN TẠI bị chia cho số này,
  # kẹp sàn ở `lr_min`. Val khá lên thì lr GIỮ NGUYÊN mức đã tụt — không leo
  # lại, nên đường lr đơn điệu giảm sau epoch đầu.
  #
  # HAI bộ đếm, và chúng KHÔNG gộp được: `patience` đếm chuỗi hỏng LIÊN TIẾP và
  # reset mỗi lần val khá lên (nó quyết định lúc nào DỪNG); bộ đếm của chặng 5
  # đếm TỔNG số epoch hỏng và không bao giờ reset (nó quyết định LR). Gộp chúng
  # là để lr leo lại mỗi lần val khá lên — đúng thứ "duy trì lr" loại bỏ.
  #
  # 1,5 là một bước NHỎ, và đó là chủ ý: nó chia quãng đường tới sàn thành
  # NHIỀU nấc (1e-5 -> 1e-8 là 18 lần chia, thay vì 7 lần ở hệ số 3), nên lr hạ
  # dần theo đúng nhịp val xấu đi thay vì rơi hẳn sau vài epoch hỏng. Đổi lại,
  # một chuỗi hỏng ngắn gần như không đụng tới lr — với `patience` = 3 thì tới
  # lúc dừng lr mới chỉ còn 1/1,5³ ≈ 30% mức chạy (hệ số 3 cho 3,7%).
  #
  # 1.0 = TẮT chặng 5. Đây mới là khoá để tắt nó, KHÔNG phải `patience: 0`
  # (patience chỉ gác việc dừng sớm).
  plateau_gamma: 1.5
  weight_decay: 0.03
  # ── dừng sớm ───────────────────────────────────────────────────────────
  # Sau MỖI epoch đo val. `patience` epoch LIÊN TIẾP mà `val_score`
  # (= −loss DINO trên val cố định) không vượt kỷ lục quá `min_delta` thì DỪNG
  # phần theo lịch. 0 = tắt (chạy đủ `max_epochs`, không có đuôi).
  # ĐỒNG BỘ với stage1: cả hai giai đoạn cùng chờ 3 epoch.
  patience: 3
  tail_epochs: 1            # epoch cosine về lr_min sau khi patience hết
  min_delta: 0.0
  # Checkpoint đem sang Stage 1 = epoch TỐT NHẤT theo val. `patience` +
  # `select: last` bị TỪ CHỐI: dừng vì val hết cải thiện rồi lại lấy đúng epoch
  # cuối của cửa sổ chờ là tự phủ định chính nó.
  select: best
  # Batch hiệu dụng RIÊNG của Stage 0. LƯU Ý: multi-crop nhân số lượt forward
  # lên (2 + n_local) lần cho student, cộng 2 lượt no_grad cho teacher — mảnh
  # vật lý ở `configs/gpu/<card>.yaml` chỉ là khởi điểm, autobatch dò lại.
  # `micro_batch` / `probe_sizes` là khoá PHẦN CỨNG -> configs/gpu/<card>.yaml.
  batch_size: 32
  max_grad_norm: 1.0
  val_n_samples: 256        # 256 mẫu bốc từ hồ val 2000 (0 = cả hồ)
  val_resample: false       # CỐ ĐỊNH: mọi epoch đo trên ĐÚNG một tập. Bắt buộc
                            # khi có early-stop, và ở đây còn thêm một lý do:
                            # tăng cường ngẫu nhiên của DINO vốn đã ồn.
  # ── Hàm mục tiêu tự giám sát ───────────────────────────────────────────
  dino:
    global_size: 448        # = image_size của nhánh; teacher CHỈ thấy các view này
    global_scale: [0.4, 1.0]
    local_size: 224         # ConvNeXt nuốt cỡ này trên ĐÚNG một state_dict
                            # (thuần tích chập, không pos-embed để nội suy)
    local_scale: [0.05, 0.4]
    n_local: 6              # số local crop. 0 = tắt multi-crop
    # Số prototype. KHÔNG phải 65536 của DINO gốc: tập train ở đây 6400 ảnh, và
    # nhiều prototype hơn số ảnh chỉ làm phân phối teacher thưa hơn chứ không
    # mang thêm thông tin nào.
    out_dim: 4096
    hidden: 2048
    bottleneck: 256
    head_layers: 3
    # cls | mean. ConvNeXt KHÔNG có cls token -> `mean` (trung bình 784 ô) là
    # lựa chọn duy nhất chạy được, và `pool: cls` bị TỪ CHỐI ngay lúc dựng
    # backbone chứ không tự rơi về mean: config nói một đằng chạy một nẻo là thứ
    # không bao giờ tự lộ ra.
    pool: mean
    # τ_t PHẢI nhỏ hơn τ_s (sharpening) — đảo dấu bị TỪ CHỐI. Cùng với centering
    # đây là hai lực đẩy ngược nhau giữ DINO khỏi sụp.
    student_temp: 0.1
    teacher_temp: 0.04
    teacher_temp_start: 0.04   # ramp tuyến tính -> teacher_temp
    teacher_temp_warmup_epochs: 0.0
    center_momentum: 0.9
    momentum_start: 0.996      # EMA teacher, cosine -> momentum_end theo BƯỚC
    momentum_end: 1.0
    # Lớp prototype cuối bị giữ nguyên trong ngần này epoch đầu: nó là thứ dễ
    # sụp nhất (K vector cạnh tranh nhau ngay từ bước 1).
    freeze_last_layer_epochs: 1.0
    aug:
      ratio: [0.75, 1.3333]
      # 0.0 = TẮT lật ngang. Ảnh CXR có chiều: tim nằm bên trái, và dextrocardia
      # là một chẩn đoán chứ không phải một augmentation. Bật nó là dạy encoder
      # rằng trái/phải không quan trọng — đúng thứ báo cáo cần phân biệt.
      hflip: 0.0
      jitter_p: 0.8
      brightness: 0.3       # CXR là ảnh xám: chỉ sáng/tương phản có nghĩa
      contrast: 0.3
      blur_p: 0.5
      blur_sigma: [0.1, 2.0]
      solarize_p: 0.0
      solarize_thr: 128

# ── Kiểm định: A vs B, ghép cặp theo ảnh (`src/stats_ab.compare_all`) ──────
#   d_i = điểm(B, ảnh i) − điểm(A, ảnh i)
#   bootstrap ghép cặp (BCa, n_boot) -> CI95 + p_boot;  permutation đảo dấu
#   (n_perm) -> p_perm;  Holm RIÊNG từng họ trên các metric.
#   "Thắng" = cả hai bác H0 sau Holm VÀ |Cohen dz| >= dz_floor.
stats:
  method: paired
  alpha: 0.05
  n_boot: 10000
  n_perm: 10000
  ci_method: bca
  dz_floor: 0.10
  metrics: [bleu1, bleu2, bleu3, bleu4, rouge1, rouge2, rougeL, bertscore_f1]

# ── Đồ thị A vs B (`src/report_plots_ab.py`) — như $1 nhưng 2 candidate, bar NGANG ─
report:
  ab_plot:
    metrics: [bleu3, bleu4, rougeL, bertscore_f1]   # B3 · B4 · RL · BertF1
    gamma: auto               # xếp tầng: gốc × e^(γ−1); off = không scale
    gamma_spread: 0.18

# ── Lens (`src/lens_vextractor.py`, lệnh `lens`) — MỔ KHỐI Q, minh hoạ ─────────
# Mọi bản đồ là đạo hàm của MỘT số y (log-prob báo cáo tham chiếu), nên chỉ tốn
# một lượt backward. CHỈ chạy candidate B: Z của B giống A từng bit, nên chênh
# lệch A/B nằm trọn trong khối Q — Q chính là "B − A", không phải chạy A để trừ.
# Ghi ra runs/<subdir>/Lens/Lens_Explain.md.
lens:
  enabled: true
  sample: auto              # auto = ảnh test nhiều pos + uncertain nhất; hoặc key cụ thể
  target: ref_logprob       # ref_logprob | next_token
  top_k: 8                  # logit lens: số token mỗi lớp
  layer_frac: 0.25          # CHỈ cho bảng top-k của logit lens (1/4 lớp cuối).
                            # Heatmap token × lớp vẽ ĐỦ mọi lớp.
  layer_marks: 6            # số lớp mốc in trong bảng (đầy đủ ở logit_lens.csv)
  overlay_alpha: 0.70       # độ mờ của heatmap chồng lên ảnh gốc (alpha = 0.70 × giá trị
                            # điểm, nên chỗ yếu vẫn gần trong suốt)
  percentile_clip: 99.0     # cắt đuôi trước khi chuẩn hoá màu
  cmap: inferno
  dir: Lens

wandb:
  enabled: true
  project: rgexp-vextractor
  entity: null
  run_name: null
  group: "vextractor-q"
  resume_same_run: false
  mode: online
  tags: [vextractor, resnet50, qlora, r32, mimic-cxr]
  notes: ""
  log_every: 20
  log_samples: 20

output:
