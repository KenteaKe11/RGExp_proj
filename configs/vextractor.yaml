# ═════════════════════════════════════════════════════════════════════════════
# §2.2 V-EXTRACTOR — [Z ‖ T] vs [Z ‖ Q ‖ T] — CONFIG NỘI DUNG
# ═════════════════════════════════════════════════════════════════════════════
# Câu hỏi: trên ĐÚNG candidate `qlora_r32_decoder` của $1 (Gemma 3 4B NF4 +
# cùng loader, cùng 3000 ảnh test), NỐI thêm 8 learner vector Q ngay sau 256
# token ảnh có đổi chất lượng báo cáo không?
#
#   A  qlora_r32_decoder           — LẤY TỪ $1 (weight + predictions + điểm có
#                                    tem khớp), KHÔNG huấn luyện lại.
#   B  qlora_r32_decoder_vextractor  — Stage 0 (backbone DINOv3 ViT-S/16 học TỰ GIÁM SÁT
#                                    bằng DINO, KHÔNG nhãn; checkpoint đem đi là
#                                    bản TEACHER/EMA) -> main stage y hệt A +
#                                    nhánh V-Extractor (backbone teacher infer).
#
# Biến DUY NHẤT giữa A và B là chuỗi vào decoder: [Z ‖ text] vs [Z ‖ Q ‖ text],
# với Q = V_c = CnA(Extractor(ảnh 448²)) — 8 vector MỚI; Z (256 token
# ảnh) KHÔNG bị đụng vào. 16 vị trí thêm có nhãn −100 nên số token vào CE không đổi. KHÔNG có lớp khởi
# tạo 0. Stage 0 chỉ dạy ENCODER (tự giám sát, không nhãn), còn CnA là của
# main stage — nên Q ở bước 0 là ngẫu nhiên, và thứ mang sẵn
# thông tin là các đặc trưng thị giác nó đọc. Kiểm định: bootstrap ghép cặp (BCa) + permutation đảo dấu,
# Holm trên các metric (`src/stats_ab.py`).
#
# KHÁC §2.0 (`_archive/zrecomb/`, Recombiner Test): ở đó có khối Recomb chiếu X
# lên 2560 rồi Z bị THAY bằng Z' = Z + Retriever(Z, R), chuỗi không dài thêm. Ở
# đây nhánh có encoder RIÊNG (DINOv3 ViT-S/16 ăn ảnh 448²) — và chuỗi dài
# thêm 16.
#
# Mọi khoá quyết định KẾT QUẢ của A (seed, data, image_policy, base, prompt,
# generate, train, metrics) được chép NGUYÊN VĂN từ configs/lora.yaml của $1
# (_archive/v2/configs/lora.yaml) — vân tay fixture của file này PHẢI trùng $1
# (selftest kiểm), nếu không thì B không đứng cùng bảng với A được.
# Phần riêng của §2.2 nằm ở các khối `labels`, `stage0`, `vextractor`, `vextractor_exp`.
#
#   bash scripts/run_vextractor.sh train    # kéo A từ $1 -> Stage 0 -> main -> sinh -> chấm
#   bash scripts/run_vextractor.sh stats    # bootstrap + permutation -> REPORT.md (GHI ĐÈ)
#   bash scripts/run_vextractor.sh push     # -> current/$2.2_V-Extractor_Test/
# ═════════════════════════════════════════════════════════════════════════════

seed: 42

experiment: "vextractor"

# ── Dữ liệu — điều kiện 2 ──────────────────────────────────────────────────
# Khoá cứng. Ba candidate đọc CÙNG hai file split; `assert_no_leak` là hàng
# rào cơ học chứ không phải một lời hứa trong README.
data:
  repo: RGExp123/MIMIC_CXR_cleaned
  repo_type: dataset
  split_csv: split_ref/test_split.csv
  meta_csv: csv_helper/clean_dataset.csv
  image_zip: img_dir.zip
  key_column: img_rel
  ref_column: text_gt
  n_test: 3000
  cache_dir: ./data
  image_max_side: 512
  image_max_side_enforce: true
  zip_mode: auto
  zip_stream_min_rate: 1.0
  train_split_csv: split_ref/train_split.csv
  n_train: 6400
  val_split_csv: split_ref/val_split.csv
  # HỒ val: 2000 mẫu được tải về và giữ trong cache. Mỗi lần eval bốc RANDOM
  # `train.eval.n_samples` (256) trong hồ này — xem khối `train.eval`.
  n_val: 2000
  assert_no_leak: true

# ── Chính sách ảnh — điều kiện 4 ───────────────────────────────────────────
# R2Gen (ResNet-101) và AdaAtt (ResNet-152) đều quen 224; Gemma 3 xử lý ở 896.
# Ba con số khác nhau, và đó KHÔNG phải lý do để mỗi model tự resize theo cách
# của nó: nếu R2Gen dùng RandomCrop còn Gemma dùng bilinear-longest-side thì
# một phần chênh lệch trong bảng là chênh lệch của hai bộ tiền xử lý, không
# phải của hai kiến trúc.
#
# Nên: MỘT lần resize dùng chung, ở `resize_to`, trước khi bất kỳ processor
# riêng nào chạm vào ảnh. `allow_native_match: false` nghĩa là ngay cả khi một
# model đòi đúng `resize_to` thì ảnh vẫn đi qua đường chung ấy — "vô tình
# khớp" không được phép biến thành một đường tiền xử lý thứ hai.
image_policy:
  unified: true
  resize_to: 512              # cạnh dài; khớp `data.image_max_side`
  interpolation: bicubic
  keep_aspect: true
  pad_to_square: true
  pad_fill: 0
  allow_native_match: false
  # Sau bước chung, mỗi model chỉ còn được phép chuẩn hoá giá trị pixel theo
  # thống kê của backbone nó (ImageNet mean/std cho ResNet, SigLIP cho Gemma).
  # Đó là phép biến đổi trên GIÁ TRỊ, không phải trên HÌNH HỌC.
  per_model_normalize_only: true

# ══════════════════════════════════════════════════════════════════════════
# CANDIDATE C — MY GEMMA
# ══════════════════════════════════════════════════════════════════════════
base:
  hf_id: google/gemma-3-4b-it
  runner: gemma3_vextractor
  dtype: bfloat16
  attn_implementation_train: eager
  attn_implementation_infer: sdpa
  disable_compile: auto
  device_map_train: single
  device_map_infer: auto
  image:
    do_pan_and_scan: false
    processor_size: 896

prompt:
  system: "You are an experienced radiologist reading a chest X-ray."
  user: |
    Write the radiology report for this chest X-ray.
    Answer in exactly this format, with no preamble and no extra sections:
    Findings: <the radiological findings>
    Impression: <the overall impression>

# ── Giải mã — MỘT đặc tả cho CẢ BA candidate (`src/decoding_spec.py`) ─────
# My Gemma đưa khối này cho `transformers.generate`; R2Gen/AdaAtt đưa nó cho
# `src/sota/decoding.beam_search`, vốn cài lại ĐÚNG luật beam search của
# transformers — kể cả lúc chọn checkpoint trên val. Khối `sota.*.decoding`
# bên dưới chỉ còn là bản ghi của paper (điều kiện 1) và KHÔNG được đọc; chỗ
# lệch (block_trigrams của R2Gen) vào `manifest.deviations`.
#
# Mọi khoá phải khai TƯỜNG MINH: generation_config.json của Gemma 3 khai
# sampling, và một khoá bỏ trống là để nó chen vào.
#
# Khác biệt duy nhất: độ dài tối đa. `max_new_tokens` là của My Gemma
# (subword); R2Gen/AdaAtt dừng ở `max_seq_length − 1` = 59 từ của từ điển.
#
# Với MoE, trọng số định tuyến của mỗi ảnh được nhân bản theo beam
# (`moe.RoutingContext.set(..., repeat=num_beams)`). Beam nhân số chuỗi trong
# một lượt sinh lên 3 lần: hết VRAM thì hạ `base.batch_size`.
generate:
  max_new_tokens: 256
  do_sample: false
  num_beams: 3
  length_penalty: 1.0          # điểm = tổng log-prob / (số token sinh)^1
  early_stopping: false        # heuristic dừng của transformers
  no_repeat_ngram_size: 0      # không chặn n-gram
  repetition_penalty: 1.0      # không phạt lặp
  num_return_sequences: 1

# ═════════════════════════════════════════════════════════════════════════════
# LỊCH MAIN STAGE — CHÉP NGUYÊN VĂN TỪ $1 (khoá của fixture). Candidate B dùng
# ĐÚNG khối này cho LoRA: 1 epoch, eff_bs 32, one-cycle đỉnh 1e-4, wd 0.01,
# val 256 mẫu mỗi 25 bước. Các khoá `ft_lr`, `freeze_*`, `branch_weight_decay`,
# `pretrained_lr_mult` là của §2.x cũ — $2 KHÔNG đọc chúng (lr của nhánh ở
# `vextractor.main`), chúng ở lại chỉ để khối này trùng $1 từng chữ.
# ═════════════════════════════════════════════════════════════════════════════
train:
  n_epochs: 1   # decoder_ft: 1 epoch
  # Batch HIỆU DỤNG của decoder_ft. Số mẫu mỗi lượt ở configs/gpu/<card>.yaml;
  # grad_accum = 32 / per_device_batch_size (phải chia hết).
  effective_batch: 32
  max_seq_len: 1024
  weight_decay: 0.01
  max_grad_norm: 1.0
  logging_steps: 10
  # Ghi trọng số ra đĩa mỗi bao nhiêu bước. 0 = tắt (chỉ ghi 1 lần ở cuối).
  # Mốc này tồn tại vì một lần chết CUDA ở bước cuối đã xoá sạch 3 giờ.
  save_every_steps: 25

  # ── Đo trên val — CHỈ để nhìn, KHÔNG chạm vào trọng số ──────────────────
  # Mỗi `every_steps` bước (và ở bước cuối), bốc NGẪU NHIÊN `n_samples` = 256
  # trong `data.n_val` = 2000 mẫu val rồi tính CE trên đó. Không chọn
  # checkpoint theo val, không early stop: mọi candidate vẫn chạy ĐÚNG một
  # epoch với cùng lịch one-cycle như README chốt — val chỉ trả lời "candidate
  # này có bắt đầu học thuộc tập train chưa".
  #
  # `resample: true` = bốc lại mỗi lần eval ("mỗi lần"), nên đường val hơi
  # nhiễu: mỗi điểm đo trên một tập 256 khác nhau. Bù lại nó phủ hết 2000 mẫu
  # sau vài lần đo thay vì nhìn mãi một góc.
  #
  # Tập 256 ấy KHÔNG phụ thuộc candidate: chỉ số được sinh từ (seed, số thứ tự
  # lần eval) chứ không từ arm id, nên ở lần eval thứ k mọi candidate đo
  # trên ĐÚNG cùng 256 mẫu và các đường val so được với nhau. Cũng vì thế nó
  # tái lập được: chạy lại cùng seed cho đúng những tập ấy (`seed_mix` đổi số
  # này nếu muốn một loạt tập khác).
  eval:
    enabled: true
    n_samples: 256
    every_steps: 25
    resample: true
    seed_mix: 0
  # MỘT chu kỳ one-cycle cho TOÀN BỘ main-stage (1 epoch, không restart —
  # KHÔNG khai `cycle_steps`/`lr_decay` ở đây), để mọi nhóm cùng hạ về đáy ở
  # bước cuối. Mọi nhóm dùng cùng div 30 · final_div 33.3 (đỉnh/đáy ≈ 1000),
  # rồi đầu warm-up và đáy được LÀM TRÒN XUỐNG còn 1 chữ số có nghĩa
  # (`round_down_sig: 1`):
  #
  #     nhóm                                    đầu      đỉnh      đáy
  #     cls_head · route_head · dec_proj · FFN  1e-5  -> 3e-4   -> 3e-7
  #     recombinator_retriever_3 (i = n)        1e-5  -> 3e-4   -> 3e-7
  #     recombinator_retriever_2                1e-6  -> 5.48e-5 -> 5e-8
  #     adapter (LoRA/Experts)                  3e-6  -> 1e-4   -> 1e-7
  #     recombinator_retriever_1 (+ Query)      3e-7  -> 1e-5   -> 1e-8  <- đáy nhỏ nhất
  #
  # `min_lr` là con số ĐƯỢC KIỂM (`train_recomb.ft_lrs` DỪNG nếu lệch), không
  # phải con số được đọc.
  schedule:
    impl: lambda
    max_lr: 1.0e-4          # adapter / Experts (LoRA)
    min_lr: 1.0e-8          # = đáy (đã làm tròn) của nhóm nhỏ nhất (Retriever 1)
    round_down_sig: 1       # làm tròn XUỐNG đầu warm-up + đáy; 0 = tắt
    pct_start: 0.1
    div_factor: 30.0
    final_div_factor: 33.3  # 1e-5 / 30 / 33.3 = 1.001e-8 -> làm tròn 1e-8
    anneal: cos
    cycle_momentum: false
  branch_weight_decay: 0.01

  # ĐIỀU KIỆN 5 — CHỈ cho R2Gen/AdaAtt (`src/train_sota.py`): phần đã pretrain
  # chạy main-stage ở lr × 0.1. My Gemma KHÔNG đọc khoá này nữa.
  pretrained_lr_mult: 0.1
  # My Gemma · decoder_ft — lịch lr ĐƠN GIẢN (`train_recomb.ft_lrs`):
  #   1. lr_max toàn hệ = `max_lr` (3e-4): Sup Head, Route Head, Concat Linear,
  #      FFN của Recombinator và Retriever n. LoRA/Experts ở `schedule.max_lr`.
  #   2. lr_max CHỈ đổi theo Retriever i = 1..n, tăng dần theo cấp số nhân:
  #      i=1 = `retriever_first` (1e-5, kèm Learnable Query), i=n = `max_lr`.
  #      n = 3: 1e-5 · 5.48e-5 · 3e-4. Không có hệ số Attn ở decoder_ft.
  # Phải khai ĐÚNG hai khoá.
  ft_lr:
    max_lr: 3.0e-4               # lr_max toàn hệ
    retriever_first: 1.0e-5      # Retriever 1 (+ Learnable Query)
  # KHÔNG đóng băng gì — decoder_ft fine-tune toàn bộ. Khoá còn giữ để đối
  # chứng khi cần (requires_grad=False + eval mode + ngoài optimizer). Nhận:
  # recombinator · cls_head · cls_head.pooling_stack · cls_head.main_head.
  freeze_after_pretrain: []
  # true = đóng băng TOÀN BỘ phần đã pretrain (cả Recombinator). Ghi đè
  # `freeze_after_pretrain`.
  freeze_pretrained: false

  target_modules: [q_proj, k_proj, v_proj, o_proj]
  include_prefixes: [language_model, model.language_model]
  exclude_prefixes: [vision_tower, multi_modal_projector, vision_model]
  lora_dropout: 0.05
  bias: none
  alpha_mode: proportional
  alpha_ratio: 2.0
  alpha_fixed: 16
  quant:
    load_in_4bit: true
    quant_type: nf4
    double_quant: true
    compute_dtype: bfloat16

# ── Chấm điểm — theo TỪNG MẪU, vì kiểm định là ghép cặp ───────────────────
metrics:
  normalize:
    lowercase: true
    collapse_whitespace: true
    strip_section_headers: false
  bleu_orders: [1, 2, 3, 4]
  rouge_types: [rouge1, rouge2, rougeL]
  bertscore:
    enabled: true
    model_type: roberta-large
    num_layers: 17
    rescale_with_baseline: false
    keep: [f1]
  primary: bertscore_f1

# ═════════════════════════════════════════════════════════════════════════════
# §2.1 — PHẦN RIÊNG (không nằm trong vân tay fixture của $1)
# ═════════════════════════════════════════════════════════════════════════════
vextractor_exp:
  # A: lấy từ thí nghiệm trước. Kéo từ Hub `<hub_root>/$<hub_index>_<hub_title>_Test`
  # (fixture + predictions + điểm, CHỈ khi tem khớp: vân tay config, sha256
  # weight, batch sinh). Weight của A không cần tải (không sinh lại).
  baseline:
    id: qlora_r32_decoder
    name: "QLoRA r=32 · full decoder ($1)"
    method: qlora
    rank: 32
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    hub_index: 1
    hub_title: LoRA
    # máy đã chạy $1: fixture + điểm cục bộ được dùng trước khi kéo Hub
    local_adapter_dir: ./adapters_lora
    local_run_dir: ./runs/lora_rank_target
  # B: y như A + V-Extractor (Stage 0 + ảnh -> Q, nối [Z ‖ Q ‖ T]).
  # true = huấn luyện lại TOÀN BỘ B: Stage 0 + main + sinh + chấm, bỏ qua mọi
  # thứ đã có (cục bộ lẫn Hub). Tương đương cờ `--retrain-all`.
  retrain_all: false
  candidate:
    id: qlora_r32_decoder_vextractor
    name: "QLoRA r=32 · full decoder + V-Extractor SNOP-MHA (Q)"

# ── Nhãn bệnh lý — CHỈ CHO LENS (csv_helper/labels.npz, `src/labels_cls.py`) ──
# Stage 0 là TỰ GIÁM SÁT và KHÔNG đọc nhãn nào. Khối này chỉ còn
# phục vụ `lens`: chọn ảnh minh hoạ (nhiều pos + uncertain nhất) và in bảng 14
# nhãn của ảnh ấy. Nó KHÔNG vào vân tay Stage 0 và KHÔNG vào loss nào cả.
labels:
  npz: csv_helper/labels.npz
  local_path: null
  # labels.npz (đã soi): y_gt (157917, 14) int · y_aug · img_rel · study_id ·
  # disease_labels (14 tên) · class_names = [positive, negative, uncertain, blank].
  # Mã trong y_gt là CHỈ SỐ của class_names — 0 = positive, 1 = negative (KHÔNG
  # phải mã CheXpert thô 1/0/-1). Cột "No Finding" chỉ có 0/3 -> 0 là dương.
  key_array: img_rel
  label_array: y_gt           # y_aug (nhãn tăng cường, có mã -1) KHÔNG dùng
  encoding:
    pos: [0]
    neg: [1]
    uncertain: [2]
    nan_to: ignore
  # blank (3) = bệnh không được nhắc tới (~62% số ô): không map lớp nào -> ô
  # one-hot TOÀN 0. Không còn ASL nào để mask nó khỏi; Lens chỉ đọc các ô có nhãn.
  blank_policy: ignore
  max_missing_frac: 0.20

# ═════════════════════════════════════════════════════════════════════════════
# NHÁNH BỔ SUNG THỊ GIÁC CHẤT LƯỢNG CAO — HAI KHỐI (`src/vextractor.py`)
# ═════════════════════════════════════════════════════════════════════════════
#
#   ảnh 448² ─► Extractor DINOv3 ViT-S/16 ─► V = concat 3 block cuối (784, 1152)
#            ─► CnA (QFormer @1536) ─► V_c (8, 2560)
#
# Stage 0: DINOv3 fine-tuning của Extractor. Main stage: CnA + LoRA học cùng nhau.
# (Không còn Stage 1 — bản Stage 1 cũ nằm ở `_archive/stage1_compressor/`.)
vextractor:
  extractor:                # DINOv3 ViT-S/16: (B,3,448,448) -> V (B,784,1152)  (~21,59 M)
    image_size: 448
    arch: vit_small_patch16_dinov3.lvd1689m   # dinov3-vits16-pretrain (timm >= 1.0.20)
    pretrained: true
    n_layers: null
    n_stages: null          # ViT: cả 12 block, patch 16: 448² -> 28×28 = 784 token (+5 prefix bị cắt)
    # V = concat theo KÊNH của 3 block CUỐI (10, 11, 12), mỗi block qua norm cuối
    # của ViT, bỏ prefix: 384 × 3 = 1152. KHÔNG đổi backbone/Stage 0 — checkpoint
    # Stage 0 (đã có trên Hub) vẫn dùng được; chỉ cách đọc backbone đổi.
    out_layers: 3
  cna:                      # Compressor & Aligner — QFormer: V (784, 1152) -W_k,v-> 1536 -> V_c (8, 2560)
    n_query: 8              # số latent = số token nối vào chuỗi decoder (8 learner bù 64 token Z bị che)
    d_latent: 1536          # k/v của Cross-attn chiếu 1152→1536
    head_dim: 128           # n_heads SUY RA = 1536 // 128 = 12
    mlp_hidden: 2048        # SwiGLU mult = 2 theo quy ước 2/3 (LLaMA): 2/3 · 2 · 1536 = 2048
    n_blocks: 1             # All_Block = (1st → 2nd) một lần
    final_proj: true        # RMSNorm + Linear 1536 -> 2560 (d_model của Gemma 3 4B)
    dropout: 0.0            # 0: không tiêu RNG của dropout LoRA
    # ── §2.2.2 SNOP-MHA (Soft Non-Orthogonality Penalty) ─────────────────────
    # MỌI attention của CnA (SelfAttn khối 1, CrossAttn, SelfAttn khối 2), N = 8 query:
    #   O       = Concat(A_h V_h)                      (N, H·d_v)
    #   S       = Norm(O)·Norm(O)ᵀ                     cos, Norm = chuẩn hoá L2 theo hàng
    #   Õ       = stop_grad(sign(S) ⊙ S) = |S|          |cos|, KHÔNG nhận gradient
    #   c       = ε + (1 − ε)·σ(α)                     α ∈ ℝ^N, một logit mỗi token
    #   O_final = [I − (c·1ᵀ)/(2 ln N + 1) ⊙ (Õ ⊙ M_cross)]·O  -> chiếu o.  M_cross = 1 − I
    # α: mỗi lớp một VECTOR ℝ^8, thuộc nhóm lr `ffn` (1e-7 -> 1e-4).
    # `mha` = MHA thuần (§2.2). Không có loss phụ nào (không Entropy/Orthogonal).
    attn: snop
    # c₀ = 0.15 + 0.85·σ(0) = 0.575. Khi 8 hàng O song song (attention gần đều —
    # đúng trạng thái bước 0) phần chung của hàng i bị nhân
    # 1 − c_i·7/(2 ln 8 + 1) = 1 − 1.357·c_i ≈ 0.220 (còn dương).
    # Ngưỡng đảo dấu: c_i > 0.737 (α_i > 0.803). c ∈ [0.15, 1) -> thừa số ∈ (−0.36, 0.80].
    snop_alpha_init: 0.0
    snop_eps: 0.15          # lực phạt TỐI THIỂU: c ∈ [ε, 1)

  # ── Main stage: MỘT khối học được, BA nhóm lr (`src/train_vextractor.py`) ──
  # CnA khởi tạo ngẫu nhiên và HỌC CÙNG LoRA NGAY TỪ BƯỚC 0. Warm-up tuyến tính
  # `cna_warmup_frac` (10%) tổng bước rồi PHẲNG; cùng MỘT dốc cho cả ba nhóm:
  #     ffn   (SwiGLU + Linear cuối + RMSNorm + latent + α SNOP)  1e-7 -> 1e-4
  #     self  (4 chiếu của mọi SelfAttn)                 1e-8 -> 1e-5
  #     cross (4 chiếu của Cross-attn)                   4e-8 -> 4e-5
  # Ba nhóm là một PHÂN HOẠCH của CnA; `train` DỪNG nếu không.
  #
  # Extractor nạp TEACHER (EMA) của Stage 0 và chạy TEACHER INFERENCE
  # (requires_grad=False + eval + no_grad + KHÔNG nằm trong optimizer).
  # Những module khác freeze hoàn toàn. LoRA chạy ĐÚNG lịch one-cycle của $1.
  #
  # MASK REGULARIZATION: mỗi lần cập nhật trọng số (mỗi optimizer step) che
  # ngẫu nhiên `z_mask_frac` token Z (attention_mask = 0 tại đó) để ép Q phải
  # tham gia sâu vào quá trình sinh text. MỘT mặt nạ cho cả step (mọi micro-batch
  # trong grad_accum dùng chung), tái lập từ (seed, step). Chỉ ở train — val CE,
  # sinh và Lens thấy đủ Z. 0 = tắt.
  main:
    cna_ffn_lr_min: 1.0e-7      # ĐẦU dốc warm-up (bước 0 có ĐÚNG số này)
    cna_ffn_lr_main: 1.0e-4     # lr PHẲNG sau warm-up
    cna_self_lr_min: 1.0e-8
    cna_self_lr_main: 1.0e-5
    cna_cross_lr_min: 4.0e-8
    cna_cross_lr_main: 4.0e-5
    cna_warmup_frac: 0.10       # 10% tổng bước, dùng cho CẢ ba nhóm
    cna_wd: 0.01
    z_mask_frac: 0.25           # che 25% token Z (64/256) mỗi weight update — 8 learner bù
    separate_clip: true         # clip_grad_norm_ riêng LoRA / nhánh

# ── Stage 0: DINOv3 FINETUNING — `src/stage0_vextractor.py`, `src/dino.py` ──
# Chỉ fine-tune Extractor (DINOv3 ViT-S/16) trên ảnh MIMIC-CXR bằng loss tự giám sát.
# `pretrained: true` nạp trọng số backbone; DINO head, optimizer và center tạo mới.
# Student xem global + local crops; teacher EMA chỉ xem hai global crops.
# Checkpoint lưu ra là teacher EMA được chọn theo validation.
# LỊCH CHUNG (`src/schedule.py`) — HAI chặng, cộng một hệ số nhân:
#   1. warm-up tuyến tính 1e-7 -> 1e-5   `warmup_epochs` (1) epoch ĐẦU (200 bước)
#   2. GIỮ 1e-5                          phần còn lại (trần 50 epoch)
#   5. mỗi epoch val KHÔNG cải thiện     -> lr hiện tại ÷ `plateau_gamma` (1,25),
#                                           sàn `lr_min`; val cải thiện thì
#                                           GIỮ NGUYÊN (không leo lại)
#
# `lr_max` là MỨC CHẠY, không phải một đỉnh tạm rồi hạ: không còn `lr_main`,
# không còn chặng cosine nào trong lịch chung. Thứ DUY NHẤT kéo lr xuống là
# chặng 5 — tức chính đường val, chứ không phải một lịch định trước. Một đường
# lr do val điều khiển thì không cần đoán trước lúc nào nên hạ.
#
# ⚠ `warmup_epochs` KHÔNG phải độ dài giai đoạn — đó là `max_epochs`.
#
# DỪNG SỚM và cái ĐUÔI của nó: `patience` = 4 epoch LIÊN TIẾP val không cải
# thiện thì phần theo lịch dừng — nhưng giai đoạn chưa kết thúc, nó chạy THÊM
# `tail_epochs` epoch "hạ cánh" cosine từ lr ĐANG chạy về `lr_min`, RỒI MỚI lấy
# checkpoint tốt nhất theo val. Điểm val của epoch đuôi vẫn được đem so với kỷ
# lục cũ, nên nếu nó tệ hơn thì `best` vẫn là epoch cũ và không mất gì.
#
# MỌI siêu tham số DINO dưới đây GIỮ NGUYÊN qua các lần đổi họ backbone — τ_s/
# τ_t, centering, lịch EMA, số prototype, multi-crop, weight decay, và CẢ `pool`.
# Đổi họ backbone mà đổi luôn siêu tham số thì không còn nói được hiệu số đến từ
# đâu.
stage0:
  # Ba đỉnh của lịch chung. KHAI CẢ BA: đoán một cái từ hai cái kia là đưa một
  # hằng số vào giữa một lịch mà người chạy tin là mình đã khai đủ.
  # lr_min là BA thứ cùng lúc, nên đừng đọc nó chỉ như "lr nhỏ nhất": đầu dốc
  # warm-up (bước 0 có ĐÚNG số này), SÀN của chặng 5, và ĐÁY của epoch đuôi.
  lr_min: 1.0e-7
  lr_max: 1.0e-5            # MỨC CHẠY sau warm-up (giữ tới hết)
  warmup_epochs: 1.0        # độ dài dốc warm-up (epoch). Xem chú thích trên.
  max_epochs: 50            # TRẦN thật sự của giai đoạn
  # CHẶNG 5 — "Nếu patient tăng 1, decay lr hiện tại. Nếu không thì duy
  # trì lr." Mỗi epoch val không cải thiện thì lr HIỆN TẠI bị chia cho số này,
  # kẹp sàn ở `lr_min`. Val khá lên thì lr GIỮ NGUYÊN mức đã tụt — không leo
  # lại, nên đường lr đơn điệu giảm sau epoch đầu.
  #
  # HAI bộ đếm, và chúng KHÔNG gộp được: `patience` đếm chuỗi hỏng LIÊN TIẾP và
  # reset mỗi lần val khá lên (nó quyết định lúc nào DỪNG); bộ đếm của chặng 5
  # đếm TỔNG số epoch hỏng và không bao giờ reset (nó quyết định LR). Gộp chúng
  # là để lr leo lại mỗi lần val khá lên — đúng thứ "duy trì lr" loại bỏ.
  #
  # 1,25 là một bước NHỎ, và đó là chủ ý: nó chia quãng đường tới sàn thành
  # NHIỀU nấc (1e-5 -> 1e-7 là ~21 lần chia), nên lr hạ dần theo đúng nhịp val
  # xấu đi thay vì rơi hẳn sau vài epoch hỏng. Với `patience` = 4 thì tới lúc
  # dừng lr còn 1/1,25⁴ ≈ 41% mức chạy, rồi epoch đuôi cosine về `lr_min`.
  #
  # 1.0 = TẮT chặng 5. Đây mới là khoá để tắt nó, KHÔNG phải `patience: 0`
  # (patience chỉ gác việc dừng sớm).
  plateau_gamma: 1.25
  weight_decay: 0.03
  # ── dừng sớm ───────────────────────────────────────────────────────────
  # Sau MỖI epoch đo val. `patience` epoch LIÊN TIẾP mà `val_score`
  # (= −loss DINO trên val cố định) không vượt kỷ lục quá `min_delta` thì DỪNG
  # phần theo lịch. 0 = tắt (chạy đủ `max_epochs`, không có đuôi).
  patience: 4
  tail_epochs: 1            # epoch cosine về lr_min sau khi patience hết
  min_delta: 0.0
  # Checkpoint đem sang main stage = epoch TỐT NHẤT theo val. `patience` +
  # `select: last` bị TỪ CHỐI: dừng vì val hết cải thiện rồi lại lấy đúng epoch
  # cuối của cửa sổ chờ là tự phủ định chính nó.
  select: best
  # Batch hiệu dụng RIÊNG của Stage 0. LƯU Ý: multi-crop nhân số lượt forward
  # lên (2 + n_local) lần cho student, cộng 2 lượt no_grad cho teacher — mảnh
  # vật lý ở `configs/gpu/<card>.yaml` chỉ là khởi điểm, autobatch dò lại.
  # `micro_batch` / `probe_sizes` là khoá PHẦN CỨNG -> configs/gpu/<card>.yaml.
  batch_size: 32
  max_grad_norm: 1.0
  val_n_samples: 256        # 256 mẫu bốc từ hồ val 2000 (0 = cả hồ)
  val_resample: false       # CỐ ĐỊNH: mọi epoch đo trên ĐÚNG một tập. Bắt buộc
                            # khi có early-stop, và ở đây còn thêm một lý do:
                            # tăng cường ngẫu nhiên của DINO vốn đã ồn.
  # ── Hàm mục tiêu tự giám sát ───────────────────────────────────────────
  dino:
    global_size: 448        # = image_size của nhánh; teacher CHỈ thấy các view này
    global_scale: [0.4, 1.0]
    local_size: 224         # ViT-S/16 (RoPE) chạy cỡ này trên ĐÚNG một state_dict
                            # (lưới 14×14 patch)
    local_scale: [0.05, 0.4]
    n_local: 6              # số local crop. 0 = tắt multi-crop
    # nhiều prototype hơn số ảnh chỉ làm phân phối teacher thưa hơn chứ không
    # mang thêm thông tin nào.
    out_dim: 4096
    hidden: 2048
    bottleneck: 256
    head_layers: 3
    # cls | mean. DINOv3 ViT có cls token -> `cls` (đúng vector DINO chưng cất).
    # Họ lưới (ConvNeXt/MaxViT) KHÔNG có cls token -> `mean` (trung bình lưới) là
    # lựa chọn duy nhất chạy được, và `pool: cls` bị TỪ CHỐI ngay lúc dựng
    # backbone chứ không tự rơi về mean: config nói một đằng chạy một nẻo là thứ
    # không bao giờ tự lộ ra.
    pool: cls
    # CHỈ có tác dụng với backbone có BatchNorm (ViT-S/16 không có). true = giữ MỌI BN
    # ở eval suốt Stage 0: thống kê chạy giữ của pretrain (không bị local crop
    # và micro-batch nhỏ kéo lệch), γ/β vẫn học. Main stage chạy teacher ở
    # eval nên đọc ĐÚNG thống kê này.
    freeze_bn: true
    # τ_t PHẢI nhỏ hơn τ_s (sharpening) — đảo dấu bị TỪ CHỐI. Cùng với centering
    # đây là hai lực đẩy ngược nhau giữ DINO khỏi sụp.
    student_temp: 0.1
    teacher_temp: 0.04
    teacher_temp_start: 0.04   # ramp tuyến tính -> teacher_temp
    teacher_temp_warmup_epochs: 0.0
    center_momentum: 0.9
    momentum_start: 0.996      # EMA teacher, cosine -> momentum_end theo BƯỚC
    momentum_end: 1.0
    # Lớp prototype cuối bị giữ nguyên trong ngần này epoch đầu: nó là thứ dễ
    # sụp nhất (K vector cạnh tranh nhau ngay từ bước 1).
    freeze_last_layer_epochs: 1.0
    aug:
      ratio: [0.75, 1.3333]
      # 0.0 = TẮT lật ngang. Ảnh CXR có chiều: tim nằm bên trái, và dextrocardia
      # là một chẩn đoán chứ không phải một augmentation. Bật nó là dạy encoder
      # rằng trái/phải không quan trọng — đúng thứ báo cáo cần phân biệt.
      hflip: 0.0
      jitter_p: 0.8
      brightness: 0.3       # CXR là ảnh xám: chỉ sáng/tương phản có nghĩa
      contrast: 0.3
      blur_p: 0.5
      blur_sigma: [0.1, 2.0]
      solarize_p: 0.0
      solarize_thr: 128

# ── Kiểm định: A vs B, ghép cặp theo ảnh (`src/stats_ab.compare_all`) ──────
#   d_i = điểm(B, ảnh i) − điểm(A, ảnh i)
#   bootstrap ghép cặp (BCa, n_boot) -> CI95 + p_boot;  permutation đảo dấu
#   (n_perm) -> p_perm;  Holm RIÊNG từng họ trên các metric.
#   "Thắng" = cả hai bác H0 sau Holm VÀ |Cohen dz| >= dz_floor.
stats:
  method: paired
  alpha: 0.05
  n_boot: 10000
  n_perm: 10000
  ci_method: bca
  dz_floor: 0.10
  metrics: [bleu1, bleu2, bleu3, bleu4, rouge1, rouge2, rougeL, bertscore_f1]

# ── Đồ thị A vs B (`src/report_plots_ab.py`) — như $1 nhưng 2 candidate, bar NGANG ─
report:
  ab_plot:
    metrics: [bleu3, bleu4, rougeL, bertscore_f1]   # B3 · B4 · RL · BertF1
    gamma: auto               # xếp tầng: gốc × e^(γ−1); off = không scale
    gamma_spread: 0.18

# ── Lens (`src/lens_vextractor.py`, lệnh `lens`) — MỔ KHỐI Q, minh hoạ ─────────
# CHỈ chạy candidate B (Z của B giống A từng bit -> Q chính là B − A). HAI báo cáo
# trên CÙNG `n_samples` ảnh test bốc ngẫu nhiên theo `seed` (null = seed chung):
#   runs/<subdir>/Lens/Lens_Vision.html    Grad-CAM, nền luôn là X (ảnh 448² vào
#        Extractor). 5 cột = 5 mẫu; target = ảnh hưởng lên y (log-prob báo cáo) QUA
#        khối Q: dòng 1 cả khối Q (Σ ⟨∂y/∂Q[i], V_c[i]⟩), dòng 2 riêng Q[i] (pager).
#        Cuối trang: ma trận cosine 8×8 giữa các token Q mỗi mẫu — O (trước SNOP),
#        O_final (sau SNOP) của từng attention của CnA, và V_c — kèm cos̄ + erank.
#   runs/<subdir>/Lens/Lens_Language.md    Jacobian ‖∂y/∂h‖ token × lớp, lưới 3 dòng
#        (Z · Q · T) × 5 cột, thang màu CHUNG Z ∪ Q ∪ T trong mỗi cột + đường đứt ở
#        lớp sâu nhất có token chạm ngưỡng; ma trận attention Q[i] ↔ token bệnh lý
#        (embedding decoder) kèm top-p.
lens:
  enabled: true
  n_samples: 5
  seed: null                # null = `seed` chung của config
  target: ref_logprob       # ref_logprob | next_token  (y của báo cáo Language)
  cam: gradcam              # gradcam | gradcam++
  cam_stage: -3             # block lấy CAM: -3 = block đầu của 3 block V concat (28×28, bỏ 5 prefix)
  cam_image_weight: 0.5     # overlay MẶC ĐỊNH của Grad-CAM (show_cam_on_image): JET,
                            # cam = 0.5·heatmap + 0.5·X, rồi chia max
  percentile_clip: 99.0     # vmax chung của mỗi cột Jacobian = phân vị này của bể Z ∪ Q ∪ T
  reach_frac: 0.10          # đường đứt: lớp sâu nhất có token đạt 0.10 × vmax
  attn_top_p: 0.90          # top-p bệnh mỗi Q[i]
  attn_temp: 1.0            # τ trong softmax(τ · q̂·ê / √d)
  cmap: inferno             # CHỈ cho heatmap của báo cáo Language (CAM luôn dùng JET)
  dir: Lens

wandb:
  enabled: true
  project: rgexp-vextractor
  entity: null
  run_name: null
  group: "vextractor-q-snop"
  resume_same_run: false
  mode: online
  tags: [vextractor, dinov3-vits16, cna-qformer, snop-mha, qlora, r32, mimic-cxr]
  notes: ""
  log_every: 20
  log_samples: 20

output:
  dir: ./runs
  # Repo CŨ, không tạo repo mới -> current/$2.2.2_V-Extractor-SNOP-MHA_Test/
  # (thí nghiệm con thứ 2 của §2.2: CnA dùng SNOP-MHA; $2.2 KHÔNG bị ghi đè)
  #   Reports/                 REPORT.md, manifest, metrics, predictions, arms/ (tem)
  #   fixture/                 = fixture của $1 (cùng vân tay)
  #   weights/<B>/             adapter + vextractor_branch + vextractor_stage0 + train_stats
  #   stage0/                  stage0_history.json
  # A không đẩy weight (nằm ở current/$1_LoRA_Test/weights/qlora_r32_decoder).
  hub_repo: RGExp123/Research_results
  hub_repo_type: dataset
  hub_root: current
  hub_index: "2.2.2"
  hub_title: V-Extractor-SNOP-MHA
  push: true
  push_each_arm: true
  pull: true
  subdir: "vextractor_snop"
  adapter_dir: ./adapters_vextractor_snop
  # Stage 0 = ĐÚNG checkpoint Stage 0 của §2.2 gốc (CnA MHA) — KHÔNG bao giờ
  # chạy DINO ở đây (`run_vextractor.ensure_origin_stage0`). Nguồn: bản cục bộ
  # `<adapter_dir>/_stage0` của gốc trước, rồi Hub `$2.2_V-Extractor_Test/stage0`
  # (chỉ `final/` đã xong, khớp vân tay). Không lấy được -> DỪNG. `--restage0`
  # bị từ chối; bản chép mang `_stage0/origin.json` (nguồn + sha256).
  stage0_from:
    required: true
    adapter_dir: ./adapters_vextractor
    hub_index: "2.2"
    hub_title: V-Extractor
