[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rgexp"
version = "0.1.0"
description = "MIMIC-CXR chest X-ray report generation với Gemma-3 4B-IT + QLoRA"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["rgexp*"]
