# ═════════════════════════════════════════════════════════════════════════════
# CONFIG GPU — NVIDIA GeForce RTX 3060 (12 GB GDDR6, Ampere, sm_86)
#
#     bash scripts/run_vextractor.sh --gpu rtx3060 --detach
#     (không truyền --gpu thì cũng là file này: src/config.DEFAULT_GPU)
#
# CHỈ các khoá trong src/config.GPU_KEYS, và PHẢI khai đủ tất cả — thiếu một
# khoá là DỪNG, không rơi về mặc định trong code. Thí nghiệm (lr, epoch, dữ liệu,
# batch HIỆU DỤNG) ở configs/vextractor.yaml. grad_accum được suy ra:
#     32 / 1 = 32
# Máy đích: 1× RTX 3060 12 GB · EPYC 7713 · 54 GB RAM · NVMe ~6/4.8 GB/s ·
# mạng ~5 Gbps · đĩa 100 GB. Mọi pipeline (train, sinh) TỰ chọn batch mỗi lượt
# để VRAM THIẾT BỊ (như nvidia-smi thấy, gồm CUDA context) chạm ~85% card.
# ═════════════════════════════════════════════════════════════════════════════
name: rtx3060
gpu_name_contains: "RTX 3060"
requires:
  cuda_arch: sm_86
  min_vram_gb: 11

set:
  # ── Huấn luyện adapter ──────────────────────────────────────────────────
  # Con số KHỞI ĐIỂM; autobatch (bên dưới) thay nó bằng ước lớn nhất của 32
  # vừa 85% VRAM. grad_accum tự suy lại để batch hiệu dụng vẫn = 32. Candidate
  # NẶNG NHẤT (r8 · decoder) được dò trước, số của nó KHOÁ cho cả bốn — batch
  # mỗi lượt đổi cách lấy trung bình loss theo token, nên bốn candidate phải
  # dùng CÙNG một số (src/run_lora.py của $1; $2 dùng lại khoá ấy).
  train.per_device_batch_size: 1
  train.gradient_checkpointing: true
  train.prefetch: true            # dựng micro-batch kế tiếp trong 1 luồng nền

  # ── Stage 0 (KHÔNG nạp Gemma) ────────────────────────────────
  # KHÔNG dùng chung gì với main stage. Main stage kéo cả decoder 4B; batch mỗi
  # lượt của nó do autobatch chọn (ước của `effective_batch` = 32, chỉ batch
  # HIỆU DỤNG phải bằng A). Stage 0 không có decoder — batch hiệu dụng của nó (stage0.batch_size = 32 ở
  # configs/vextractor.yaml) chỉ là con số của riêng nó, và mảnh vật lý được
  # phép leo tới tận 32 nếu VRAM cho phép. Nhưng Extractor DINOv3 ViT-S/16 ~21,6 M tham số VỚI
  # nhân thêm (2 + n_local) lượt forward của multi-crop, làm
  # activation của Stage 0 nặng rõ — nên 16 chỉ là KHỞI ĐIỂM, autobatch dò lại.
  # nhiều activation hơn hẳn. Đây chỉ là KHỞI ĐIỂM — autobatch dò lại — nhưng
  # khởi điểm quá cao là một lượt OOM trước khi nó dò được.
  stage0.micro_batch: 4           # khởi điểm; autobatch dò lại (ước của 32)
  stage0.probe_sizes: [1, 2, 4]   # điểm ĐO riêng của Stage 0 (main stage dùng
                                  # autobatch.probe_sizes bên dưới). Đo ở vùng
                                  # nó thật sự chạy thì ngoại suy tới 16/32 mới
                                  # đúng; dùng chung [2,4,8] là luôn ra micro thấp.

  # ── Sinh + chấm ─────────────────────────────────────────────────────────
  base.batch_size: 2              # dự phòng; autobatch sinh dò TỪ 64 XUỐNG (không khoá theo A)
  metrics.bertscore.batch_size: auto  # dò như hai pipeline kia (khởi điểm 64)

  # ── Batch theo hồi quy VRAM (src/autobatch.py) — BẬT, chừa lại 1 GiB ───
  # Đo = VRAM THIẾT BỊ (context + allocator giữ), không chỉ tensor. Lượt dò
  # train đệm tới max_seq_len (xấu nhất); lượt dò sinh ép đủ max_new_tokens.
  autobatch.enabled: true
  autobatch.target_frac: 0.92      # BỊ BỎ QUA khi reserve_gib khác null
  autobatch.reserve_gib: 1.0       # ngân sách = VRAM − 1 GiB (null -> dùng target_frac)
  autobatch.infer_reserve_gib: 0.3 # RIÊNG infer/sinh: VRAM − 0.3 GiB (null -> dùng reserve_gib)
  autobatch.probe_sizes: [2, 4, 8]   # điểm đo của MAIN STAGE (xem stage0.probe_sizes)
  autobatch.infer_max_bs: 64       # sinh: dò TỪ 64 XUỐNG (48, 32, 24, …) tới nấc vừa ngân sách

  # ── I/O (src/hw.py, src/data.py, src/prefetch.py) ───────────────────────
  # workers auto = số vCPU container thật được cấp (cgroup), trần 32.
  # zip_mode download: mạng 5 Gbps + đĩa 100 GB -> tải trọn img_dir.zip
  # (17.7 GB, ~1-3 phút với hf_transfer) rồi trích SONG SONG từ NVMe, nhanh hơn
  # hẳn stream range-request một kết nối. `content` = theo data.zip_mode.
  io.workers: auto
  io.prefetch_depth: 3            # số micro-batch dựng sẵn trước GPU
  io.pin_memory: true             # CPU->GPU không chặn (pinned + non_blocking)
  io.zip_mode: download
