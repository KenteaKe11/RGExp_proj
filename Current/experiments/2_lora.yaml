# Key 2: Phi-3.5 Vision QLoRA with a fully trainable vision projector.
id: 2
key: lora
title: LoRA
kind: lora
models: [phi35_vision]
lora:
  quantization: nf4
  double_quant: true
  compute_dtype: bfloat16
  projector_module: model.vision_embed_tokens.img_projection
  quantization_skip_modules:
    - model.vision_embed_tokens.img_processor
    - model.vision_embed_tokens.img_projection
  decoder_targets:
    attention: [qkv_proj, o_proj]
    all_linear: [qkv_proj, o_proj, gate_up_proj, down_proj]
  ranks: [2, 4, 8, 16]
  alpha_multiplier: 2           # alpha = 2 × rank
  dropout: 0.05
  base_candidate: true
